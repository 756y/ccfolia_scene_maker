========================================== */
function updateList() {

    const sceneObjectList = document.getElementById("sceneObjectList");
    const markerObjectList = document.getElementById("markerObjectList");
    const sceneObjectCount = document.getElementById("sceneObjectCount");
    const markerObjectCount = document.getElementById("markerObjectCount");

    sceneObjectList.innerHTML = "";
    markerObjectList.innerHTML = "";

    const shared = [...sharedObjects].sort((a,b) => b.z - a.z);
    const scene = getCurrentScene();
    const markers = scene
        ? [...scene.objects].filter(object => object.type === "sceneMarker").sort((a,b) => b.z - a.z)
        : [];

    if (sceneObjectCount) sceneObjectCount.textContent = shared.length;
    if (markerObjectCount) markerObjectCount.textContent = markers.length;

    function buildObjectItem(object, includeVisibility) {
        if (typeof object.locked !== "boolean") object.locked = false;
        if (includeVisibility && typeof object.visible !== "boolean") object.visible = true;

        const div = document.createElement("div");
        div.className = "object-item";
        if (object.id === selectedId) div.classList.add("selected");

        const thumb = document.createElement("img");
        thumb.className = "object-item-thumb";
        thumb.src = object.imageUrl || "";
        thumb.alt = "";

        const info = document.createElement("div");
        info.className = "object-item-info";

        const nameSpan = document.createElement("span");
        nameSpan.className = "object-item-name";
        nameSpan.textContent = object.name || "未命名元件";

        const meta = document.createElement("div");
        meta.className = "object-item-meta";
        const z = document.createElement("span");
        z.textContent = `Z ${object.z}`;
        const size = document.createElement("span");
        size.textContent = `${Math.round(object.width)} × ${Math.round(object.height)}`;
        meta.appendChild(z);
        meta.appendChild(size);

        info.appendChild(nameSpan);
        info.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "object-item-actions";

        if (includeVisibility) {
            const visibilityButton = document.createElement("button");
            visibilityButton.type = "button";
            visibilityButton.className = "object-state-button";
            visibilityButton.title = object.visible !== false ? "隱藏元件" : "顯示元件";
            visibilityButton.textContent = object.visible !== false ? "👁" : "🚫";
            visibilityButton.addEventListener("click", function(e) {
                e.stopPropagation();
                object.visible = object.visible === false;
                render();
            });
            actions.appendChild(visibilityButton);
        }

        const lockButton = document.createElement("button");
        lockButton.type = "button";
        lockButton.className = "object-state-button";
        lockButton.title = object.locked === true ? "解除鎖定" : "鎖定元件";
        lockButton.textContent = object.locked === true ? "🔒" : "🔓";
        lockButton.addEventListener("click", function(e) {
            e.stopPropagation();
            object.locked = !object.locked;
            render();
        });
        actions.appendChild(lockButton);

        /* 複製 */
        const duplicateButton = document.createElement("button");
        duplicateButton.type = "button";
        duplicateButton.className = "object-state-button";
        duplicateButton.title = "複製物件";
        duplicateButton.textContent = "⧉";
        duplicateButton.addEventListener("click", function(e) {
            e.stopPropagation();
            selectedId = object.id;
            duplicateSelectedObject();
        });
        actions.appendChild(duplicateButton);

        /* 刪除 */
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "object-state-button object-list-delete";
        deleteButton.title = "刪除物件";
        deleteButton.textContent = "×";
        deleteButton.addEventListener("click", function(e) {
            e.stopPropagation();
            selectedId = object.id;
            deleteSelectedObject();
        });
        actions.appendChild(deleteButton);

        div.appendChild(thumb);
        div.appendChild(info);
        div.appendChild(actions);
        div.addEventListener("click", function() { selectObject(object.id); });
        return div;
    }

    if (shared.length === 0) {
        sceneObjectList.innerHTML = '<div class="empty-list">尚未加入畫面元件</div>';
    } else {
        shared.forEach(object => sceneObjectList.appendChild(buildObjectItem(object, true)));
    }

    if (markers.length === 0) {
        markerObjectList.innerHTML = '<div class="empty-list">目前場景沒有標誌元件</div>';
    } else {
        markers.forEach(object => markerObjectList.appendChild(buildObjectItem(object, false)));
    }

    recordHistoryAfterRender();
}

/* ==========================================
   24 × 24 px 格線吸附
   ------------------------------------------
   重要：
   只吸附「位置」。
   
   不修改：
   - width
   - height
   
   因此：
   - 不會破壞圖片比例
   - 不會為了格線強制改圖片尺寸
   - 圖片可以保留原本的任意比例
   ========================================== */

const SCENE_WIDTH = 1920;
const SCENE_HEIGHT = 1080;
const SCENE_GRID_SIZE = 24;

const SCENE_ORIGIN_X =
    SCENE_WIDTH / 2;

const SCENE_ORIGIN_Y =
    SCENE_HEIGHT / 2;


/*
 * 將座標吸附到 24px 格線。
 *
 * 這裡使用 Scene 中央作為格線原點，
 * 與目前的 Scene Grid 設定一致。
 */
function snapCoordinateToGrid(value, origin) {

    return (
        origin +
        Math.round(
            (value - origin) /
            SCENE_GRID_SIZE
        ) *
        SCENE_GRID_SIZE
    );

}


/*
 * 圖片吸附：
 *
 * ★ 只處理左上角位置
 * ★ 完全不修改 width / height
 *
 * 因此圖片會「貼著格線開始」，
 * 而不是讓圖片中心卡在格線上。
 */
function snapObjectToGrid(object) {

    if (!object) return;

    object.x =
        Math.round(object.x / SCENE_GRID_SIZE) *
        SCENE_GRID_SIZE;

    object.y =
    Math.round(
        (object.y - 12) / SCENE_GRID_SIZE
    ) *
    SCENE_GRID_SIZE +
    12;
}


/* ==========================================
   拖曳
   支援：
   - 滑鼠
   - 手指觸控
   - 手寫筆
========================================== */

let dragging = false;

let dragObject = null;

let dragStartX = 0;

let dragStartY = 0;

let objectStartX = 0;

let objectStartY = 0;


/* ==========================================
   開始拖曳
========================================== */

function startDrag(e) {

    /*
     * 防止同時啟動 Scene 平移
     */
    e.stopPropagation();

    /*
     * 阻止手機瀏覽器把手指操作
     * 當成頁面滑動 / 縮放
     */
    e.preventDefault();

    const id =
        e.currentTarget.dataset.id;

    selectObject(id);

    const object =
        getSelectedObject();

    if (!object) return;


    /*
 * 所有物件鎖定後都不能拖曳
 */
if (object.locked === true) {
    return;
}


    beginHistoryAction();

    dragging = true;

    dragObject = object;


    /*
     * Pointer Events 同時支援：
     *
     * 滑鼠
     * 手指
     * 手寫筆
     */
    dragStartX = e.clientX;

    dragStartY = e.clientY;


    objectStartX = object.x;

    objectStartY = object.y;


    /*
     * 讓瀏覽器把後續 pointermove
     * 都交給目前這張圖片
     *
     * 手指拖曳會穩定很多
     */
    if (
        e.currentTarget.setPointerCapture &&
        e.pointerId !== undefined
    ) {
        try {
            e.currentTarget.setPointerCapture(
                e.pointerId
            );
        } catch (error) {
            console.warn(
                "Pointer Capture 啟用失敗：",
                error
            );
        }
    }

}


/* ==========================================
   拖曳中
========================================== */

document.addEventListener(
    "pointermove",
    function(e) {

        if (
            !dragging ||
            !dragObject
        ) {
            return;
        }


        /*
         * 防止手機瀏覽器在拖曳時
         * 同時捲動畫面
         */
        e.preventDefault();


        /*
         * 因為 Scene 可能有縮放，
         * 所以要除以 viewScale。
         */
        const dx =
            (e.clientX - dragStartX) /
            viewScale;

        const dy =
            (e.clientY - dragStartY) /
            viewScale;


        dragObject.x =
            objectStartX + dx;

        dragObject.y =
            objectStartY + dy;


        /*
         * 只有勾選「對齊格線」
         * 才自動吸附。
         */
        if (
            getCurrentScene()?.alignWithGrid === true
        ) {

            snapObjectToGrid(
                dragObject
            );

        }
        
        /* 即時更新右側 X / Y */
        updatePositionInputs(dragObject);


        /*
         * 更新畫面
         */
        render();

    },
    {
        passive: false
    }
);


/* ==========================================
   結束拖曳
========================================== */

function stopDrag(e) {

    if (!dragging) return;

    /*
     * 拖曳結束前，再同步一次 X / Y
     */
    updatePositionInputs(dragObject);

    if (
        e &&
        e.currentTarget &&
        e.pointerId !== undefined &&
        e.currentTarget.releasePointerCapture
    ) {
        try {
            e.currentTarget.releasePointerCapture(
                e.pointerId
            );
        } catch (error) {
            /* 不需要中斷拖曳結束流程 */
        }
    }

    dragging = false;
    dragObject = null;

    finishHistoryAction();
}


/*
 * 手指 / 滑鼠 / 手寫筆
 * 都會進入這裡
 */
document.addEventListener(
    "pointerup",
    stopDrag
);


/*
 * 如果手指拖出瀏覽器畫面，
 * 也要強制結束拖曳。
 */
document.addEventListener(
    "pointercancel",
    stopDrag
);

/*
  =========================================================
  SHA-256
  =========================================================
*/

async function sha256Hex(bytes){

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            bytes
        );

    const hashBytes =
        new Uint8Array(hashBuffer);

    return Array.from(hashBytes)
        .map(
            b =>
                b.toString(16)
                 .padStart(2, "0")
        )
        .join("");
}


/*
  =========================================================
  Data URL → Uint8Array
  =========================================================
*/

function dataURLToBytes(dataURL){

    if(!dataURL){
        return null;
    }

    const parts =
        dataURL.split(",");

    if(parts.length !== 2){
        throw new Error(
            "無法解析圖片 Data URL。"
        );
    }

    const base64 =
        parts[1];

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes;
}


/*
  =========================================================
  取得 Data URL MIME
  =========================================================
*/

function getDataURLMime(dataURL){

    if(!dataURL){
        return "image/png";
    }

    const match =
        dataURL.match(
            /^data:([^;,]+)/
        );

    return match
        ? match[1]
        : "image/png";
}


/*
  =========================================================
  MIME → 副檔名
  =========================================================
*/

function getImageExtension(mime){

    switch(mime){

        case "image/jpeg":
            return ".jpg";

        case "image/webp":
            return ".webp";

        case "image/gif":
            return ".gif";

        case "image/svg+xml":
            return ".svg";

        case "image/png":
        default:
            return ".png";

    }

}


/*
  =========================================================
  Uint8Array 合併
  =========================================================
*/

function concatBytes(...arrays){

    let total = 0;

    arrays.forEach(
        array => {
            total += array.length;
        }
    );

    const result =
        new Uint8Array(total);

    let offset = 0;

    arrays.forEach(
        array => {

            result.set(
                array,
                offset
            );

            offset +=
                array.length;

        }
    );

    return result;
}


/*
  =========================================================
  CRC-32
  =========================================================
*/

function crc32(bytes){

    let crc =
        0xffffffff;

    for(
        let i = 0;
        i < bytes.length;
        i++
    ){

        crc ^= bytes[i];

        for(
            let j = 0;
            j < 8;
            j++
        ){

            crc =
                (crc >>> 1) ^
                (
                    0xedb88320 &
                    -(crc & 1)
                );

        }

    }

    return (
        crc ^ 0xffffffff
    ) >>> 0;
}


/*
  =========================================================
  Little Endian 16-bit
  =========================================================
*/

function u16(n){

    return new Uint8Array([

        n & 0xff,

        (n >>> 8) & 0xff

    ]);

}


/*
  =========================================================
  Little Endian 32-bit
  =========================================================
*/

function u32(n){

    return new Uint8Array([

        n & 0xff,

        (n >>> 8) & 0xff,

        (n >>> 16) & 0xff,

        (n >>> 24) & 0xff

    ]);

}


/*
  =========================================================
  建立 Store ZIP
  =========================================================

  ZIP 結構：

      __data.json
      .token
      <sha256>.png
      <sha256>.png
      ...

  與角色製作器使用同一種 ZIP 結構。
*/

function createStoredZip(entries){

    const encoder =
        new TextEncoder();

    const localParts = [];

    const centralParts = [];

    let offset = 0;


    for(
        const entry of entries
    ){

        const nameBytes =
            encoder.encode(
                entry.name
            );

        const data =
            entry.data instanceof Uint8Array
                ? entry.data
                : new Uint8Array(
                    entry.data
                );


        const crc =
            crc32(data);


        /*
          Local File Header
        */

        const localHeader =
            concatBytes(

                u32(0x04034b50),

                u16(20),

                u16(0x0800),

                u16(0),

                u16(0),

                u16(0),

                u32(crc),

                u32(data.length),

                u32(data.length),

                u16(nameBytes.length),

                u16(0),

                nameBytes

            );


        localParts.push(
            localHeader,
            data
        );


        /*
          Central Directory Header
        */

        const centralHeader =
            concatBytes(

                u32(0x02014b50),

                u16(20),

                u16(20),

                u16(0x0800),

                u16(0),

                u16(0),

                u16(0),

                u32(crc),

                u32(data.length),

                u32(data.length),

                u16(nameBytes.length),

                u16(0),

                u16(0),

                u16(0),

                u16(0),

                u32(0),

                u32(offset),

                nameBytes

            );


        centralParts.push(
            centralHeader
        );


        offset +=
            localHeader.length +
            data.length;

    }


    const localData =
        concatBytes(
            ...localParts
        );

    const centralData =
        concatBytes(
            ...centralParts
        );


    /*
      End Of Central Directory
    */

    const endRecord =
        concatBytes(

            u32(0x06054b50),

            u16(0),

            u16(0),

            u16(entries.length),

            u16(entries.length),

            u32(centralData.length),

            u32(localData.length),

            u16(0)

        );


    return concatBytes(

        localData,

        centralData,

        endRecord

    );

}


/* =========================================================
   建立 CCFOLIA Room JSON
   ========================================================= */

async function buildSceneRoom() {

    // 匯出開始時固定目前畫面上的場景順序，避免 ZIP 建立期間順序來源不一致。
    const exportScenes = scenes.slice();

    const resources = {};

    const imageFiles = new Map();

    /*
     * Cocofolia：
     * 一般畫面元件放在 entities.items
     */
    const itemEntities = {};


async function addImage(dataURL) {

    if (!dataURL) {
        return null;
    }


    const bytes =
        dataURLToBytes(dataURL);

    if (!bytes) {
        return null;
    }


    const hash =
        await sha256Hex(bytes);


    /*
     * 所有圖片統一使用 PNG
     */
    const filename =
        hash + ".png";


    if (!imageFiles.has(filename)) {

        imageFiles.set(
            filename,
            {
                name:
                    filename,

                data:
                    bytes
            }
        );

    }


    resources[filename] = {

        type:
            "image/png"

    };


    return filename;

}

    /*
     * Room 本身不再儲存背景 / 前景
     */

    const room = {

        backgroundUrl: null,

        foregroundUrl: null,

        sceneId:
            exportScenes.length > 0
                ? exportScenes[0].id
                : null

    };


    /*
     * 建立所有 Scene
     */

    const sceneEntities = {};
    
    /*
 * =====================================================
 * 全場景共用的畫面元件
 *
 * → entities.items
 * =====================================================
 */

for (const object of sharedObjects) {

    /*
     * 將鏡像 / 透明度直接烘進 PNG
     */
    const prepared =
        await prepareObjectImage(
            object
        );

    const imageFilename =
        await addImage(
            prepared
                ? prepared.dataURL
                : object.imageUrl
        );

    const x =
    (object.x - 960)/24;

const y =
    (object.y - 540)/24;

    const width =
        object.width / 24;

    const height =
        object.height / 24;

    itemEntities[object.id] = {

        x:
            x,

        y:
            y,

        z:
            object.z || 0,

        angle:
            object.angle || 0,

        width:
            width,

        height:
            height,

        deckId:
            null,

        locked:
    object.locked === true,

visible:
    object.visible !== false,

        closed:
            false,

        withoutOwner:
            false,

        freezed:
            false,

        type:
            "object",

        active:
    object.visible !== false,

        memo:
            "",

        imageUrl:
            imageFilename,

        coverImageUrl:
            null,

        clickAction:
            null,

        order:
            0

    };

}


    for (const sceneData of exportScenes) {

        const scene = {

    name:
        sceneData.name,

    backgroundUrl:
        await addImage(
            sceneData.backgroundData
        ),

    foregroundUrl:
        await addImage(
            sceneData.foregroundData
        ),

    /*
     * 前景尺寸：
     * 編輯器使用「格數」儲存
     * 例如 40 × 30
     */
    fieldWidth:
        Number(sceneData.foregroundWidth) || 40,

    fieldHeight:
        Number(sceneData.foregroundHeight) || 30,

    /*
     * true  = 裁切符合前景尺寸
     * false = 直接拉伸
     *
     * Cocofolia：
     * cover = 裁切
     * fill  = 拉伸
     */
    fieldObjectFit:
        sceneData.foregroundFit === true
            ? "cover"
            : "fill",

    /*
     * 對齊格線
     */
    alignWithGrid: sceneData.alignWithGrid === true,

    displayGrid: false,

    gridSize: 1,

    markers: {},

    text: "",

    locked: false,

    order:
        exportScenes.indexOf(sceneData)

};


/*
 * =====================================================
 * 匯出這個場景裡的物件
 *
 * Cocofolia：
 *
 * 一般「畫面元件」
 * → entities.items
 *
 * 「場景標誌元件」
 * → scenes[sceneId].markers
 * =====================================================
 */

for (
    const object
    of sceneData.objects
) {

    /*
     * 將鏡像 / 透明度直接烘進 PNG
     */
    const prepared =
        await prepareObjectImage(
            object
        );

    const imageFilename =
        await addImage(
            prepared
                ? prepared.dataURL
                : object.imageUrl
        );


    const x =
    (object.x - 960)/24;

const y =
    (object.y - 540)/24;
    

    const width =
        object.width / 24;


    const height =
        object.height / 24;


    const objectId =
        object.id ||
        crypto.randomUUID()
            .replace(/-/g, "")
            .slice(0, 12);


    /*
     * =============================================
     * ① 場景標誌元件
     *
     * type === "sceneMarker"
     * → 存進目前 Scene 的 markers
     * =============================================
     */

    if (object.type === "sceneMarker") {

        scene.markers[objectId] = {

            x:
                x,

            y:
                y,

            z:
                object.z || 0,

            width:
                width,

            height:
                height,

            angle:
                Number(object.angle) || 0,

            locked:
                object.locked === true,

            freezed:
                false,

            text:
                "",

            imageUrl:
                imageFilename,

            clickAction:
                null

        };

    }


    /*
     * =============================================
     * ② 一般畫面元件
     *
     * 不是 sceneMarker
     * → 存進 entities.items
     * =============================================
     */

    else {

        itemEntities[objectId] = {

            x:
                x,

            y:
                y,

            z:
                object.z || 0,

            angle:
                object.angle || 0,

            width:
                width,

            height:
                height,

            deckId:
                null,

            locked:
                false,

            visible:
                true,

            closed:
                false,

            withoutOwner:
                false,

            freezed:
                false,

            type:
                "object",

            active:
                false,

            memo:
                "",

            imageUrl:
                imageFilename,

            coverImageUrl:
                null,

            clickAction:
                null,

            order:
                0

        };

    }

}


        sceneEntities[sceneData.id] =
            scene;

    }


    /*
     * 最終 Room JSON
     * 明確依照編輯器中的場景陣列順序重建 scenes 字典，並同步每個場景的 order。
     */
    const orderedSceneEntities = {};
    exportScenes.forEach((sceneData, index) => {
        const exportedScene = sceneEntities[sceneData.id];
        if (exportedScene) {
            exportedScene.order = index;
            orderedSceneEntities[sceneData.id] = exportedScene;
        }
    });

    const data = {

        meta: {

            version: "1.1.0"

        },

        entities: {

    room: room,

    items:
        itemEntities,

    decks: {},

    notes: {},

    characters: {},

    effects: {},

    scenes:
        orderedSceneEntities,

    savedatas: {},

    snapshots: {}

},

        resources:
            resources

    };


    return {

        data: data,

        imageFiles: imageFiles

    };

}





/*
  =========================================================
  ZIP 匯出
  =========================================================
*/

document
    .getElementById("exportZIP")
    .addEventListener(
        "click",
        async function(){

            const status =
                document.getElementById(
                    "zipStatus"
                );


            try{

                status.style.color =
                    "#aaa";

                status.textContent =
                    "正在建立 CCFOLIA Room ZIP…";


                /*
                  建立場景資料
                */

                const result =
                    await buildSceneRoom();


                const roomData =
                    result.data;


                const imageFiles =
                    result.imageFiles;


                /*
                  ------------------------------------------------
                  __data.json
                  ------------------------------------------------
                */

                const dataJSON =
                    JSON.stringify(
                        roomData,
                        null,
                        2
                    ) + "\n";


                const dataBytes =
                    new TextEncoder().encode(
                        dataJSON
                    );


                /*
                  ------------------------------------------------
                  data.json SHA-256
                  ------------------------------------------------
                */

                const dataHash =
                    await sha256Hex(
                        dataBytes
                    );


                /*
                  ------------------------------------------------
                  .token
                  ------------------------------------------------
                */

                const tokenText =
                    "0." +
                    dataHash;


                const tokenBytes =
                    new TextEncoder().encode(
                        tokenText
                    );


                /*
                  ------------------------------------------------
                  ZIP Entries
                  ------------------------------------------------
                */

                const zipEntries = [

                    {

                        name:
                            "__data.json",

                        data:
                            dataBytes

                    },

                    {

                        name:
                            ".token",

                        data:
                            tokenBytes

                    }

                ];


                /*
                  ------------------------------------------------
                  加入所有圖片
                  ------------------------------------------------
                */

                for(
                    const image
                    of imageFiles.values()
                ){

                    zipEntries.push({

                        name:
                            image.name,

                        data:
                            image.data

                    });

                }


                /*
                  ------------------------------------------------
                  建立 ZIP
                  ------------------------------------------------
                */

                const zipBytes =
                    createStoredZip(
                        zipEntries
                    );


                const blob =
                    new Blob(
                        [zipBytes],
                        {
                            type:
                                "application/zip"
                        }
                    );


                /*
                  ------------------------------------------------
                  ZIP 檔名
                  ------------------------------------------------
                */

                const downloadName =
                    "cocofolia_scene-room.zip";


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;

                a.download =
                    downloadName;


                document.body.appendChild(
                    a
                );

                a.click();

                a.remove();


                setTimeout(
                    () =>
                        URL.revokeObjectURL(
                            url
                        ),
                    1000
                );


                /*
                  ------------------------------------------------
                  完成訊息
                  ------------------------------------------------
                */

                status.style.color =
                    "#7bd99a";

                status.textContent =
                    "✓ CCFOLIA Room ZIP 已建立。\n" +
                    "包含：__data.json、.token、" +
                    imageFiles.size +
                    " 張圖片。";


            }catch(error){

                console.error(
                    "Room ZIP 建立失敗：",
                    error
                );


                status.style.color =
                    "#ff7b7b";

                status.textContent =
                    "❌ Room ZIP 建立失敗：\n" +
                    error.message;

            }

        }
    );


/* ==========================================
   PNG 輸出
========================================== */

document.getElementById("exportPNG")
.addEventListener("click", async function() {

    const canvas =
        document.createElement("canvas");

    const sceneWidth = 1920;
const sceneHeight = 1080;

    canvas.width = sceneWidth;

    canvas.height = sceneHeight;

    const ctx =
        canvas.getContext("2d");


    /*
        背景
    */

    if (getBackgroundData()) {

        const img =
            await loadImage(getBackgroundData());

        ctx.drawImage(
            img,
            0,
            0,
            sceneWidth,
            sceneHeight
        );

    }


    /*
        物件
    */

    const sorted =
        [...getObjects()].sort(
            (a,b) => a.z - b.z
        );


    for (const object of sorted) {

        const img =
            await loadImage(object.imageUrl);

        ctx.save();

        ctx.globalAlpha =
            object.opacity;

        ctx.translate(
            object.x + object.width / 2,
            object.y + object.height / 2
        );

        ctx.rotate(
            object.angle *
            Math.PI /
            180
        );

        ctx.scale(
            object.flipX ? -1 : 1,
            object.flipY ? -1 : 1
        );

        ctx.drawImage(
            img,
            -object.width / 2,
            -object.height / 2,
            object.width,
            object.height
        );

        ctx.restore();

    }


/*
    前景
*/

if (getForegroundData()) {

    const scene =
        getCurrentScene();

    const img =
        await loadImage(
            getForegroundData()
        );

    const gridSize = 24;

const foregroundWidth =
    (Number(scene.foregroundWidth) || 40)
    * gridSize;

const foregroundHeight =
    (Number(scene.foregroundHeight) || 30)
    * gridSize;

    if (scene.foregroundFit === true) {

        /*
         * 等比例縮放 + 中央裁切
         */

        const scale =
            Math.max(
                foregroundWidth / img.width,
                foregroundHeight / img.height
            );

        const drawWidth =
            img.width * scale;

        const drawHeight =
            img.height * scale;

        const offsetX =
            (foregroundWidth - drawWidth) / 2;

        const offsetY =
            (foregroundHeight - drawHeight) / 2;

        const foregroundX =
    (sceneWidth - foregroundWidth) / 2;

const foregroundY =
    (sceneHeight - foregroundHeight) / 2;

ctx.drawImage(
    img,
    foregroundX,
    foregroundY,
    foregroundWidth,
    foregroundHeight
);

    } else {

        /*
         * 不勾選：
         * 直接拉伸到指定前景尺寸
         */

        ctx.drawImage(
            img,
            0,
            0,
            foregroundWidth,
            foregroundHeight
        );

    }

}

    canvas.toBlob(function(blob) {

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "cocofolia_scene.png";

        a.click();

        URL.revokeObjectURL(url);

    });

});


function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.onload = () =>
            resolve(img);

        img.onerror = reject;

        img.src = src;

    });

}


/* ==========================================
   初始化 / 重設編輯器
========================================== */

async function clearPersistedEditorState() {
    try {
        const db = await openAutosaveDB();
        await new Promise((resolve, reject) => {
            const transaction = db.transaction(AUTOSAVE_STORE_NAME, "readwrite");
            transaction.objectStore(AUTOSAVE_STORE_NAME).delete(AUTOSAVE_KEY);
            transaction.oncomplete = resolve;
            transaction.onerror = () => reject(transaction.error || new Error("清除自動儲存失敗"));
            transaction.onabort = () => reject(transaction.error || new Error("清除自動儲存中止"));
        });
        db.close();
    } catch (error) {
        console.warn("IndexedDB 初始化清除失敗：", error);
    }

    try {
        localStorage.removeItem(AUTOSAVE_DB_NAME + "_" + AUTOSAVE_KEY);
    } catch (error) {
        console.warn("localStorage 初始化清除失敗：", error);
    }
}

async function initializeEditor() {

    if (!restored && scenes.length === 0) {
        const firstScene = createScene("場景 1");
        scenes.push(firstScene);
        currentSceneId = firstScene.id;

    if (!scenes.some(scene => scene.id === currentSceneId)) {

    render();
    resetHistoryBaseline();

}

/* =========================================================
   VIEWPORT
   只控制「觀看方式」
   不會修改物件座標
========================================================= */

let viewScale = 1;
let viewX = 0;
let viewY = 0;

let viewDragging = false;

let viewDragStartX = 0;
let viewDragStartY = 0;

let viewStartX = 0;
let viewStartY = 0;

const MIN_VIEW_SCALE = 0.1;
const MAX_VIEW_SCALE = 2;


/* ---------------------------------------------------------
   更新畫布顯示
--------------------------------------------------------- */

function updateViewport(){

    const scene =
        document.getElementById("scene");

    const zoomValue =
        document.getElementById("zoomValue");

    if(!scene) return;

    scene.style.transform =
        `translate(${viewX}px, ${viewY}px) scale(${viewScale})`;

    if(zoomValue){

        zoomValue.textContent =
            Math.round(viewScale * 100) + "%";

    }

}


/* ---------------------------------------------------------
   限制畫布不要完全跑出工作區
--------------------------------------------------------- */

function clampViewport(){

    const workspace =
        document.getElementById("workspace");

    if(!workspace) return;

    const vw =
        workspace.clientWidth;

    const vh =
        workspace.clientHeight;

    const canvasWidth =
        1920 * viewScale;

    const canvasHeight =
        1080 * viewScale;

    /*
     * 至少保留一部分畫布在畫面內
     */
    const minVisible = 120;

    const maxX =
        Math.max(
            0,
            (canvasWidth + vw) / 2 - minVisible
        );

    const maxY =
        Math.max(
            0,
            (canvasHeight + vh) / 2 - minVisible
        );

    viewX =
        Math.max(
            -maxX,
            Math.min(maxX, viewX)
        );

    viewY =
        Math.max(
            -maxY,
            Math.min(maxY, viewY)
        );

}


/* ---------------------------------------------------------
   設定縮放
--------------------------------------------------------- */

function setViewport(scale, x = viewX, y = viewY){

    viewScale =
        Math.max(
            MIN_VIEW_SCALE,
            Math.min(MAX_VIEW_SCALE, scale)
        );

    viewX = x;
    viewY = y;

    clampViewport();

    updateViewport();

}


/* ---------------------------------------------------------
   Fit：整張 1920 × 1080 顯示在工作區
--------------------------------------------------------- */

function fitCanvas(){

    const workspace =
        document.getElementById("workspace");

    if(!workspace) return;

    const vw =
        workspace.clientWidth;

    const vh =
        workspace.clientHeight;

    const padding = 40;

    const scaleX =
        (vw - padding) / 1920;

    const scaleY =
        (vh - padding) / 1080;

    viewScale =
        Math.min(scaleX, scaleY);

    viewScale =
        Math.max(
            MIN_VIEW_SCALE,
            Math.min(MAX_VIEW_SCALE, viewScale)
        );

    viewX = 0;
    viewY = 0;

    updateViewport();

}


/* ---------------------------------------------------------
   滾輪縮放
--------------------------------------------------------- */

document
.getElementById("workspace")
.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        const rect =
            this.getBoundingClientRect();

        /*
         * 滑鼠相對於工作區中心
         */
        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;

        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;

        /*
         * 找到滑鼠目前對應到 Scene 的哪個位置
         */
        const canvasX =
            (mouseX - viewX) /
            viewScale;

        const canvasY =
            (mouseY - viewY) /
            viewScale;

        const factor =
            e.deltaY < 0
                ? 1.1
                : 0.9;

        const newScale =
            Math.max(
                MIN_VIEW_SCALE,
                Math.min(
                    MAX_VIEW_SCALE,
                    viewScale * factor
                )
            );

        /*
         * 保持滑鼠指向的位置不動
         */
        viewScale = newScale;

        viewX =
            mouseX -
            canvasX * newScale;

        viewY =
            mouseY -
            canvasY * newScale;

        clampViewport();

        updateViewport();

    },
    { passive:false }
);


/* ---------------------------------------------------------
   放大
--------------------------------------------------------- */

document
.getElementById("zoomIn")
.addEventListener("click", function(){

    setViewport(
        viewScale * 1.1
    );

});


/* ---------------------------------------------------------
   縮小
--------------------------------------------------------- */

document
.getElementById("zoomOut")
.addEventListener("click", function(){

    setViewport(
        viewScale * 0.9
    );

});


/* ---------------------------------------------------------
   Fit
--------------------------------------------------------- */

document
.getElementById("fitCanvas")
.addEventListener("click", function(){

    fitCanvas();

});


/* ---------------------------------------------------------
   100%
--------------------------------------------------------- */

document
.getElementById("resetView")
.addEventListener("click", function(){

    setViewport(
        1,
        0,
        0
    );

});


/* ---------------------------------------------------------
   空白區域拖曳
--------------------------------------------------------- */

sceneCanvas.addEventListener(
    "mousedown",
    function(e){

        /*
         * 只有點到 Scene 空白處
         */
        if(e.target !== sceneCanvas) return;

        if(e.button !== 0) return;

        viewDragging = true;

        viewDragStartX = e.clientX;
        viewDragStartY = e.clientY;

        viewStartX = viewX;
        viewStartY = viewY;

        sceneCanvas.style.cursor =
    "grabbing";

        e.preventDefault();

    }
);


/* ---------------------------------------------------------
   平移
--------------------------------------------------------- */

document.addEventListener(
    "mousemove",
    function(e){

        if(!viewDragging) return;

        viewX =
            viewStartX +
            (e.clientX - viewDragStartX);

        viewY =
            viewStartY +
            (e.clientY - viewDragStartY);

        clampViewport();

        updateViewport();

    }
);


/* ---------------------------------------------------------
   結束平移
--------------------------------------------------------- */

document.addEventListener(
    "mouseup",
    function(){

        if(!viewDragging) return;

        viewDragging = false;

        sceneCanvas.style.cursor = "";

    }
);


/* ---------------------------------------------------------
   視窗大小改變
--------------------------------------------------------- */

window.addEventListener(
    "resize",
    function(){

        clampViewport();

        updateViewport();

    }
);


/* ---------------------------------------------------------
   初始 Fit
--------------------------------------------------------- */

requestAnimationFrame(
    function(){

        fitCanvas();

    }
);

</script>

</body>
