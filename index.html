   鎖定狀態同步：旋轉與透明度
========================================== */
function syncLockedRotationOpacityControls() {
    const object = getSelectedObject();
    const locked = !!object && object.locked === true;
    [
        document.getElementById("angleInput"),
        document.getElementById("angleRange"),
        document.getElementById("opacityInput")
    ].forEach(control => {
        if (!control) return;
        control.disabled = locked;
        control.title = locked ? "元件已鎖定，無法調整旋轉或透明度" : "";
    });
}

/* ==========================================
   Render
========================================== */

function render() {

    /*
     * 重用現有圖片 DOM，而不是每次 render 都清空再重建。
     * 拖曳、框選、復原/重做時可避免大型圖片重新載入造成短暫空白/閃爍。
     */
    const existingById = new Map(
        Array.from(objectsContainer.querySelectorAll(".scene-object"))
            .map(el => [el.dataset.id, el])
    );
    const liveIds = new Set();
    
    /* 舊版畫面元件補上預設狀態 */
    sharedObjects.forEach(object => {
        if (typeof object.visible !== "boolean") object.visible = true;
        if (typeof object.locked !== "boolean") object.locked = false;
    });

    getObjects().forEach(object => {
        let img = existingById.get(object.id);
        if (!img) {
            img = document.createElement("img");
            img.className = "scene-object";
            img.dataset.id = object.id;
            img.addEventListener("pointerdown", startDrag);
            img.addEventListener("pointerdown", function(e) { beginTouchLongPress(e, "object"); });
            img.addEventListener("contextmenu", function(e) {
                e.preventDefault();
                e.stopPropagation();
                const currentObject = getObjects().find(item => item.id === img.dataset.id);
                if (!currentObject) return;
                if (selectedIds.size > 1 && selectedIds.has(currentObject.id)) {
                    longPressSelectionIds = Array.from(selectedIds);
                    showCopyPasteMenu(e.clientX, e.clientY, "multi");
                } else {
                    selectedIds.clear();
                    selectedIds.add(currentObject.id);
                    selectedId = currentObject.id;
                    longPressSelectionIds = [currentObject.id];
                    selectObject(currentObject.id);
                    updateSelectionVisual();
                    showCopyPasteMenu(e.clientX, e.clientY, "object");
                }
            });
            img.addEventListener("click", function(e) {
                e.stopPropagation();
                const currentObject = getObjects().find(item => item.id === img.dataset.id);
                if (!currentObject) return;
                if (multiSelectMode) {
                    if (currentObject.locked === true) return;
                    selectedId = currentObject.id;
                    selectObject(currentObject.id);
                    updateSelectionVisual();
                } else {
                    selectedIds.clear();
                    selectedIds.add(currentObject.id);
                    selectObject(currentObject.id);
                }
            });
        }
        liveIds.add(object.id);

        // 只有圖片來源真的改變時才更新 src，避免重新解碼造成閃白。
        if (img.getAttribute("src") !== object.imageUrl) img.src = object.imageUrl;
        img.style.left = object.x + "px";
        img.style.top = object.y + "px";
        img.style.width = object.width + "px";
        img.style.height = object.height + "px";
        img.style.zIndex = Number(object.z) + 1;
        img.style.opacity = object.opacity;
        img.style.visibility = object.type === "sceneMarker" ? "visible" : (object.visible !== false ? "visible" : "hidden");
        img.style.transform = "rotate(" + object.angle + "deg) scale(" + (object.flipX ? -1 : 1) + "," + (object.flipY ? -1 : 1) + ")";
        // appendChild 既有節點只會調整順序，不會重載圖片；可維持 z 順序。
        objectsContainer.appendChild(img);
    });

    existingById.forEach((el, id) => {
        if (!liveIds.has(id)) el.remove();
    });

    updateList();
    updateSelectionVisual();
    updateDropHint();
    updateObjectQuickToolbar();
    renderResizeHandles();
    syncLockedRotationOpacityControls();
}

/* =========================================================
   圖片縮放功能
   ---------------------------------------------------------
   支援：
   - 滑鼠
   - 手指
   - 手寫筆
   - 四邊自由縮放
   - 四角等比例縮放
   - 支援旋轉後縮放
   - 同步右側寬度 / 高度
========================================================= */


/* ---------------------------------------------------------
   目前正在縮放的物件
--------------------------------------------------------- */

let resizing = false;

let resizeObject = null;

let resizeHandle = null;

let resizeStartX = 0;

let resizeStartY = 0;

let resizeStartWidth = 0;

let resizeStartHeight = 0;

let resizeStartCenterX = 0;

let resizeStartCenterY = 0;

let resizeAspectRatio = 1;


/* ---------------------------------------------------------
   取得滑鼠 / 手指在物件「未旋轉座標」中的位置
--------------------------------------------------------- */

function getResizeLocalPoint(
    object,
    clientX,
    clientY
) {

    /*
     * Scene 有縮放，
     * 所以先把螢幕座標轉回 Scene 座標。
     */

    const sceneRect =
        sceneCanvas.getBoundingClientRect();

    const sceneX =
        (clientX - sceneRect.left) /
        viewScale;

    const sceneY =
        (clientY - sceneRect.top) /
        viewScale;


    /*
     * 物件中心
     */

    const centerX =
        object.x +
        object.width / 2;

    const centerY =
        object.y +
        object.height / 2;


    /*
     * 先取得相對於中心的座標
     */

    const dx =
        sceneX - centerX;

    const dy =
        sceneY - centerY;


    /*
     * 反向旋轉。
     *
     * 因為圖片本身可能已經旋轉，
     * 所以需要把滑鼠位置轉回圖片自己的座標系。
     */

    const angle =
        -(Number(object.angle) || 0) *
        Math.PI / 180;

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);


    return {

        x:
            dx * cos -
            dy * sin,

        y:
            dx * sin +
            dy * cos

    };

}


/* ---------------------------------------------------------
   取得縮放控制點
--------------------------------------------------------- */

function getResizeHandlePosition(
    object,
    handle
) {

    const w =
        object.width;

    const h =
        object.height;

    let x =
        w / 2;

    let y =
        h / 2;


    switch (handle) {

        case "nw":
            x = 0;
            y = 0;
            break;

        case "n":
            x = w / 2;
            y = 0;
            break;

        case "ne":
            x = w;
            y = 0;
            break;

        case "e":
            x = w;
            y = h / 2;
            break;

        case "se":
            x = w;
            y = h;
            break;

        case "s":
            x = w / 2;
            y = h;
            break;

        case "sw":
            x = 0;
            y = h;
            break;

        case "w":
            x = 0;
            y = h / 2;
            break;

    }

    return {
        x,
        y
    };

}


/* ---------------------------------------------------------
   更新縮放控制點的位置
--------------------------------------------------------- */

function updateResizeHandlePositions() {

    const object =
        getSelectedObject();

    if (!object) return;


    const handles =
        document.querySelectorAll(
            ".resize-handle"
        );


    const centerX =
        object.x +
        object.width / 2;

    const centerY =
        object.y +
        object.height / 2;


    const angle =
        (Number(object.angle) || 0) *
        Math.PI / 180;


    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);


    handles.forEach(handle => {

        const type =
            handle.dataset.handle;

        const point =
            getResizeHandlePosition(
                object,
                type
            );


        /*
         * 轉成相對中心座標
         */

        const localX =
            point.x -
            object.width / 2;

        const localY =
            point.y -
            object.height / 2;


        /*
         * 再旋轉回 Scene 座標
         */

        const worldX =
            centerX +
            localX * cos -
            localY * sin;

        const worldY =
            centerY +
            localX * sin +
            localY * cos;


        handle.style.left =
            worldX + "px";

        handle.style.top =
            worldY + "px";


        /*
         * 讓控制點本身保持正方向，
         * 不跟著圖片一起旋轉。
         */

        handle.style.transform =
            "translate(-50%, -50%)";

    });

}


/* ---------------------------------------------------------
   建立縮放控制點
--------------------------------------------------------- */

function renderResizeHandles() {

    /*
     * 先刪除舊控制點
     */

    document
        .querySelectorAll(".resize-handle")
        .forEach(handle => {
            handle.remove();
        });


    const object =
        getSelectedObject();


    /*
     * 沒選取物件就不用顯示
     */

    if (!object) {
        return;
    }


    /*
     * 鎖定的畫面元件不能縮放。
     *
     * 地形標誌仍然可以縮放。
     */

    if (
        object.type !== "sceneMarker" &&
        object.locked === true
    ) {
        return;
    }


    const handles = [
        "nw",
        "n",
        "ne",
        "e",
        "se",
        "s",
        "sw",
        "w"
    ];


    handles.forEach(type => {

        const handle =
            document.createElement("div");

        handle.className =
            "resize-handle " +
            type;

        handle.dataset.handle =
            type;

        handle.addEventListener(
            "pointerdown",
            startResize
        );


        /*
         * 防止事件傳到圖片，
         * 否則會同時開始「拖曳圖片」。
         */

        handle.addEventListener(
            "click",
            function(e) {
                e.stopPropagation();
            }
        );


        objectsContainer.appendChild(
            handle
        );

    });


    updateResizeHandlePositions();

}


/* ---------------------------------------------------------
   開始縮放
--------------------------------------------------------- */

function startResize(e) {

    e.preventDefault();

    e.stopPropagation();


    const object =
        getSelectedObject();

    if (!object) return;


/*
 * 所有物件鎖定後都不能縮放
 */

if (object.locked === true) {
    return;
}


    beginHistoryAction();

    resizing = true;

    resizeObject =
        object;

    resizeHandle =
        e.currentTarget.dataset.handle;


    resizeStartX =
        e.clientX;

    resizeStartY =
        e.clientY;


    resizeStartWidth =
        object.width;

    resizeStartHeight =
        object.height;


    resizeStartCenterX =
        object.x +
        object.width / 2;

    resizeStartCenterY =
        object.y +
        object.height / 2;


    resizeAspectRatio =
        object.width /
        object.height;


    /*
     * Pointer Capture
     *
     * 手指操作時特別重要。
     */

    if (
        e.currentTarget.setPointerCapture &&
        e.pointerId !== undefined
    ) {

        try {

            e.currentTarget.setPointerCapture(
                e.pointerId
            );

        } catch (error) {

            console.warn(
                "Resize Pointer Capture 啟用失敗：",
                error
            );

        }

    }

}


/* ---------------------------------------------------------
   縮放中
--------------------------------------------------------- */

document.addEventListener(
    "pointermove",
    function(e) {

        if (
            !resizing ||
            !resizeObject
        ) {
            return;
        }


        e.preventDefault();


        const object =
            resizeObject;


        /*
         * 目前滑鼠 / 手指在圖片自己的座標系中
         */

        const point =
            getResizeLocalPoint(
                object,
                e.clientX,
                e.clientY
            );


        const startW =
            resizeStartWidth;

        const startH =
            resizeStartHeight;


        /*
         * 原本物件中心
         */

        const centerX =
            resizeStartCenterX;

        const centerY =
            resizeStartCenterY;


        /*
         * 最小尺寸
         */

        const MIN_SIZE = 10;


        let newWidth =
            startW;

        let newHeight =
            startH;


        /*
         * -----------------------------------------------
         * 角落：
         * 寬度、高度等比例縮放
         * -----------------------------------------------
         */

        if (
            resizeHandle === "nw" ||
            resizeHandle === "ne" ||
            resizeHandle === "se" ||
            resizeHandle === "sw"
        ) {

            /*
             * 依照目前拉動的方向，
             * 計算距離中心的 X / Y。
             */

            let widthFromPoint =
                Math.abs(point.x) * 2;

            let heightFromPoint =
                Math.abs(point.y) * 2;


            /*
             * 依照哪個方向比較明顯，
             * 決定等比例縮放基準。
             */

            const widthScale =
                widthFromPoint /
                startW;

            const heightScale =
                heightFromPoint /
                startH;


            let scale =
                Math.max(
                    widthScale,
                    heightScale
                );


            /*
             * 避免縮到 0。
             */

            scale =
                Math.max(
                    scale,
                    MIN_SIZE / Math.max(
                        startW,
                        startH
                    )
                );


            newWidth =
                startW * scale;

            newHeight =
                startH * scale;


            /*
             * 判斷是否應該翻到另一側。
             *
             * 為了讓操作簡單，
             * 這裡限制最小尺寸，不允許負尺寸。
             */

            newWidth =
                Math.max(
                    MIN_SIZE,
                    newWidth
                );

            newHeight =
                Math.max(
                    MIN_SIZE,
                    newHeight
                );

        }


        /*
         * -----------------------------------------------
         * 左右邊
         * -----------------------------------------------
         */

        else if (
            resizeHandle === "e" ||
            resizeHandle === "w"
        ) {

            newWidth =
                Math.max(
                    MIN_SIZE,
                    Math.abs(point.x) * 2
                );

            newHeight =
                startH;

        }


        /*
         * -----------------------------------------------
         * 上下邊
         * -----------------------------------------------
         */

        else if (
            resizeHandle === "n" ||
            resizeHandle === "s"
        ) {

            newWidth =
                startW;

            newHeight =
                Math.max(
                    MIN_SIZE,
                    Math.abs(point.y) * 2
                );

        }


        /*
         * -----------------------------------------------
         * 保留「相反邊」的位置
         *
         * 例如：
         *
         * 拉右邊
         * → 左邊固定
         *
         * 拉左邊
         * → 右邊固定
         *
         * 角落也是同樣概念。
         * -----------------------------------------------
         */

        let anchorLocalX =
            0;

        let anchorLocalY =
            0;


        switch (resizeHandle) {

            case "nw":
                anchorLocalX = startW / 2;
                anchorLocalY = startH / 2;
                break;

            case "n":
                anchorLocalX = 0;
                anchorLocalY = startH / 2;
                break;

            case "ne":
                anchorLocalX = -startW / 2;
                anchorLocalY = startH / 2;
                break;

            case "e":
                anchorLocalX = -startW / 2;
                anchorLocalY = 0;
                break;

            case "se":
                anchorLocalX = -startW / 2;
                anchorLocalY = -startH / 2;
                break;

            case "s":
                anchorLocalX = 0;
                anchorLocalY = -startH / 2;
                break;

            case "sw":
                anchorLocalX = startW / 2;
                anchorLocalY = -startH / 2;
                break;

            case "w":
                anchorLocalX = startW / 2;
                anchorLocalY = 0;
                break;

        }


        /*
         * 上面的 anchor 是「舊尺寸」下，
         * 相對中心的位置。
         *
         * 因為我們要讓這個點保持在原本世界座標，
         * 所以先算出它在 Scene 中的位置。
         */

        const angle =
            (Number(object.angle) || 0) *
            Math.PI / 180;


        const cos =
            Math.cos(angle);

        const sin =
            Math.sin(angle);


        const anchorWorldX =
            centerX +
            anchorLocalX * cos -
            anchorLocalY * sin;

        const anchorWorldY =
            centerY +
            anchorLocalX * sin +
            anchorLocalY * cos;


        /*
         * 新中心：
         *
         * 反向把固定點移回新尺寸的相對位置。
         */

        let newAnchorLocalX =
            anchorLocalX;

        let newAnchorLocalY =
            anchorLocalY;


        if (
            resizeHandle === "nw" ||
            resizeHandle === "w" ||
            resizeHandle === "sw"
        ) {

            newAnchorLocalX =
                newWidth / 2;

        }

        else if (
            resizeHandle === "ne" ||
            resizeHandle === "e" ||
            resizeHandle === "se"
        ) {

            newAnchorLocalX =
                -newWidth / 2;

        }

        else {

            newAnchorLocalX =
                0;

        }


        if (
            resizeHandle === "nw" ||
            resizeHandle === "n" ||
            resizeHandle === "ne"
        ) {

            newAnchorLocalY =
                newHeight / 2;

        }

        else if (
            resizeHandle === "sw" ||
            resizeHandle === "s" ||
            resizeHandle === "se"
        ) {

            newAnchorLocalY =
                -newHeight / 2;

        }

        else {

            newAnchorLocalY =
                0;

        }


        const newCenterX =
            anchorWorldX -
            (
                newAnchorLocalX * cos -
                newAnchorLocalY * sin
            );

        const newCenterY =
            anchorWorldY -
            (
                newAnchorLocalX * sin +
                newAnchorLocalY * cos
            );


        /*
         * 寫回物件資料
         */

        object.width =
            newWidth;

        object.height =
            newHeight;

        object.x =
            newCenterX -
            newWidth / 2;

        object.y =
            newCenterY -
            newHeight / 2;


        /*
         * 如果有開啟格線吸附，
         * 尺寸本身不吸附，
         * 避免拖曳縮放時跳動。
         *
         * X / Y 可以照原本規則處理。
         */

        if (
            getCurrentScene()?.alignWithGrid === true
        ) {

            /*
             * 這裡刻意不呼叫 snapObjectToGrid()
             *
             * 否則縮放時圖片會一直跳格。
             */

        }


        /*
         * 同步右側寬度 / 高度
         */

        document.getElementById(
            "widthInput"
        ).value =
            Math.round(
                object.width
            );

        document.getElementById(
            "heightInput"
        ).value =
            Math.round(
                object.height
            );


        /*
         * 同步 X / Y
         */

        updatePositionInputs(
            object
        );


        /*
         * 直接更新目前圖片，
         * 不重新 render，
         * 避免手機拖曳時畫面閃爍。
         */

        const img =
            document.querySelector(
                '.scene-object[data-id="' +
                object.id +
                '"]'
            );


        if (img) {

            img.style.left =
                object.x + "px";

            img.style.top =
                object.y + "px";

            img.style.width =
                object.width + "px";

            img.style.height =
                object.height + "px";

        }


        /*
         * 更新控制點位置
         */

        updateResizeHandlePositions();


        /*
         * 更新上方快捷工具列
         */

        updateObjectQuickToolbar();

    },
    {
        passive: false
    }
);


/* ---------------------------------------------------------
   結束縮放
--------------------------------------------------------- */

function stopResize(e) {

    if (!resizing) {
        return;
    }


    /*
     * 最後再同步一次輸入框
     */

    if (resizeObject) {

        document.getElementById(
            "widthInput"
        ).value =
            Math.round(
                resizeObject.width
            );

        document.getElementById(
            "heightInput"
        ).value =
            Math.round(
                resizeObject.height
            );

        updatePositionInputs(
            resizeObject
        );

    }


    /*
     * 結束狀態
     */

    resizing = false;

    resizeObject = null;

    resizeHandle = null;

    finishHistoryAction();

}

/* =========================================================
   執行快捷操作
========================================================= */

function executeQuickAction(action) {

    const object =
        getSelectedObject();

    if (!object) return;
    
    /* ==========================================
   可視 / 隱藏
========================================== */

if (action === "toggleVisible") {

    /* 地形標記不提供此功能 */
    if (object.type === "sceneMarker") {
        return;
    }

    object.visible =
        object.visible === false;

    render();

    return;
}


/* ==========================================
   鎖定 / 解鎖
========================================== */

if (action === "toggleLocked") {

    object.locked =
        !object.locked;

    render();

    return;
}
    
    if (action === "replaceImage") {

    replaceImageInput.click();

    return;

}


    /*
     * 水平鏡像
     */

    if (action === "flipX") {

        object.flipX =
            !object.flipX;

        render();

        return;

    }


    /*
     * 垂直鏡像
     */

    if (action === "flipY") {

        object.flipY =
            !object.flipY;

        render();

        return;

    }


/*
 * 圖層上移一層
 */

if (action === "moveUp") {

    moveSelectedObjectLayer(1);

    return;

}


/*
 * 圖層下移一層
 */

if (action === "moveDown") {

    moveSelectedObjectLayer(-1);

    return;

}


/*
 * 圖層置頂
 */

if (action === "moveTop") {

    moveSelectedObjectToTop();

    return;

}


/*
 * 圖層置底
 */

if (action === "moveBottom") {

    moveSelectedObjectToBottom();

    return;

}
    
    


    /*
     * 複製
     */

    if (action === "duplicate") {

        duplicateSelectedObject();

        return;

    }


    /*
     * 刪除
     */

    if (action === "delete") {

        deleteSelectedObject();

        return;

    }

}


/* =========================================================
   圖層移動
========================================================= */

function moveSelectedObjectLayer(direction) {

    const object =
        getSelectedObject();

    if (!object) return;

    /*
     * 上移一層：
     * Z + 1
     *
     * 下移一層：
     * Z - 1
     *
     * 不限制最低值。
     * 所以可以：
     * 1 → 0 → -1 → -2 → -3 ...
     */

    object.z =
        Number(object.z || 0) +
        direction;

    render();

    /*
     * 如果目前有選取物件，
     * 同步更新左側 Z 輸入框。
     */
    const zInput =
        document.getElementById("zInput");

    if (zInput) {
        zInput.value =
            object.z;
    }

}

/* =========================================================
   圖層置頂
========================================================= */

function moveSelectedObjectToTop() {

    const objects =
        getObjects();

    const object =
        getSelectedObject();

    if (!object) return;


    const sorted =
        [...objects]
            .sort(
                (a, b) =>
                    a.z - b.z
            );


    const highest =
        sorted[sorted.length - 1];

    if (!highest) return;


    /*
     * 已經是最上層
     */

    if (object.id === highest.id) {
        return;
    }


    /*
     * 取得目前最高 z
     */

    const maxZ =
        highest.z;


    /*
     * 讓目前物件直接到最上面
     */

    object.z =
        maxZ + 1;


    render();

}


/* =========================================================
   圖層置底
========================================================= */

function moveSelectedObjectToBottom() {

    const objects =
        getObjects();

    const object =
        getSelectedObject();

    if (!object) return;


    const sorted =
        [...objects]
            .sort(
                (a, b) =>
                    a.z - b.z
            );


    const lowest =
        sorted[0];

    if (!lowest) return;


    /*
     * 已經是最下層
     */

    if (object.id === lowest.id) {
        return;
    }


    /*
     * 取得目前最低 z
     */

    const minZ =
        lowest.z;


    /*
     * 讓目前物件直接到最下面
     */

    object.z =
        minZ - 1;


    render();

const zInput =
    document.getElementById("zInput");

if (zInput) {
    zInput.value =
        object.z;
}

}

/* =========================================================
   複製目前物件
========================================================= */

function duplicateSelectedObject() {

    const object =
        getSelectedObject();

    const scene =
        getCurrentScene();

    if (!object || !scene) return;


    const copy = {

        ...object,

        id:
            createId(),

        name:
            object.name +
            " 副本",

        x:
            object.x + 20,

        y:
            object.y + 20,

        z:
    Number(object.z || 0)

    };


    /*
     * 場景標誌
     * → 只存在目前 Scene
     */

    if (
        object.type ===
        "sceneMarker"
    ) {

        scene.objects.push(copy);

    }

    /*
     * 一般場景元件
     * → 全場景共用
     */

    else {

        sharedObjects.push(copy);

    }


    /*
     * 複製後立即選取新的物件
     */

    selectedId =
        copy.id;

    render();

    selectObject(copy.id);

}


/* =========================================================
   刪除目前物件
========================================================= */

function deleteObjectsByIds(ids) {
    const uniqueIds = new Set((ids || []).filter(Boolean));
    if (!uniqueIds.size) return;
    beginHistoryAction();
    const scene = getCurrentScene();
    if (scene && Array.isArray(scene.objects)) {
        for (let i = scene.objects.length - 1; i >= 0; i--) {
            if (uniqueIds.has(scene.objects[i].id)) scene.objects.splice(i, 1);
        }
    }
    for (let i = sharedObjects.length - 1; i >= 0; i--) {
        if (uniqueIds.has(sharedObjects[i].id)) sharedObjects.splice(i, 1);
    }
    selectedIds.clear();
    selectedId = null;
    editor.style.display = "none";
    const selectedPreview = document.getElementById("selectedObjectPreview");
    if (selectedPreview) selectedPreview.removeAttribute("src");
    noSelection.style.display = "block";
    updateSelectionVisual();
    render();
    finishHistoryAction();
    saveEditorStateToStorage();
    setAutosaveStatus("已刪除選取的元件");
}

function deleteSelectedObject() {

    if (!selectedId) return;


    const scene =
        getCurrentScene();

    let objects = null;


    if (scene) {

        /*
         * 場景標誌
         */

        if (
            scene.objects.some(
                o =>
                    o.id === selectedId
            )
        ) {

            objects =
                scene.objects;

        }

        /*
         * 一般場景元件
         */

        else {

            objects =
                sharedObjects;

        }

    }


    if (objects) {

        const index =
            objects.findIndex(
                o =>
                    o.id === selectedId
            );


        if (index !== -1) {

            objects.splice(
                index,
                1
            );

        }

    }


    selectedId =
        null;


    editor.style.display =
        "none";

    noSelection.style.display =
        "block";


    render();

}

function updateList() {

    const sceneObjectList = document.getElementById("sceneObjectList");
    const markerObjectList = document.getElementById("markerObjectList");
    const sceneObjectCount = document.getElementById("sceneObjectCount");
    const markerObjectCount = document.getElementById("markerObjectCount");

    const shared = [...sharedObjects].sort((a,b) => b.z - a.z);
    const scene = getCurrentScene();
    const markers = scene
        ? [...scene.objects].filter(object => object.type === "sceneMarker").sort((a,b) => b.z - a.z)
        : [];

    if (sceneObjectCount) sceneObjectCount.textContent = shared.length;
    if (markerObjectCount) markerObjectCount.textContent = markers.length;

    function buildObjectItem(object, includeVisibility) {
        if (typeof object.locked !== "boolean") object.locked = false;
        if (includeVisibility && typeof object.visible !== "boolean") object.visible = true;

        const div = document.createElement("div");
        div.className = "object-item";
        if (object.id === selectedId) div.classList.add("selected");

        const thumb = document.createElement("img");
        thumb.className = "object-item-thumb";
        thumb.src = object.imageUrl || "";
        thumb.alt = "";

        const info = document.createElement("div");
        info.className = "object-item-info";

        const nameSpan = document.createElement("span");
        nameSpan.className = "object-item-name";
        nameSpan.textContent = object.name || "未命名元件";

        const meta = document.createElement("div");
        meta.className = "object-item-meta";
        const z = document.createElement("span");
        z.textContent = `Z ${object.z}`;
        const size = document.createElement("span");
        size.textContent = `${Math.round(object.width)} × ${Math.round(object.height)}`;
        meta.appendChild(z);
        meta.appendChild(size);

        info.appendChild(nameSpan);
        info.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "object-item-actions";

        if (includeVisibility) {
            const visibilityButton = document.createElement("button");
            visibilityButton.type = "button";
            visibilityButton.className = "object-state-button";
            visibilityButton.title = object.visible !== false ? "隱藏元件" : "顯示元件";
            visibilityButton.textContent = object.visible !== false ? "👁" : "🚫";
            visibilityButton.addEventListener("click", function(e) {
                e.stopPropagation();
                object.visible = object.visible === false;
                render();
            });
            actions.appendChild(visibilityButton);
        }

        const lockButton = document.createElement("button");
        lockButton.type = "button";
        lockButton.className = "object-state-button";
        lockButton.title = object.locked === true ? "解除鎖定" : "鎖定元件";
        lockButton.textContent = object.locked === true ? "🔒" : "🔓";
        lockButton.addEventListener("click", function(e) {
            e.stopPropagation();
            object.locked = !object.locked;
            render();
        });
        actions.appendChild(lockButton);

        /* 複製 */
        const duplicateButton = document.createElement("button");
        duplicateButton.type = "button";
        duplicateButton.className = "object-state-button";
        duplicateButton.title = "複製物件";
        duplicateButton.textContent = "⧉";
        duplicateButton.addEventListener("click", function(e) {
            e.stopPropagation();
            selectedId = object.id;
            duplicateSelectedObject();
        });
        actions.appendChild(duplicateButton);

        /* 刪除 */
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "object-state-button object-list-delete";
        deleteButton.title = "刪除物件";
        deleteButton.textContent = "×";
        deleteButton.addEventListener("click", function(e) {
            e.stopPropagation();
            selectedId = object.id;
            deleteSelectedObject();
        });
        actions.appendChild(deleteButton);

        div.appendChild(thumb);
        div.appendChild(info);
        div.appendChild(actions);
        div.addEventListener("click", function() { selectObject(object.id); });
        return div;
    }

    if (shared.length === 0) {
        sceneObjectList.innerHTML = '<div class="empty-list">尚未加入畫面元件</div>';
    } else {
        shared.forEach(object => sceneObjectList.appendChild(buildObjectItem(object, true)));
    }

    if (markers.length === 0) {
        markerObjectList.innerHTML = '<div class="empty-list">目前場景沒有標誌元件</div>';
    } else {
        markers.forEach(object => markerObjectList.appendChild(buildObjectItem(object, false)));
    }

    recordHistoryAfterRender();
}

/* ==========================================
   24 × 24 px 格線吸附
   ------------------------------------------
   重要：
   只吸附「位置」。
   
   不修改：
   - width
   - height
   
   因此：
   - 不會破壞圖片比例
   - 不會為了格線強制改圖片尺寸
   - 圖片可以保留原本的任意比例
   ========================================== */

const SCENE_GRID_SIZE = 24;
function getSceneWidth(){ return Number(getCurrentScene()?.sceneWidth) || 1920; }
function getSceneHeight(){ return Number(getCurrentScene()?.sceneHeight) || 1080; }
function getSceneOriginX(){ return getSceneWidth() / 2; }
function getSceneOriginY(){ return getSceneHeight() / 2; }


/*
 * 將座標吸附到 24px 格線。
 *
 * 這裡使用 Scene 中央作為格線原點，
 * 與目前的 Scene Grid 設定一致。
 */
function snapCoordinateToGrid(value, origin) {

    return (
        origin +
        Math.round(
            (value - origin) /
            SCENE_GRID_SIZE
        ) *
        SCENE_GRID_SIZE
    );

}


/*
 * 圖片吸附：
 *
 * ★ 只處理左上角位置
 * ★ 完全不修改 width / height
 *
 * 因此圖片會「貼著格線開始」，
 * 而不是讓圖片中心卡在格線上。
 */
function snapObjectToGrid(object) {

    if (!object) return;

    object.x =
        Math.round(object.x / SCENE_GRID_SIZE) *
        SCENE_GRID_SIZE;

    object.y =
    Math.round(
        (object.y - 12) / SCENE_GRID_SIZE
    ) *
    SCENE_GRID_SIZE +
    12;
}


/* ==========================================
   拖曳
   支援：
   - 滑鼠
   - 手指觸控
   - 手寫筆
========================================== */

let dragging = false;

let dragObject = null;

let dragStartX = 0;

let dragStartY = 0;

let objectStartX = 0;

let objectStartY = 0;
let dragAxisLock = null;


/* ==========================================
   開始拖曳
========================================== */

function startDrag(e) {

    const id = e.currentTarget.dataset.id;
    const clickedObject = getObjects().find(item => item.id === id);

    // 鎖定元件不啟動物件拖曳，也不攔截事件；讓工作區接手平移畫布。
    if (!clickedObject || clickedObject.locked === true) return;

    /*
     * 防止同時啟動 Scene 平移
     */
    e.stopPropagation();

    /*
     * 阻止手機瀏覽器把手指操作
     * 當成頁面滑動 / 縮放
     */
    e.preventDefault();

    if (multiSelectMode) {
        if (!selectedIds.has(id)) {
            selectedIds.clear();
            selectedIds.add(id);
        }
        selectedId = id;
        selectObject(id);
        updateSelectionVisual();
        dragGroup = getObjects().filter(item => selectedIds.has(item.id) && item.locked !== true);
    } else {
        selectedIds.clear();
        selectedIds.add(id);
        selectObject(id);
        dragGroup = [clickedObject];
    }
    const object = clickedObject;
    if (!object) return;

    beginHistoryAction();
    dragging = true;
    dragObject = object;
    dragGroupStarts = dragGroup.map(item => ({ id: item.id, x: item.x, y: item.y }));


    /*
     * Pointer Events 同時支援：
     *
     * 滑鼠
     * 手指
     * 手寫筆
     */
    dragStartX = e.clientX;

    dragStartY = e.clientY;
    dragAxisLock = e.shiftKey ? "pending" : null;


    objectStartX = object.x;

    objectStartY = object.y;


    /*
     * 讓瀏覽器把後續 pointermove
     * 都交給目前這張圖片
     *
     * 手指拖曳會穩定很多
     */
    if (
        e.currentTarget.setPointerCapture &&
        e.pointerId !== undefined
    ) {
        try {
            e.currentTarget.setPointerCapture(
                e.pointerId
            );
        } catch (error) {
            console.warn(
                "Pointer Capture 啟用失敗：",
                error
            );
        }
    }

}


/* ==========================================
   拖曳中
========================================== */

document.addEventListener(
    "pointermove",
    function(e) {

        if (
            !dragging ||
            !dragObject
        ) {
            return;
        }


        /*
         * 防止手機瀏覽器在拖曳時
         * 同時捲動畫面
         */
        e.preventDefault();


        /*
         * 因為 Scene 可能有縮放，
         * 所以要除以 viewScale。
         */
        let dx =
            (e.clientX - dragStartX) /
            viewScale;

        let dy =
            (e.clientY - dragStartY) /
            viewScale;

        // 拖曳時按住 Shift：依最初移動方向鎖定水平或垂直軸。
        if (e.shiftKey) {
            if (dragAxisLock === null) dragAxisLock = "pending";
            if (dragAxisLock === "pending" && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
                dragAxisLock = Math.abs(dx) >= Math.abs(dy) ? "horizontal" : "vertical";
            }
            if (dragAxisLock === "horizontal") dy = 0;
            else if (dragAxisLock === "vertical") dx = 0;
        } else {
            dragAxisLock = null;
        }

        dragGroup.forEach(item => {
            const start = dragGroupStarts.find(entry => entry.id === item.id);
            if (!start) return;
            item.x = start.x + dx;
            item.y = start.y + dy;
        });


        /*
         * 只有勾選「對齊格線」
         * 才自動吸附。
         */
        if (getCurrentScene()?.alignWithGrid === true) {
            dragGroup.forEach(item => snapObjectToGrid(item));
        }
        // 吸附格線後再次鎖定另一軸，確保 Shift 模式不會產生軸向漂移。
        if (dragAxisLock === "horizontal") {
            dragGroup.forEach(item => {
                const start = dragGroupStarts.find(entry => entry.id === item.id);
                if (start) item.y = start.y;
            });
        } else if (dragAxisLock === "vertical") {
            dragGroup.forEach(item => {
                const start = dragGroupStarts.find(entry => entry.id === item.id);
                if (start) item.x = start.x;
            });
        }
        
        /* 即時更新右側 X / Y */
        updatePositionInputs(dragObject);


        /*
         * 更新畫面
         */
        render();

    },
    {
        passive: false
    }
);


/* ==========================================
   結束拖曳
========================================== */

function stopDrag(e) {

    if (!dragging) return;

    /*
     * 拖曳結束前，再同步一次 X / Y
     */
    updatePositionInputs(dragObject);

    if (
        e &&
        e.currentTarget &&
        e.pointerId !== undefined &&
        e.currentTarget.releasePointerCapture
    ) {
        try {
            e.currentTarget.releasePointerCapture(
                e.pointerId
            );
        } catch (error) {
            /* 不需要中斷拖曳結束流程 */
        }
    }

    dragging = false;
    dragObject = null;
    dragGroup = [];
    dragGroupStarts = [];
    dragAxisLock = null;

    finishHistoryAction();
}


/*
 * 手指 / 滑鼠 / 手寫筆
 * 都會進入這裡
 */
document.addEventListener(
    "pointerup",
    stopDrag
);


/*
 * 如果手指拖出瀏覽器畫面，
 * 也要強制結束拖曳。
 */

/*
  =========================================================
  SHA-256
  =========================================================
*/

async function sha256Hex(bytes){

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            bytes
        );

    const hashBytes =
        new Uint8Array(hashBuffer);

    return Array.from(hashBytes)
        .map(
            b =>
                b.toString(16)
                 .padStart(2, "0")
        )
        .join("");
}


/*
  =========================================================
  Data URL → Uint8Array
  =========================================================
*/

function dataURLToBytes(dataURL){

    if(!dataURL){
        return null;
    }

    const parts =
        dataURL.split(",");

    if(parts.length !== 2){
        throw new Error(
            "無法解析圖片 Data URL。"
        );
    }

    const base64 =
        parts[1];

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes;
}


/*
  =========================================================
  取得 Data URL MIME
  =========================================================
*/

function getDataURLMime(dataURL){

    if(!dataURL){
        return "image/png";
    }

    const match =
        dataURL.match(
            /^data:([^;,]+)/
        );

    return match
        ? match[1]
        : "image/png";
}


/*
  =========================================================
  MIME → 副檔名
  =========================================================
*/

function getImageExtension(mime){

    switch(mime){

        case "image/jpeg":
            return ".jpg";

        case "image/webp":
            return ".webp";

        case "image/gif":
            return ".gif";

        case "image/svg+xml":
            return ".svg";

        case "image/png":
        default:
            return ".png";

    }

}


/*
  =========================================================
  Uint8Array 合併
  =========================================================
*/

function concatBytes(...arrays){

    let total = 0;

    arrays.forEach(
        array => {
            total += array.length;
        }
    );

    const result =
        new Uint8Array(total);

    let offset = 0;

    arrays.forEach(
        array => {

            result.set(
                array,
                offset
            );

            offset +=
                array.length;

        }
    );

    return result;
}


/*
  =========================================================
  CRC-32
  =========================================================
*/

function crc32(bytes){

    let crc =
        0xffffffff;

    for(
        let i = 0;
        i < bytes.length;
        i++
    ){

        crc ^= bytes[i];

        for(
            let j = 0;
            j < 8;
            j++
        ){

            crc =
                (crc >>> 1) ^
                (
                    0xedb88320 &
                    -(crc & 1)
                );

        }

    }

    return (
        crc ^ 0xffffffff
    ) >>> 0;
}


/*
  =========================================================
  Little Endian 16-bit
  =========================================================
*/

function u16(n){

    return new Uint8Array([

        n & 0xff,

        (n >>> 8) & 0xff

    ]);

}


/*
  =========================================================
  Little Endian 32-bit
  =========================================================
*/

function u32(n){

    return new Uint8Array([

        n & 0xff,

        (n >>> 8) & 0xff,

        (n >>> 16) & 0xff,

        (n >>> 24) & 0xff

    ]);

}


/*
  =========================================================
  建立 Store ZIP
  =========================================================

  ZIP 結構：

      __data.json
      .token
      <sha256>.png
      <sha256>.png
      ...

  與角色製作器使用同一種 ZIP 結構。
*/

function createStoredZip(entries){

    const encoder =
        new TextEncoder();

    const localParts = [];

    const centralParts = [];

    let offset = 0;


    for(
        const entry of entries
    ){

        const nameBytes =
            encoder.encode(
                entry.name
            );

        const data =
            entry.data instanceof Uint8Array
                ? entry.data
                : new Uint8Array(
                    entry.data
                );


        const crc =
            crc32(data);


        /*
          Local File Header
        */

        const localHeader =
            concatBytes(

                u32(0x04034b50),

                u16(20),

                u16(0x0800),

                u16(0),

                u16(0),

                u16(0),

                u32(crc),

                u32(data.length),

                u32(data.length),

                u16(nameBytes.length),

                u16(0),

                nameBytes

            );


        localParts.push(
            localHeader,
            data
        );


        /*
          Central Directory Header
        */

        const centralHeader =
            concatBytes(

                u32(0x02014b50),

                u16(20),

                u16(20),

                u16(0x0800),

                u16(0),

                u16(0),

                u16(0),

                u32(crc),

                u32(data.length),

                u32(data.length),

                u16(nameBytes.length),

                u16(0),

                u16(0),

                u16(0),

                u16(0),

                u32(0),

                u32(offset),

                nameBytes

            );


        centralParts.push(
            centralHeader
        );


        offset +=
            localHeader.length +
            data.length;

    }


    const localData =
        concatBytes(
            ...localParts
        );

    const centralData =
        concatBytes(
            ...centralParts
        );


    /*
      End Of Central Directory
    */

    const endRecord =
        concatBytes(

            u32(0x06054b50),

            u16(0),

            u16(0),

            u16(entries.length),

            u16(entries.length),

            u32(centralData.length),

            u32(localData.length),

            u16(0)

        );


    return concatBytes(

        localData,

        centralData,

        endRecord

    );

}

async function readZipEntries(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);
    const decoder = new TextDecoder();
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("檔案不是有效的 ZIP 檔案。");
    const count = view.getUint16(eocd + 10, true);
    let offset = view.getUint32(eocd + 16, true);
    const entries = new Map();
    for (let i = 0; i < count; i++) {
        if (view.getUint32(offset, true) !== 0x02014b50) throw new Error("ZIP 中央目錄格式不正確。");
        const method = view.getUint16(offset + 10, true);
        const compressedSize = view.getUint32(offset + 20, true);
        const nameLength = view.getUint16(offset + 28, true);
        const extraLength = view.getUint16(offset + 30, true);
        const commentLength = view.getUint16(offset + 32, true);
        const localOffset = view.getUint32(offset + 42, true);
        const name = decoder.decode(bytes.slice(offset + 46, offset + 46 + nameLength));
        const localNameLength = view.getUint16(localOffset + 26, true);
        const localExtraLength = view.getUint16(localOffset + 28, true);
        const dataStart = localOffset + 30 + localNameLength + localExtraLength;
        const compressed = bytes.slice(dataStart, dataStart + compressedSize);
        let content;
        if (method === 0) content = compressed;
        else if (method === 8) {
            if (typeof DecompressionStream === "undefined") throw new Error("此瀏覽器不支援 ZIP 解壓縮，請改用支援 Deflate 的新版瀏覽器。");
            let stream;
            try { stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw")); }
            catch (_) { throw new Error("無法解壓此 ZIP 檔案（Deflate 格式不受目前瀏覽器支援）。"); }
            content = new Uint8Array(await new Response(stream).arrayBuffer());
        } else {
            throw new Error("ZIP 內含不支援的壓縮方式：" + method);
        }
        entries.set(name, content);
        offset += 46 + nameLength + extraLength + commentLength;
    }
    return entries;
}

function zipImageToDataURL(bytes, filename) {
    // 以實際檔案內容判斷格式，不以副檔名猜測；避免把 ZIP 內的 XML 錯誤回應當成 PNG。
    if (!(bytes instanceof Uint8Array) || bytes.length === 0) return null;

    let mime = null;
    const startsWith = (signature) => signature.every((value, index) => bytes[index] === value);

    if (startsWith([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A])) {
        mime = "image/png";
    } else if (startsWith([0xFF, 0xD8, 0xFF])) {
        mime = "image/jpeg";
    } else if (startsWith([0x47, 0x49, 0x46, 0x38, 0x37, 0x61]) || startsWith([0x47, 0x49, 0x46, 0x38, 0x39, 0x61])) {
        mime = "image/gif";
    } else if (bytes.length >= 12 &&
        bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
        bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) {
        mime = "image/webp";
    } else {
        // SVG 是文字格式，僅接受真正含有 <svg> 根標籤的內容；拒絕 XML/HTML 錯誤頁。
        const head = new TextDecoder().decode(bytes.subarray(0, Math.min(bytes.length, 4096)))
            .replace(/^\uFEFF/, "").trimStart();
        if (/<svg(?:\s|>)/i.test(head) &&
            /^(?:<\?xml[^>]*>\s*)?(?:<!--[^]*?-->\s*)*<svg(?:\s|>)/i.test(head)) {
            mime = "image/svg+xml";
        }
    }

    // 非支援圖片（例如資源伺服器回傳的 <Error><Code>NoSuchKey</Code>）不匯入。
    if (!mime) return null;

    let binary = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(i, Math.min(i + 0x8000, bytes.length)));
    }
    return "data:" + mime + ";base64," + btoa(binary);
}

function importRoomPosition(value, dimension) {
    const n = Number(value);
    return Number.isFinite(n) ? n * 24 + dimension / 2 : dimension / 2;
}

async function importVIPRoom(file) {
    const entries = await readZipEntries(await file.arrayBuffer());
    const dataEntry = entries.get("__data.json") || entries.get("data.json");
    if (!dataEntry) throw new Error("找不到 __data.json，這可能不是 Cocofolia Room ZIP 檔案。");
    const roomData = JSON.parse(new TextDecoder().decode(dataEntry));
    const entities = roomData.entities || roomData.data?.entities;
    if (!entities || !entities.scenes || typeof entities.scenes !== "object") {
        throw new Error("ZIP 內沒有可辨識的場景資料，未更動目前編輯內容。");
    }
    const resources = roomData.resources || roomData.data?.resources || {};
    const imageCache = new Map();
    const resolveImage = async (url) => {
        if (!url) return null;
        if (typeof url === "string" && /^(data:|blob:|https?:)/i.test(url)) return url;
        const key = String(url).replace(/^\.?\//, "");
        if (imageCache.has(key)) return imageCache.get(key);
        const candidates = [key, decodeURIComponent(key), key.split("/").pop()];
        let foundName = candidates.find(n => entries.has(n));
        if (!foundName) {
            const resourceKeys = Object.keys(resources);
            const matched = resourceKeys.find(k => k === key || k.endsWith("/" + key) || k.split("/").pop() === key.split("/").pop());
            if (matched) foundName = candidates.find(n => entries.has(n)) || (entries.has(matched) ? matched : null);
        }
        if (!foundName) return null;
        const dataURL = zipImageToDataURL(entries.get(foundName), foundName);
        imageCache.set(key, dataURL);
        return dataURL;
    };
    const sourceScenes = Object.entries(entities.scenes).map(([id, scene]) => ({...scene, id}))
        .sort((a,b) => (Number(a.order) || 0) - (Number(b.order) || 0));
    if (!sourceScenes.length) throw new Error("ZIP 中沒有場景。");
    const sceneWidth = 1920, sceneHeight = 1080;
    const importedShared = [];
    const itemEntities = entities.items || {};
    for (const [id, item] of Object.entries(itemEntities)) {
        const imageUrl = await resolveImage(item.imageUrl);
        if (!imageUrl) continue;
        importedShared.push({
            id: createId(), name: item.memo || item.name || ("畫面元件 " + (importedShared.length + 1)),
            imageUrl, x: importRoomPosition(item.x, sceneWidth), y: importRoomPosition(item.y, sceneHeight),
            width: Math.max(1, Number(item.width) * 24 || 24), height: Math.max(1, Number(item.height) * 24 || 24),
            z: Number(item.z) || 0, angle: Number(item.angle) || 0, opacity: 1,
            flipX: false, flipY: false, visible: item.visible !== false && item.active !== false,
            locked: item.locked === true, type: "object"
        });
    }
    const importedScenes = [];
    for (const source of sourceScenes) {
        const backgroundData = await resolveImage(source.backgroundUrl);
        const foregroundData = await resolveImage(source.foregroundUrl);
        const markers = [];
        for (const [id, marker] of Object.entries(source.markers || {})) {
            const imageUrl = await resolveImage(marker.imageUrl);
            if (!imageUrl) continue;
            markers.push({
                id: createId(), name: marker.text || ("場景標誌 " + (markers.length + 1)),
                imageUrl, x: importRoomPosition(marker.x, sceneWidth), y: importRoomPosition(marker.y, sceneHeight),
                width: Math.max(1, Number(marker.width) * 24 || 24), height: Math.max(1, Number(marker.height) * 24 || 24),
                z: Number(marker.z) || 0, angle: Number(marker.angle) || 0, opacity: 1,
                flipX: false, flipY: false, visible: true, locked: marker.locked === true, type: "sceneMarker"
            });
        }
        // 逐場景讀取 ZIP 的前景尺寸，並兼容不同版本／巢狀格式。
        // 編輯器內部以格數儲存（每格 24px）；標明 px/pixel 的欄位才轉成格數。
        const readForegroundDimension = (axis) => {
            const isWidth = axis === "width";
            const aliases = isWidth
                ? ["fieldWidth", "foregroundWidth", "fieldObjectWidth", "fieldWidthInCells", "fieldSizeX", "foregroundWidthInCells", "fieldWidthPx", "foregroundWidthPx", "fieldPixelWidth"]
                : ["fieldHeight", "foregroundHeight", "fieldObjectHeight", "fieldHeightInCells", "fieldSizeY", "foregroundHeightInCells", "fieldHeightPx", "foregroundHeightPx", "fieldPixelHeight"];
            const pixelAliases = new Set(isWidth
                ? ["fieldWidthPx", "foregroundWidthPx", "fieldPixelWidth"]
                : ["fieldHeightPx", "foregroundHeightPx", "fieldPixelHeight"]);
            const candidates = [];
            const seen = new Set();
            const walk = (node, depth) => {
                if (!node || typeof node !== "object" || depth > 7 || seen.has(node)) return;
                seen.add(node);
                if (Array.isArray(node)) {
                    for (const child of node) walk(child, depth + 1);
                    return;
                }
                for (const [key, value] of Object.entries(node)) {
                    if (value === undefined || value === null || value === "") continue;
                    if (aliases.includes(key)) {
                        const number = Number(value);
                        if (Number.isFinite(number) && number > 0) {
                            candidates.push({ value: number, pixel: pixelAliases.has(key), priority: aliases.indexOf(key) });
                        }
                    }
                    // 支援 fieldSize / foregroundSize / fieldObject 等物件中的 width、height。
                    if (["field", "fieldSize", "foreground", "foregroundSize", "fieldObject", "fieldObjectSize", "settings", "data", "size", "dimensions"].includes(key) && value && typeof value === "object") {
                        const nested = value[axis];
                        const n = Number(nested);
                        if (nested !== undefined && nested !== null && nested !== "" && Number.isFinite(n) && n > 0) {
                            candidates.push({ value: n, pixel: /px|pixel/i.test(key), priority: 20 });
                        }
                    }
                    if (value && typeof value === "object") walk(value, depth + 1);
                }
            };
            walk(source, 0);
            if (!candidates.length) return isWidth ? 40 : 30;
            candidates.sort((a, b) => a.priority - b.priority);
            const found = candidates[0];
            return found.pixel ? found.value / 24 : found.value;
        };
        const foregroundWidth = readForegroundDimension("width");
        const foregroundHeight = readForegroundDimension("height");
        importedScenes.push({
            id: createId(), name: source.name || ("場景 " + (importedScenes.length + 1)),
            sceneWidth, sceneHeight, showGrid: source.displayGrid !== false,
            backgroundData, foregroundData,
            foregroundWidth,
            foregroundHeight,
            foregroundFit: source.fieldObjectFit !== "fill",
            alignWithGrid: source.alignWithGrid !== false,
            objects: markers
        });
    }
    // 只有完成 ZIP、JSON 與場景解析後才替換現有資料，避免失敗時破壞工作內容。
    historyActionActive = true;
    scenes.splice(0, scenes.length, ...importedScenes);
    sharedObjects.splice(0, sharedObjects.length, ...importedShared);
    currentSceneId = importedScenes[0].id;
    selectedId = null;
    selectedIds.clear();
    historyActionActive = false;
    renderSceneList();
    loadCurrentScene();
    // 匯入後明確同步目前場景的前景數值、控制項與畫面樣式，避免沿用匯入前的舊值。
    const importedCurrentScene = getCurrentScene();
    if (importedCurrentScene) {
        foregroundWidthInput.value = String(importedCurrentScene.foregroundWidth ?? 40);
        foregroundHeightInput.value = String(importedCurrentScene.foregroundHeight ?? 30);
        foregroundFitInput.checked = importedCurrentScene.foregroundFit !== false;
        alignWithGridInput.checked = importedCurrentScene.alignWithGrid !== false;
        updateForegroundStyle();
    }
    render();
    resetHistoryBaseline();
    await saveEditorStateToStorage();
    document.getElementById("zipStatus").textContent =
        "ZIP 匯入完成：" + importedScenes.length + " 個場景、" + importedShared.length + " 個畫面元件";
}

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.onload = () =>
            resolve(img);

        img.onerror = reject;

        img.src = src;

    });

}


/* ==========================================

========================================== */

async function clearPersistedEditorState() {
    try {
        const db = await openAutosaveDB();
        await new Promise((resolve, reject) => {
            const transaction = db.transaction(AUTOSAVE_STORE_NAME, "readwrite");
            transaction.objectStore(AUTOSAVE_STORE_NAME).delete(AUTOSAVE_KEY);
            transaction.oncomplete = resolve;
            transaction.onerror = () => reject(transaction.error || new Error("清除自動儲存失敗"));
            transaction.onabort = () => reject(transaction.error || new Error("清除自動儲存中止"));
        });
        db.close();
    } catch (error) {
        console.warn("IndexedDB 初始化清除失敗：", error);
    }

    try {
        localStorage.removeItem(AUTOSAVE_DB_NAME + "_" + AUTOSAVE_KEY);
    } catch (error) {
        console.warn("localStorage 初始化清除失敗：", error);
    }
}

/* 框選功能：滑鼠與手機觸控皆可在畫布空白處拖曳框選 */
const selectionMarquee = document.createElement("div");
selectionMarquee.id = "selectionMarquee";
selectionMarquee.setAttribute("aria-hidden", "true");
document.getElementById("workspace").appendChild(selectionMarquee);
let marqueeSelecting = false;
let marqueePointerId = null;
let marqueeStartX = 0;
let marqueeStartY = 0;
let marqueeMoved = false;

function isBlankCanvasTarget(target, workspace) {
    return target === workspace || target === sceneCanvas ||
        target === objectsContainer || target === background ||
        target === foreground || target === sceneGrid;
}

function updateMarquee(clientX, clientY) {
    const workspace = document.getElementById("workspace");
    const rect = workspace.getBoundingClientRect();
    const left = Math.min(marqueeStartX, clientX);
    const top = Math.min(marqueeStartY, clientY);
    const width = Math.abs(clientX - marqueeStartX);
    const height = Math.abs(clientY - marqueeStartY);
    selectionMarquee.style.left = (left - rect.left) + "px";
    selectionMarquee.style.top = (top - rect.top) + "px";
    selectionMarquee.style.width = width + "px";
    selectionMarquee.style.height = height + "px";
    selectionMarquee.style.display = "block";
}

const workspaceForMarquee = document.getElementById("workspace");
workspaceForMarquee.addEventListener("pointerdown", function(e) {
    if (!multiSelectMode || !isBlankCanvasTarget(e.target, this)) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    marqueeSelecting = true;
    marqueePointerId = e.pointerId;
    marqueeStartX = e.clientX;
    marqueeStartY = e.clientY;
    marqueeMoved = false;
    selectedId = null;
    selectedIds.clear();
    updateSelectionVisual();
    updateMarquee(e.clientX, e.clientY);
    this.classList.add("multi-select-active");
    try { this.setPointerCapture(e.pointerId); } catch (_) {}
}, true);

document.addEventListener("pointermove", function(e) {
    if (!marqueeSelecting || (marqueePointerId !== null && e.pointerId !== marqueePointerId)) return;
    e.preventDefault();
    if (Math.abs(e.clientX - marqueeStartX) + Math.abs(e.clientY - marqueeStartY) > 4) marqueeMoved = true;
    updateMarquee(e.clientX, e.clientY);
    const box = {
        left: Math.min(marqueeStartX, e.clientX),
        top: Math.min(marqueeStartY, e.clientY),
        right: Math.max(marqueeStartX, e.clientX),
        bottom: Math.max(marqueeStartY, e.clientY)
    };
    selectedIds.clear();
    document.querySelectorAll(".scene-object").forEach(el => {
        const item = getObjects().find(obj => obj.id === el.dataset.id);
        if (!item || item.locked === true || item.visible === false) return;
        const r = el.getBoundingClientRect();
        if (r.right >= box.left && r.left <= box.right && r.bottom >= box.top && r.top <= box.bottom) {
            selectedIds.add(item.id);
        }
    });
    updateSelectionVisual();
}, { passive: false });

function finishMarquee(e) {
    if (!marqueeSelecting || (e && marqueePointerId !== null && e.pointerId !== undefined && e.pointerId !== marqueePointerId)) return;
    const workspace = document.getElementById("workspace");
    marqueeSelecting = false;
    marqueePointerId = null;
    selectionMarquee.style.display = "none";
    workspace.classList.toggle("multi-select-active", multiSelectMode);
    if (e && e.pointerId !== undefined) {
        try { workspace.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    updateSelectionVisual();
}
document.addEventListener("pointerup", finishMarquee, true);
document.addEventListener("pointercancel", finishMarquee, true);

const multiSelectButton = document.getElementById("multiSelectButton");
if (multiSelectButton) {
    multiSelectButton.setAttribute("aria-pressed", "false");
    multiSelectButton.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        multiSelectMode = !multiSelectMode;
        // 明確同步按鈕狀態，點第二次立即移除藍色，不依賴畫布後續點擊。
        this.classList.toggle("active", multiSelectMode);
        this.setAttribute("aria-pressed", multiSelectMode ? "true" : "false");
        this.title = multiSelectMode ? "多選模式已開啟：在畫布空白處拖曳框選未鎖定元件，放開手指後即可一起移動" : "多選元件：可選取並一起移動未鎖定的元件";
        const workspace = document.getElementById("workspace");
        workspace.classList.toggle("multi-select-active", multiSelectMode);
        if (!multiSelectMode) {
            marqueeSelecting = false;
            marqueePointerId = null;
            selectionMarquee.style.display = "none";
            selectedIds.clear();
            if (selectedId) selectedIds.add(selectedId);
        }
        updateSelectionVisual();
    });
}

/* =========================================================
   VIEWPORT
   只控制「觀看方式」
   不會修改物件座標
========================================================= */

let viewScale = 1;
let viewX = 0;
let viewY = 0;

let viewDragging = false;

let viewDragStartX = 0;
let viewDragStartY = 0;

let viewStartX = 0;
let viewStartY = 0;

const MIN_VIEW_SCALE = 0.1;
const MAX_VIEW_SCALE = 2;


/* ---------------------------------------------------------
   更新畫布顯示
--------------------------------------------------------- */

function updateViewport(){

    const scene =
        document.getElementById("scene");

    const zoomValue =
        document.getElementById("zoomValue");

    if(!scene) return;

    scene.style.transform =
        `translate(${viewX}px, ${viewY}px) scale(${viewScale})`;

    if(zoomValue){ zoomValue.textContent = Math.round(viewScale * 100) + "%"; }
    const zoomSlider = document.getElementById("zoomSlider");
    if (zoomSlider) zoomSlider.value = String(Math.round(viewScale * 100));

}


/* ---------------------------------------------------------
   無邊界視口
   ---------------------------------------------------------
   畫布可以自由平移，不限制在工作區內。
--------------------------------------------------------- */

function clampViewport(){
    /*
     * 無邊界畫布：視口位置不再限制在固定範圍內。
     * viewX / viewY 只影響觀看位置，不會修改任何物件座標。
     */
}


/* ---------------------------------------------------------
   設定縮放
--------------------------------------------------------- */

function setViewport(scale, x = viewX, y = viewY){

    viewScale =
        Math.max(
            MIN_VIEW_SCALE,
            Math.min(MAX_VIEW_SCALE, scale)
        );

    viewX = x;
    viewY = y;

    updateViewport();

}


/* ---------------------------------------------------------
   Fit：整張 1920 × 1080 顯示在工作區
--------------------------------------------------------- */

function fitCanvas(){

    const workspace =
        document.getElementById("workspace");

    if(!workspace) return;

    const vw =
        workspace.clientWidth;

    const vh =
        workspace.clientHeight;

    const padding = 40;

    const scaleX =
        (vw - padding) / getSceneWidth();

    const scaleY =
        (vh - padding) / getSceneHeight();

    viewScale =
        Math.min(scaleX, scaleY);

    viewScale =
        Math.max(
            MIN_VIEW_SCALE,
            Math.min(MAX_VIEW_SCALE, viewScale)
        );

    viewX = 0;
    viewY = 0;

    updateViewport();

}


/* ---------------------------------------------------------
   滾輪縮放
--------------------------------------------------------- */

document
.getElementById("workspace")
.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        const rect =
            this.getBoundingClientRect();

        /*
         * 滑鼠相對於工作區中心
         */
        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;

        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;

        /*
         * 找到滑鼠目前對應到 Scene 的哪個位置
         */
        const canvasX =
            (mouseX - viewX) /
            viewScale;

        const canvasY =
            (mouseY - viewY) /
            viewScale;

        const factor =
            e.deltaY < 0
                ? 1.1
                : 0.9;

        const newScale =
            Math.max(
                MIN_VIEW_SCALE,
                Math.min(
                    MAX_VIEW_SCALE,
                    viewScale * factor
                )
            );

        /*
         * 保持滑鼠指向的位置不動
         */
        viewScale = newScale;

        viewX =
            mouseX -
            canvasX * newScale;

        viewY =
            mouseY -
            canvasY * newScale;

        updateViewport();

    },
    { passive:false }
);

/* ---------------------------------------------------------
   手機雙指縮放（Pinch Zoom）
   只改變視口，不會更動任何元件座標。
--------------------------------------------------------- */
const pinchWorkspace = document.getElementById("workspace");
const activeTouchPointers = new Map();
let pinchActive = false;
let pinchStartDistance = 0;
let pinchStartScale = 1;
let pinchAnchorSceneX = 0;
let pinchAnchorSceneY = 0;

function getPinchMetrics() {
    const points = Array.from(activeTouchPointers.values());
    if (points.length < 2) return null;
    const a = points[0], b = points[1];
    const dx = b.x - a.x, dy = b.y - a.y;
    return {
        distance: Math.max(1, Math.hypot(dx, dy)),
        midX: (a.x + b.x) / 2,
        midY: (a.y + b.y) / 2
    };
}

pinchWorkspace.addEventListener("pointerdown", function(e) {
    if (e.pointerType !== "touch") return;
    activeTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activeTouchPointers.size < 2) return;

    const metrics = getPinchMetrics();
    if (!metrics) return;
    pinchActive = true;
    pinchStartDistance = metrics.distance;
    pinchStartScale = viewScale;
    const rect = pinchWorkspace.getBoundingClientRect();
    const midX = metrics.midX - rect.left - rect.width / 2;
    const midY = metrics.midY - rect.top - rect.height / 2;
    pinchAnchorSceneX = (midX - viewX) / viewScale;
    pinchAnchorSceneY = (midY - viewY) / viewScale;

    // 若第一根手指原本正在拖曳物件或平移，雙指開始時立即切換成縮放。
    dragging = false;
    dragObject = null;
    viewDragging = false;
    pinchWorkspace.classList.remove("is-panning");
    if (typeof historyActionActive !== "undefined" && historyActionActive && typeof finishHistoryAction === "function") {
        finishHistoryAction();
    }
    e.preventDefault();
    e.stopPropagation();
}, { capture: true, passive: false });

pinchWorkspace.addEventListener("pointermove", function(e) {
    if (e.pointerType === "touch" && activeTouchPointers.has(e.pointerId)) {
        activeTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }
    if (!pinchActive || activeTouchPointers.size < 2) return;

    const metrics = getPinchMetrics();
    if (!metrics) return;
    const rect = pinchWorkspace.getBoundingClientRect();
    const midX = metrics.midX - rect.left - rect.width / 2;
    const midY = metrics.midY - rect.top - rect.height / 2;
    const newScale = Math.max(MIN_VIEW_SCALE, Math.min(MAX_VIEW_SCALE, pinchStartScale * metrics.distance / pinchStartDistance));
    viewScale = newScale;
    viewX = midX - pinchAnchorSceneX * newScale;
    viewY = midY - pinchAnchorSceneY * newScale;
    updateViewport();
    e.preventDefault();
    e.stopPropagation();
}, { capture: true, passive: false });

function finishPinchPointer(e) {
    if (e.pointerType === "touch") activeTouchPointers.delete(e.pointerId);
    if (activeTouchPointers.size < 2) pinchActive = false;
}
pinchWorkspace.addEventListener("pointerup", finishPinchPointer, true);
pinchWorkspace.addEventListener("pointercancel", finishPinchPointer, true);

/* ---------------------------------------------------------
   空白區域拖曳
--------------------------------------------------------- */

document.getElementById("workspace").addEventListener("pointerdown", function(e) {
    const isBlank = e.target === this || e.target === sceneCanvas;
    if (isBlank) beginTouchLongPress(e, "blank");
}, true);

document.getElementById("workspace").addEventListener(
    "pointerdown",
    function(e){

        /*
         * 空白工作區／Scene 空白處都可以平移。
         * 滑鼠與手指都使用 Pointer Events，因此觸控裝置
         * 可以直接用手指拖動畫布。
         * 點到圖片、控制工具列或其他操作元件時，不攔截原本功能。
         */
        const isWorkspaceBlank = e.target === this;
        const isSceneBlank = e.target === sceneCanvas;
        const hitObjectElement = e.target && e.target.closest ? e.target.closest(".scene-object") : null;
        const hitObject = hitObjectElement ? getObjects().find(item => item.id === hitObjectElement.dataset.id) : null;
        const isLockedObject = !!hitObject && hitObject.locked === true;
        if(!isWorkspaceBlank && !isSceneBlank && !isLockedObject) return;

        if(e.pointerType === "mouse" && e.button !== 0) return;

        // 一般模式下，點擊／開始拖動畫布的空白處就立即取消圖片選取。
        // 在 pointerdown 處理，避免工作區的 pointer capture 令後續 click
        // 無法觸發 scene 上原有的空白處取消選取事件。
        if (!multiSelectMode && !isLockedObject) {
            selectedId = null;
            selectedIds.clear();
            editor.style.display = "none";
            const selectedPreview = document.getElementById("selectedObjectPreview");
            if (selectedPreview) selectedPreview.removeAttribute("src");
            noSelection.style.display = "block";
            updateSelectionVisual();
            updateList();
        }

        viewDragging = true;

        viewDragStartX = e.clientX;
        viewDragStartY = e.clientY;

        viewStartX = viewX;
        viewStartY = viewY;

        this.classList.add("is-panning");

        try {
            this.setPointerCapture(e.pointerId);
        } catch (_) {}

        e.preventDefault();

    }
);


/* ---------------------------------------------------------
   平移
--------------------------------------------------------- */

document.getElementById("workspace").addEventListener(
    "pointermove",
    function(e){

        if(!viewDragging) return;

        viewX =
            viewStartX +
            (e.clientX - viewDragStartX);

        viewY =
            viewStartY +
            (e.clientY - viewDragStartY);

        updateViewport();

        e.preventDefault();

    }
);


/* ---------------------------------------------------------
   結束平移
--------------------------------------------------------- */

function finishViewportDrag(e){

    if(!viewDragging) return;

    /*
     * 只在目前的畫布平移手勢結束時清除狀態。
     */
    viewDragging = false;

    const workspace =
        document.getElementById("workspace");

    workspace.classList.remove("is-panning");

    if(e && e.pointerId !== undefined){
        try {
            workspace.releasePointerCapture(e.pointerId);
        } catch (_) {}
    }

}


document.getElementById("workspace").addEventListener(
    "pointerup",
    finishViewportDrag
);

document.getElementById("workspace").addEventListener(
    "pointercancel",
    finishViewportDrag
);


/* ---------------------------------------------------------
   視窗大小改變
--------------------------------------------------------- */


window.addEventListener(
    "resize",
    function(){

        updateViewport();

    }
);


/* ---------------------------------------------------------
   初始 Fit
--------------------------------------------------------- */

requestAnimationFrame(
    function(){

        fitCanvas();

    }
);

</script>
