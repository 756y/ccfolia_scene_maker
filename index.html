<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocofolia 場景建置器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #222;
    color: #eee;
    overflow: hidden;
}

/* 左側工具欄 */
#sidebar {
    width: 300px;
    background: #2d2d2d;
    border-right: 1px solid #444;
    padding: 15px;
    overflow-y: auto;
}

h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

h3 {
    margin: 18px 0 8px;
    font-size: 14px;
    color: #aaa;
}

button,
input {
    font-family: inherit;
}

button {
    background: #444;
    color: white;
    border: 1px solid #666;
    border-radius: 5px;
    padding: 7px 10px;
    cursor: pointer;
}

button:hover {
    background: #555;
}

button:active {
    background: #666;
}

.full {
    width: 100%;
}

.row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
}

.row button {
    flex: 1;
}

.control {
    margin-bottom: 8px;
}

.control label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 3px;
}

.control input {
    width: 100%;
    background: #1f1f1f;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px;
}

.control input[type="range"] {
    padding: 0;
}

#objectList {
    border: 1px solid #444;
    background: #222;
    max-height: 180px;
    overflow-y: auto;
}

.object-item {
    padding: 8px;
    border-bottom: 1px solid #444;
    cursor: pointer;
    font-size: 13px;
}

.object-item:hover {
    background: #333;
}

.object-item.selected {
    background: #555;
}

.object-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
}

.object-item-name {
    flex: 1;
    min-width: 0;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.object-item-actions {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
}

.object-state-button {
    width: 26px;
    height: 26px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;

    border: 1px solid transparent;
    border-radius: 4px;

    cursor: pointer;

    font-size: 14px;
    line-height: 1;
}

.object-state-button:hover {
    background: #444;
    border-color: #666;
}

#sceneList {
    border: 1px solid #444;
    background: #222;
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 8px;
}

.scene-list-item {
    padding: 8px;
    border-bottom: 1px solid #444;
    cursor: pointer;
    font-size: 13px;
}

.scene-list-item:hover {
    background: #333;
}

.scene-list-item.selected {
    background: #555;
}

#sceneEditor {
    margin-top: 8px;
}

#opacityValue {
    font-size: 12px;
    color: #aaa;
}

.control select {
    width: 100%;
    background: #1f1f1f;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px;
}

/* =========================================================
   工作區
========================================================= */

#workspace {
    flex: 1;
    position: relative;

    /* 工作區本身不能被 1920×1080 畫布撐開 */
    overflow: hidden;

    background:
        linear-gradient(45deg, #292929 25%, transparent 25%),
        linear-gradient(-45deg, #292929 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #292929 75%),
        linear-gradient(-45deg, transparent 75%, #292929 75%);

    background-size: 30px 30px;
    background-position:
        0 0,
        0 15px,
        15px -15px,
        -15px 0;
}

#viewportControls {
    position: absolute;

    right: 16px;
    bottom: 16px;

    z-index: 1000;

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 7px;

    background: rgba(30, 30, 30, 0.92);

    border: 1px solid #555;
    border-radius: 8px;

    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
}

#viewportControls button {
    height: 30px;
    min-width: 30px;

    padding: 0 8px;

    background: #3a3a3a;
    color: #eee;

    border: 1px solid #666;
    border-radius: 5px;

    cursor: pointer;
}

#viewportControls button:hover {
    background: #4a4a4a;
}

#zoomValue {
    min-width: 50px;

    text-align: center;

    font-size: 12px;
    color: #ddd;
}

/* =========================================================
   固定 1920 × 1080 場景畫布
========================================================= */

#scene {
    position: absolute;

    width: 1920px;
    height: 1080px;

    left: 50%;
    top: 50%;

    margin-left: -960px;
    margin-top: -540px;

    background: #111;
    overflow: hidden;

    transform-origin: center center;

    box-shadow: 0 0 20px #000;
}

/* =========================================================
   背景
========================================================= */

#background {
    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    object-fit: fill;

    pointer-events: none;

    /* 背景永遠在最下面 */
    z-index: -100;
}


/* =========================================================
   一般圖片物件
========================================================= */

#objects {
    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    /* 一般物件 / 場景標誌從 Layer 1 開始 */
    z-index: 1;

    pointer-events: none;
}

.scene-object {
    pointer-events: auto;
}


/* =========================================================
   前景
========================================================= */

#foreground {
    position: absolute;

    left: 480px;
    top: 180px;

    width: 960px;
    height: 720px;

    object-fit: fill;

    object-position: center center;

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   24 × 24 px 格線
========================================================= */

#sceneGrid {
    position: absolute;

    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    pointer-events: none;

    z-index: 100;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        );

    background-size: 24px 24px;

    /*
     * 格線以 Scene 正中央 (960, 540)
     * 作為真正的座標原點。
     *
     * X：
     * 960 ÷ 24 = 40
     * 所以 X 不需要偏移。
     *
     * Y：
     * 540 ÷ 24 = 22.5
     * 所以向下偏移 12px，
     * 讓中央 540px 正好落在格線上。
     */
    background-position: 0 12px;
}

/* 圖片物件 */
.scene-object {
    position: absolute;
    transform-origin: center center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    cursor: move;
}

.scene-object.selected {
    outline: 2px solid #4da6ff;
}

/* =========================================================
   選取物件浮動快捷工具列
========================================================= */

#objectQuickToolbar {
    position: absolute;

    display: flex;
    align-items: center;
    gap: 4px;

    padding: 5px;

    background: rgba(30, 30, 30, 0.96);

    border: 1px solid #666;
    border-radius: 7px;

    box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.45);

    z-index: 1000;

    pointer-events: auto;

    white-space: nowrap;
}

/* 工具列小按鈕 */

#objectQuickToolbar button {
    width: 30px;
    height: 30px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #3a3a3a;
    color: #eee;

    border: 1px solid #666;
    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;
    line-height: 1;
}

#objectQuickToolbar button:hover {
    background: #555;
}

#objectQuickToolbar button:active {
    background: #666;
}

/* 危險操作：刪除 */

#objectQuickToolbar button.quick-delete {
    color: #ff7777;
}

#objectQuickToolbar button.quick-delete:hover {
    background: #6b3030;
    color: white;
}

/* 分隔線 */

.quick-divider {
    width: 1px;
    height: 22px;

    background: #666;

    margin: 0 2px;
}

/* 工具提示 */

#objectQuickToolbar button {
    position: relative;
}

#objectQuickToolbar button:hover::after {
    content: attr(title);

    position: absolute;

    left: 50%;
    bottom: calc(100% + 7px);

    transform: translateX(-50%);

    padding: 4px 7px;

    background: #111;
    color: #fff;

    border: 1px solid #555;
    border-radius: 4px;

    font-size: 11px;
    white-space: nowrap;

    pointer-events: none;

    z-index: 2000;
}

#dropHint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #777;
    pointer-events: none;
    text-align: center;
}
</style>
</head>

<body>

<!-- =========================
     左側控制面板
========================= -->
<div id="sidebar">

    <h2>Cocofolia 場景建置器</h2>

    <h3>圖片</h3>

<h3>新增元件</h3>

<div class="row">

<script>

/* ==========================================
   資料
========================================== */

/* ==========================================
   場景資料
========================================== */

const scenes = [];

/*
 * =========================================================
 * 全場景共用的「畫面元件」
 *
 * 切換 Scene 時不會消失
 * =========================================================
 */
const sharedObjects = [];

let sharedZCounter = 1;

let currentSceneId = null;

let selectedId = null;


/* ==========================================
   目前場景
========================================== */

function getCurrentScene() {

    return scenes.find(
        scene => scene.id === currentSceneId
    ) || null;

}


/*
 * =========================================================
 * 取得目前畫面上應該顯示的所有元件
 *
 * ① sharedObjects
 *    → 所有場景共用的畫面元件
 *
 * ② scene.objects
 *    → 目前 Scene 專屬的場景標誌元件
 * =========================================================
 */
function getObjects() {

    const scene =
        getCurrentScene();

    if (!scene) {
        return [];
    }

    return [
        ...sharedObjects,
        ...scene.objects
    ];

}


function getBackgroundData() {

    const scene = getCurrentScene();

    return scene ? scene.backgroundData : null;

}


function getForegroundData() {

    const scene = getCurrentScene();

    return scene ? scene.foregroundData : null;

}

/* ==========================================
   場景管理
========================================== */

function createScene(name = "新場景") {

    return {

        id: createId(),

        name: name,

        backgroundData: null,

        foregroundData: null,

        /* 前景設定 */
        foregroundWidth: 40,

        foregroundHeight: 30,

        /* true = 等比例裁切符合尺寸
           false = 直接拉伸符合尺寸 */
        foregroundFit: false,

/*
 * 格線吸附
 *
 * false = 自由移動
 * true  = 拖曳時自動吸附到格線
 */
alignWithGrid: true,

objects: [],

        zCounter: 1

    };

}


function addScene() {

    const scene = createScene(
        "場景 " + (scenes.length + 1)
    );

    scenes.push(scene);

    currentSceneId = scene.id;

    selectedId = null;

    renderSceneList();
    loadCurrentScene();

}

document.getElementById("sceneNameInput")
.addEventListener("input", function() {

    const scene = getCurrentScene();

    if (!scene) return;

    scene.name = this.value;

    renderSceneList();

});



function deleteCurrentScene() {

    if (!currentSceneId) return;

    if (scenes.length <= 1) {

        alert("至少要保留一個場景。");

        return;

    }

    const index =
        scenes.findIndex(
            scene => scene.id === currentSceneId
        );

    if (index === -1) return;

    scenes.splice(index, 1);

    currentSceneId =
        scenes[Math.max(0, index - 1)].id;

    selectedId = null;

    renderSceneList();
    loadCurrentScene();

}


function switchScene(id) {

    if (id === currentSceneId) return;

    currentSceneId = id;

    selectedId = null;

    loadCurrentScene();

    renderSceneList();

}


function loadCurrentScene() {

    const scene = getCurrentScene();

    if (!scene) return;

    selectedId = null;

    /* 場景名稱 */
    document.getElementById("sceneNameInput").value =
        scene.name;
        
    /* 前景設定 */
foregroundWidthInput.value =
    scene.foregroundWidth ?? 40;

foregroundHeightInput.value =
    scene.foregroundHeight ?? 30;

foregroundFitInput.checked =
    scene.foregroundFit ?? false;

alignWithGridInput.checked =
    scene.alignWithGrid ?? false;

updateForegroundStyle();

    /* 背景 */
    if (scene.backgroundData) {

        background.src =
            scene.backgroundData;

    } else {

        background.removeAttribute("src");

    }

    /* 前景 */
    if (scene.foregroundData) {

        foreground.src =
            scene.foregroundData;

    } else {

        foreground.removeAttribute("src");

    }

    editor.style.display = "none";

    noSelection.style.display = "block";

    render();

    renderSceneList();

}

/* ==========================================
   前景顯示設定
========================================== */

function updateForegroundStyle() {

    const scene =
        getCurrentScene();

    if (!scene) return;

    /*
     * 前景尺寸是「格數」
     * 每格 = 24 × 24 px
     */
    const gridSize = 24;

    const width =
        (Number(scene.foregroundWidth) || 40)
        * gridSize;

    const height =
        (Number(scene.foregroundHeight) || 30)
        * gridSize;

    const fit =
        scene.foregroundFit === true;

    /*
     * 1920 × 1080 畫布中央
     */
    const left =
        (1920 - width) / 2;

    const top =
        (1080 - height) / 2;

    foreground.style.width =
        width + "px";

    foreground.style.height =
        height + "px";

    foreground.style.left =
        left + "px";

    foreground.style.top =
        top + "px";

    /*
     * true：
     * 等比例縮放 + 裁切
     *
     * false：
     * 直接拉伸
     */
    foreground.style.objectFit =
        fit
            ? "cover"
            : "fill";

}


function renderSceneList() {

    const list =
        document.getElementById("sceneList");

    list.innerHTML = "";

    scenes.forEach((scene, index) => {

        const div =
            document.createElement("div");

        div.className =
            "scene-list-item";

        if (scene.id === currentSceneId) {

            div.classList.add("selected");

        }

        div.textContent =
            (index + 1) + ". " + scene.name;

        div.onclick = function() {

            switchScene(scene.id);

        };

        list.appendChild(div);

    });

}


/* ==========================================
   DOM
========================================== */

const objectImageInput =
    document.getElementById("objectImageInput");

const markerImageInput =
    document.getElementById("markerImageInput");

/* =========================================================
   圖片標準化
   ---------------------------------------------------------
   所有輸入圖片最後一律重新編碼成 PNG。

   不論原本是：
   PNG / JPG / JPEG / WEBP / GIF ...

   匯出時都會統一成：
   PNG

   這樣可以避免：
   1. 副檔名是 PNG，但實際仍保留不同來源編碼
   2. 後續鏡像 / 透明度處理時格式不一致
   ========================================================= */

const MAX_IMAGE_BYTES = 4.8 * 1024 * 1024;


/*
 * 圖片匯入時的最大額外尺寸。
 *
 * 例如前景是：
 * 960 × 720
 *
 * EXTRA_IMAGE_MARGIN = 48
 *
 * 那一般圖片最多會允許：
 * 1008 × 768
 *
 * 但實際圖片仍然會保持原始比例。
 */
const INITIAL_MAX_DIMENSION = 960;


/* File → Data URL */
function fileToDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () =>
            resolve(reader.result);

        reader.onerror = () =>
            reject(
                new Error("圖片讀取失敗。")
            );

        reader.readAsDataURL(file);

    });

}


/* Data URL → Image */
function dataURLToImage(dataURL) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () =>
            resolve(img);

        img.onerror = () =>
            reject(
                new Error("圖片解析失敗。")
            );

        img.src = dataURL;

    });

}


/* Canvas → PNG Data URL */
function canvasToPNG(canvas) {

    return new Promise((resolve, reject) => {

        canvas.toBlob(
            blob => {

                if (!blob) {

                    reject(
                        new Error(
                            "PNG 圖片產生失敗。"
                        )
                    );

                    return;

                }

                const reader =
                    new FileReader();

                reader.onload =
                    () => resolve(
                        reader.result
                    );

                reader.onerror =
                    () => reject(
                        new Error(
                            "PNG 讀取失敗。"
                        )
                    );

                reader.readAsDataURL(blob);

            },
            "image/png"
        );

    });

}

/* Data URL → Uint8Array */
function dataURLToBytes(dataURL) {

    if (!dataURL) {
        return null;
    }

    const base64 = dataURL.split(",")[1];

    if (!base64) {
        return null;
    }

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}

/* 按比例限制最大尺寸 */
function getScaledSize(
    width,
    height,
    maxDimension
) {

    const largest =
        Math.max(width, height);

    if (largest <= maxDimension) {

        return {
            width,
            height
        };

    }

    const scale =
        maxDimension / largest;

    return {

        width:
            Math.max(
                1,
                Math.round(width * scale)
            ),

        height:
            Math.max(
                1,
                Math.round(height * scale)
            )

    };

}


/* =========================================================
   原始圖片 → 統一 PNG

   注意：
   這裡「一定」重新 Canvas → PNG。

   所以即使原圖本來就是 PNG，
   也不再直接保留原始 PNG bytes。
   ========================================================= */

async function prepareImage(file) {

    const originalDataURL =
        await fileToDataURL(file);

    const img =
        await dataURLToImage(
            originalDataURL
        );


    let size =
        getScaledSize(
            img.naturalWidth,
            img.naturalHeight,
            INITIAL_MAX_DIMENSION
        );


    async function createPNG(
        width,
        height
    ) {

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            width;

        canvas.height =
            height;

        const ctx =
            canvas.getContext("2d");

        if (!ctx) {

            throw new Error(
                "瀏覽器無法建立 Canvas。"
            );

        }


        /*
         * 保留透明背景
         */
        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /*
         * 所有圖片統一重新繪製
         */
        ctx.drawImage(
            img,
            0,
            0,
            width,
            height
        );


        const dataURL =
            await canvasToPNG(canvas);


        return {

            dataURL,

            width,

            height,

            bytes:
                dataURLToBytes(
                    dataURL
                )

        };

    }


    let result =
        await createPNG(
            size.width,
            size.height
        );


    /*
     * PNG 超過 4.8 MB
     * 只縮小尺寸，不改成 JPEG
     */
    while (
        result.bytes.length >
        MAX_IMAGE_BYTES
    ) {

        size = {

            width:
                Math.max(
                    1,
                    Math.floor(
                        size.width * 0.9
                    )
                ),

            height:
                Math.max(
                    1,
                    Math.floor(
                        size.height * 0.9
                    )
                )

        };


        result =
            await createPNG(
                size.width,
                size.height
            );


        if (
            size.width <= 1 &&
            size.height <= 1
        ) {

            break;

        }

    }


    return {

        dataURL:
            result.dataURL,

        width:
            result.width,

        height:
            result.height

    };

}

/* =========================================================
   物件圖片處理
   ---------------------------------------------------------
   將：

   flipX
   flipY
   opacity

   直接烘進 PNG 圖片。

   注意：
   rotation 不在這裡處理。

   因為 Cocofolia 的 object 本身有 angle 欄位，
   所以旋轉仍然由 Room JSON 的 angle 控制。
   ========================================================= */

async function prepareObjectImage(object) {

    if (!object || !object.imageUrl) {
        return null;
    }


    const img =
        await dataURLToImage(
            object.imageUrl
        );


    let size =
        getScaledSize(
            img.naturalWidth,
            img.naturalHeight,
            INITIAL_MAX_DIMENSION
        );


    async function createPNG(
        width,
        height
    ) {

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext("2d");

        if (!ctx) {

            throw new Error(
                "瀏覽器無法建立 Canvas。"
            );

        }


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /*
         * 透明度直接寫進 PNG Alpha
         */
        ctx.globalAlpha =
            Math.max(
                0,
                Math.min(
                    1,
                    Number(object.opacity ?? 1)
                )
            );


        /*
         * 以圖片中心為基準鏡像
         */
        ctx.translate(
            width / 2,
            height / 2
        );


        ctx.scale(
            object.flipX ? -1 : 1,
            object.flipY ? -1 : 1
        );


        ctx.drawImage(
            img,
            -width / 2,
            -height / 2,
            width,
            height
        );


        ctx.globalAlpha = 1;


        const dataURL =
            await canvasToPNG(
                canvas
            );


        return {

            dataURL,

            bytes:
                dataURLToBytes(
                    dataURL
                )

        };

    }


    let result =
        await createPNG(
            size.width,
            size.height
        );


    /*
     * 超過大小就縮小圖片
     */
    while (
        result.bytes.length >
        MAX_IMAGE_BYTES
    ) {

        size = {

            width:
                Math.max(
                    1,
                    Math.floor(
                        size.width * 0.9
                    )
                ),

            height:
                Math.max(
                    1,
                    Math.floor(
                        size.height * 0.9
                    )
                )

        };


        result =
            await createPNG(
                size.width,
                size.height
            );


        if (
            size.width <= 1 &&
            size.height <= 1
        ) {

            break;

        }

    }


    return {

        dataURL:
            result.dataURL,

        width:
            size.width,

        height:
            size.height

    };

}

/* ==========================================
   更換目前選取物件的圖片
========================================== */

replaceImageInput.addEventListener(
    "change",
    async function(e) {

        const file = e.target.files[0];

        if (!file) return;

        const object = getSelectedObject();

        if (!object) {
            this.value = "";
            return;
        }

        try {

            /*
             * 使用和新增圖片相同的圖片處理流程
             */
            const prepared =
                await prepareImage(file);

            /*
             * 更換圖片本身
             */
            object.imageUrl =
                prepared.dataURL;

            /*
             * 名稱也同步改成新圖片檔名
             */
            object.name =
                file.name;

            /*
             * 注意：
             * X / Y / 寬 / 高 / 旋轉 / 透明度 /
             * 鏡像 / 圖層 Z 都不修改。
             *
             * 所以換圖後會保留原本物件的位置和設定。
             */

            render();

            selectObject(object.id);

        } catch (error) {

            console.error(
                "更換圖片失敗：",
                error
            );

            alert(
                "更換圖片失敗：\n" +
                error.message
            );

        }

        /*
         * 讓下一次選同一張圖片時
         * change 事件仍然會觸發
         */
        this.value = "";

    }
);

/* ==========================================
   Render
========================================== */

function render() {

    objectsContainer.innerHTML = "";
    
    /* ==========================================
   舊版畫面元件補上預設狀態
========================================== */

sharedObjects.forEach(object => {

    if (object.type === "sceneMarker") {
        return;
    }

    if (typeof object.visible !== "boolean") {
        object.visible = true;
    }

    if (typeof object.locked !== "boolean") {
        object.locked = true;
    }

});

    getObjects().forEach(object => {

        const img = document.createElement("img");

        img.className = "scene-object";

        img.src = object.imageUrl;

        img.dataset.id = object.id;

        img.style.left =
            object.x + "px";

        img.style.top =
            object.y + "px";

        img.style.width =
            object.width + "px";

        img.style.height =
            object.height + "px";

        img.style.zIndex =
            object.z;

        img.style.opacity =
            object.opacity;
            
        img.style.visibility =
    object.type === "sceneMarker"
        ? "visible"
        : (
            object.visible !== false
                ? "visible"
                : "hidden"
        );

        img.style.transform =
            "rotate(" +
            object.angle +
            "deg) " +
            "scale(" +
            (object.flipX ? -1 : 1) +
            "," +
            (object.flipY ? -1 : 1) +
            ")";

        img.addEventListener(
            "pointerdown",
            startDrag
        );

        img.addEventListener(
            "click",
            function(e) {

                e.stopPropagation();

                selectObject(object.id);

            }
        );

        objectsContainer.appendChild(img);

    });

    updateList();

    updateSelectionVisual();

    updateDropHint();

    /* 更新圖片上方的快捷工具列 */
    updateObjectQuickToolbar();

}

/* =========================================================
   選取物件浮動快捷工具列
========================================================= */

const objectQuickToolbar =
    document.getElementById(
        "objectQuickToolbar"
    );


/*
 * 更新快捷工具列位置
 *
 * 工具列會出現在：
 *
 *        [快捷工具列]
 *              ↓
 *        ┌──────────┐
 *        │   圖片   │
 *        │          │
 *        └──────────┘
 *
 */

function updateObjectQuickToolbar() {

    if (!objectQuickToolbar) return;


    const object =
        getSelectedObject();


    /* ==========================================
       沒有選取物件
       → 直接隱藏工具列
    ========================================== */

    if (!object) {

        objectQuickToolbar.style.display =
            "none";

        return;

    }


    /* ==========================================
       找到眼睛 / 鎖頭按鈕
    ========================================== */

    const visibilityButton =
        objectQuickToolbar.querySelector(
            '[data-quick-action="toggleVisible"]'
        );

    const lockButton =
        objectQuickToolbar.querySelector(
            '[data-quick-action="toggleLocked"]'
        );


    /* ==========================================
       地形標誌
       → 不顯示眼睛 / 鎖頭
    ========================================== */

    const isSceneObject =
        object.type !== "sceneMarker";


    if (visibilityButton) {

        visibilityButton.style.display =
            isSceneObject
                ? "flex"
                : "none";

    }


    if (lockButton) {

        lockButton.style.display =
            isSceneObject
                ? "flex"
                : "none";

    }


    /* ==========================================
       畫面元件
       → 更新按鈕狀態
    ========================================== */

    if (isSceneObject) {

        if (visibilityButton) {

            visibilityButton.textContent =
                object.visible !== false
                    ? "👁"
                    : "🚫";

            visibilityButton.title =
                object.visible !== false
                    ? "隱藏元件"
                    : "顯示元件";

        }


        if (lockButton) {

            lockButton.textContent =
                object.locked === true
                    ? "🔒"
                    : "🔓";

            lockButton.title =
                object.locked === true
                    ? "解除鎖定"
                    : "鎖定元件";

        }

    }


    /* ==========================================
       顯示工具列
    ========================================== */

    objectQuickToolbar.style.display =
        "flex";


    /* ==========================================
       工具列位置
    ========================================== */

    let left =
        object.x +
        object.width / 2;

    let top =
        object.y - 8;


    if (top < 50) {

        top =
            object.y +
            object.height +
            8;

        objectQuickToolbar.style.transform =
            "translateX(-50%)";

    } else {

        objectQuickToolbar.style.transform =
            "translate(-50%, -100%)";

    }


    /* ==========================================
       防止工具列超出 Scene 左右
    ========================================== */

    const toolbarWidth =
        objectQuickToolbar.offsetWidth || 220;

    const halfWidth =
        toolbarWidth / 2;

    left =
        Math.max(
            halfWidth + 6,
            Math.min(
                1920 - halfWidth - 6,
                left
            )
        );


    objectQuickToolbar.style.left =
        left + "px";

    objectQuickToolbar.style.top =
        top + "px";

}


/* =========================================================
   快捷工具列按鈕
========================================================= */

objectQuickToolbar
    .querySelectorAll(
        "[data-quick-action]"
    )
    .forEach(button => {

        button.addEventListener(
            "mousedown",
            function(e) {

                /*
                 * 非常重要：
                 * 點快捷按鈕時不要開始拖曳圖片。
                 */

                e.preventDefault();

                e.stopPropagation();

            }
        );


        button.addEventListener(
            "click",
            function(e) {

                e.preventDefault();

                e.stopPropagation();

                const action =
                    this.dataset.quickAction;

                executeQuickAction(action);

            }
        );

    });


/* =========================================================
   執行快捷操作
========================================================= */

function executeQuickAction(action) {

    const object =
        getSelectedObject();

    if (!object) return;
    
    /* ==========================================
   可視 / 隱藏
========================================== */

if (action === "toggleVisible") {

    /* 地形標記不提供此功能 */
    if (object.type === "sceneMarker") {
        return;
    }

    object.visible =
        object.visible === false;

    render();

    return;
}


/* ==========================================
   鎖定 / 解鎖
========================================== */

if (action === "toggleLocked") {

    /* 地形標記不提供此功能 */
    if (object.type === "sceneMarker") {
        return;
    }

    object.locked =
        !object.locked;

    render();

    return;
}
    
    if (action === "replaceImage") {

    replaceImageInput.click();

    return;

}


    /*
     * 水平鏡像
     */

    if (action === "flipX") {

        object.flipX =
            !object.flipX;

        render();

        return;

    }


    /*
     * 垂直鏡像
     */

    if (action === "flipY") {

        object.flipY =
            !object.flipY;

        render();

        return;

    }


/*
 * 圖層上移一層
 */

if (action === "moveUp") {

    moveSelectedObjectLayer(1);

    return;

}


/*
 * 圖層下移一層
 */

if (action === "moveDown") {

    moveSelectedObjectLayer(-1);

    return;

}


/*
 * 圖層置頂
 */

if (action === "moveTop") {

    moveSelectedObjectToTop();

    return;

}


/*
 * 圖層置底
 */

if (action === "moveBottom") {

    moveSelectedObjectToBottom();

    return;

}
    
    


    /*
     * 複製
     */

    if (action === "duplicate") {

        duplicateSelectedObject();

        return;

    }


    /*
     * 刪除
     */

    if (action === "delete") {

        deleteSelectedObject();

        return;

    }

}


/* =========================================================
   圖層移動
========================================================= */

function moveSelectedObjectLayer(direction) {

    const objects =
        getObjects();

    const object =
        getSelectedObject();

    if (!object) return;


    const sorted =
        [...objects]
            .sort(
                (a, b) =>
                    a.z - b.z
            );


    const index =
        sorted.findIndex(
            o =>
                o.id === object.id
        );


    if (index === -1) return;


    const targetIndex =
        index + direction;


    if (
        targetIndex < 0 ||
        targetIndex >= sorted.length
    ) {

        return;

    }


    const other =
        sorted[targetIndex];


    const temp =
        object.z;

    object.z =
        other.z;

    other.z =
        temp;


    render();

}

/* =========================================================
   圖層置頂
========================================================= */

function moveSelectedObjectToTop() {

    const objects =
        getObjects();

    const object =
        getSelectedObject();

    if (!object) return;


    const sorted =
        [...objects]
            .sort(
                (a, b) =>
                    a.z - b.z
            );


    const highest =
        sorted[sorted.length - 1];

    if (!highest) return;


    /*
     * 已經是最上層
     */

    if (object.id === highest.id) {
        return;
    }


    /*
     * 取得目前最高 z
     */

    const maxZ =
        highest.z;


    /*
     * 讓目前物件直接到最上面
     */

    object.z =
        maxZ + 1;


    render();

}


/* =========================================================
   圖層置底
========================================================= */

function moveSelectedObjectToBottom() {

    const objects =
        getObjects();

    const object =
        getSelectedObject();

    if (!object) return;


    const sorted =
        [...objects]
            .sort(
                (a, b) =>
                    a.z - b.z
            );


    const lowest =
        sorted[0];

    if (!lowest) return;


    /*
     * 已經是最下層
     */

    if (object.id === lowest.id) {
        return;
    }


    /*
     * 取得目前最低 z
     */

    const minZ =
        lowest.z;


    /*
     * 讓目前物件直接到最下面
     */

    object.z =
        minZ - 1;


    render();

}

/* =========================================================
   複製目前物件
========================================================= */

function duplicateSelectedObject() {

    const object =
        getSelectedObject();

    const scene =
        getCurrentScene();

    if (!object || !scene) return;


    const copy = {

        ...object,

        id:
            createId(),

        name:
            object.name +
            " 副本",

        x:
            object.x + 20,

        y:
            object.y + 20,

        z:
            object.type === "sceneMarker"
                ? ++scene.zCounter
                : ++sharedZCounter

    };


    /*
     * 場景標誌
     * → 只存在目前 Scene
     */

    if (
        object.type ===
        "sceneMarker"
    ) {

        scene.objects.push(copy);

    }

    /*
     * 一般場景元件
     * → 全場景共用
     */

    else {

        sharedObjects.push(copy);

    }


    /*
     * 複製後立即選取新的物件
     */

    selectedId =
        copy.id;

    render();

    selectObject(copy.id);

}


/* =========================================================
   刪除目前物件
========================================================= */

function deleteSelectedObject() {

    if (!selectedId) return;


    const scene =
        getCurrentScene();

    let objects = null;


    if (scene) {

        /*
         * 場景標誌
         */

        if (
            scene.objects.some(
                o =>
                    o.id === selectedId
            )
        ) {

            objects =
                scene.objects;

        }

        /*
         * 一般場景元件
         */

        else {

            objects =
                sharedObjects;

        }

    }


    if (objects) {

        const index =
            objects.findIndex(
                o =>
                    o.id === selectedId
            );


        if (index !== -1) {

            objects.splice(
                index,
                1
            );

        }

    }


    selectedId =
        null;


    editor.style.display =
        "none";

    noSelection.style.display =
        "block";


    render();

}

/* ==========================================
   24 × 24 px 格線吸附
   ------------------------------------------
   重要：
   只吸附「位置」。
   
   不修改：
   - width
   - height
   
   因此：
   - 不會破壞圖片比例
   - 不會為了格線強制改圖片尺寸
   - 圖片可以保留原本的任意比例
   ========================================== */

const SCENE_WIDTH = 1920;
const SCENE_HEIGHT = 1080;
const SCENE_GRID_SIZE = 24;

const SCENE_ORIGIN_X =
    SCENE_WIDTH / 2;

const SCENE_ORIGIN_Y =
    SCENE_HEIGHT / 2;


/*
 * 將座標吸附到 24px 格線。
 *
 * 這裡使用 Scene 中央作為格線原點，
 * 與目前的 Scene Grid 設定一致。
 */
function snapCoordinateToGrid(value, origin) {

    return (
        origin +
        Math.round(
            (value - origin) /
            SCENE_GRID_SIZE
        ) *
        SCENE_GRID_SIZE
    );

}


/*
 * 圖片吸附：
 *
 * ★ 只處理左上角位置
 * ★ 完全不修改 width / height
 *
 * 因此圖片會「貼著格線開始」，
 * 而不是讓圖片中心卡在格線上。
 */
function snapObjectToGrid(object) {

    if (!object) return;

    object.x =
        Math.round(object.x / SCENE_GRID_SIZE) *
        SCENE_GRID_SIZE;

    object.y =
    Math.round(
        (object.y - 12) / SCENE_GRID_SIZE
    ) *
    SCENE_GRID_SIZE +
    12;
}


/* ==========================================
   拖曳
   支援：
   - 滑鼠
   - 手指觸控
   - 手寫筆
========================================== */

let dragging = false;

let dragObject = null;

let dragStartX = 0;

let dragStartY = 0;

let objectStartX = 0;

let objectStartY = 0;


/* ==========================================
   開始拖曳
========================================== */

function startDrag(e) {

    /*
     * 防止同時啟動 Scene 平移
     */
    e.stopPropagation();

    /*
     * 阻止手機瀏覽器把手指操作
     * 當成頁面滑動 / 縮放
     */
    e.preventDefault();

    const id =
        e.currentTarget.dataset.id;

    selectObject(id);

    const object =
        getSelectedObject();

    if (!object) return;


    /*
     * 畫面元件鎖定後不可拖曳
     *
     * 地形標誌仍然可以拖曳
     */
    if (
        object.type !== "sceneMarker" &&
        object.locked === true
    ) {
        return;
    }


    dragging = true;

    dragObject = object;


    /*
     * Pointer Events 同時支援：
     *
     * 滑鼠
     * 手指
     * 手寫筆
     */
    dragStartX = e.clientX;

    dragStartY = e.clientY;


    objectStartX = object.x;

    objectStartY = object.y;


    /*
     * 讓瀏覽器把後續 pointermove
     * 都交給目前這張圖片
     *
     * 手指拖曳會穩定很多
     */
    if (
        e.currentTarget.setPointerCapture &&
        e.pointerId !== undefined
    ) {
        try {
            e.currentTarget.setPointerCapture(
                e.pointerId
            );
        } catch (error) {
            console.warn(
                "Pointer Capture 啟用失敗：",
                error
            );
        }
    }

}


/* ==========================================
   拖曳中
========================================== */

document.addEventListener(
    "pointermove",
    function(e) {

        if (
            !dragging ||
            !dragObject
        ) {
            return;
        }


        /*
         * 防止手機瀏覽器在拖曳時
         * 同時捲動畫面
         */
        e.preventDefault();


        /*
         * 因為 Scene 可能有縮放，
         * 所以要除以 viewScale。
         */
        const dx =
            (e.clientX - dragStartX) /
            viewScale;

        const dy =
            (e.clientY - dragStartY) /
            viewScale;


        dragObject.x =
            objectStartX + dx;

        dragObject.y =
            objectStartY + dy;


        /*
         * 只有勾選「對齊格線」
         * 才自動吸附。
         */
        if (
            getCurrentScene()?.alignWithGrid === true
        ) {

            snapObjectToGrid(
                dragObject
            );

        }


        /*
         * 更新畫面
         */
        render();

    },
    {
        passive: false
    }
);


/* ==========================================
   結束拖曳
========================================== */

function stopDrag(e) {

    if (!dragging) return;


    /*
     * 如果有 Pointer Capture，
     * 嘗試解除
     */
    if (
        e &&
        e.currentTarget &&
        e.pointerId !== undefined &&
        e.currentTarget.releasePointerCapture
    ) {

        try {

            e.currentTarget.releasePointerCapture(
                e.pointerId
            );

        } catch (error) {

            /* 不需要中斷拖曳結束流程 */

        }

    }


    dragging = false;

    dragObject = null;

}


/*
 * 手指 / 滑鼠 / 手寫筆
 * 都會進入這裡
 */
document.addEventListener(
    "pointerup",
    stopDrag
);


/*
 * 如果手指拖出瀏覽器畫面，
 * 也要強制結束拖曳。
 */
document.addEventListener(
    "pointercancel",
    stopDrag
);

/*
  =========================================================
  SHA-256
  =========================================================
*/

async function sha256Hex(bytes){

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            bytes
        );

    const hashBytes =
        new Uint8Array(hashBuffer);

    return Array.from(hashBytes)
        .map(
            b =>
                b.toString(16)
                 .padStart(2, "0")
        )
        .join("");
}


/*
  =========================================================
  Data URL → Uint8Array
  =========================================================
*/

function dataURLToBytes(dataURL){

    if(!dataURL){
        return null;
    }

    const parts =
        dataURL.split(",");

    if(parts.length !== 2){
        throw new Error(
            "無法解析圖片 Data URL。"
        );
    }

    const base64 =
        parts[1];

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes;
}


/*
  =========================================================
  取得 Data URL MIME
  =========================================================
*/

function getDataURLMime(dataURL){

    if(!dataURL){
        return "image/png";
    }

    const match =
        dataURL.match(
            /^data:([^;,]+)/
        );

    return match
        ? match[1]
        : "image/png";
}


/*
  =========================================================
  MIME → 副檔名
  =========================================================
*/

function getImageExtension(mime){

    switch(mime){

        case "image/jpeg":
            return ".jpg";

        case "image/webp":
            return ".webp";

        case "image/gif":
            return ".gif";

        case "image/svg+xml":
            return ".svg";

        case "image/png":
        default:
            return ".png";

    }

}


/*
  =========================================================
  Uint8Array 合併
  =========================================================
*/

function concatBytes(...arrays){

    let total = 0;

    arrays.forEach(
        array => {
            total += array.length;
        }
    );

    const result =
        new Uint8Array(total);

    let offset = 0;

    arrays.forEach(
        array => {

            result.set(
                array,
                offset
            );

            offset +=
                array.length;

        }
    );

    return result;
}


/*
  =========================================================
  CRC-32
  =========================================================
*/

function crc32(bytes){

    let crc =
        0xffffffff;

    for(
        let i = 0;
        i < bytes.length;
        i++
    ){

        crc ^= bytes[i];

        for(
            let j = 0;
            j < 8;
            j++
        ){

            crc =
                (crc >>> 1) ^
                (
                    0xedb88320 &
                    -(crc & 1)
                );

        }

    }

    return (
        crc ^ 0xffffffff
    ) >>> 0;
}


/*
  =========================================================
  Little Endian 16-bit
  =========================================================
*/

function u16(n){

    return new Uint8Array([

        n & 0xff,

        (n >>> 8) & 0xff

    ]);

}


/*
  =========================================================
  Little Endian 32-bit
  =========================================================
*/

function u32(n){

    return new Uint8Array([

        n & 0xff,

        (n >>> 8) & 0xff,

        (n >>> 16) & 0xff,

        (n >>> 24) & 0xff

    ]);

}


/*
  =========================================================
  建立 Store ZIP
  =========================================================

  ZIP 結構：

      __data.json
      .token
      <sha256>.png
      <sha256>.png
      ...

  與角色製作器使用同一種 ZIP 結構。
*/

function createStoredZip(entries){

    const encoder =
        new TextEncoder();

    const localParts = [];

    const centralParts = [];

    let offset = 0;


    for(
        const entry of entries
    ){

        const nameBytes =
            encoder.encode(
                entry.name
            );

        const data =
            entry.data instanceof Uint8Array
                ? entry.data
                : new Uint8Array(
                    entry.data
                );


        const crc =
            crc32(data);


        /*
          Local File Header
        */

        const localHeader =
            concatBytes(

                u32(0x04034b50),

                u16(20),

                u16(0x0800),

                u16(0),

                u16(0),

                u16(0),

                u32(crc),

                u32(data.length),

                u32(data.length),

                u16(nameBytes.length),

                u16(0),

                nameBytes

            );


        localParts.push(
            localHeader,
            data
        );


        /*
          Central Directory Header
        */

        const centralHeader =
            concatBytes(

                u32(0x02014b50),

                u16(20),

                u16(20),

                u16(0x0800),

                u16(0),

                u16(0),

                u16(0),

                u32(crc),

                u32(data.length),

                u32(data.length),

                u16(nameBytes.length),

                u16(0),

                u16(0),

                u16(0),

                u16(0),

                u32(0),

                u32(offset),

                nameBytes

            );


        centralParts.push(
            centralHeader
        );


        offset +=
            localHeader.length +
            data.length;

    }


    const localData =
        concatBytes(
            ...localParts
        );

    const centralData =
        concatBytes(
            ...centralParts
        );


    /*
      End Of Central Directory
    */

    const endRecord =
        concatBytes(

            u32(0x06054b50),

            u16(0),

            u16(0),

            u16(entries.length),

            u16(entries.length),

            u32(centralData.length),

            u32(localData.length),

            u16(0)

        );


    return concatBytes(

        localData,

        centralData,

        endRecord

    );

}


/* =========================================================
   建立 CCFOLIA Room JSON
   ========================================================= */

async function buildSceneRoom() {

    const resources = {};

    const imageFiles = new Map();

    /*
     * Cocofolia：
     * 一般畫面元件放在 entities.items
     */
    const itemEntities = {};


async function addImage(dataURL) {

    if (!dataURL) {
        return null;
    }


    const bytes =
        dataURLToBytes(dataURL);

    if (!bytes) {
        return null;
    }


    const hash =
        await sha256Hex(bytes);


    /*
     * 所有圖片統一使用 PNG
     */
    const filename =
        hash + ".png";


    if (!imageFiles.has(filename)) {

        imageFiles.set(
            filename,
            {
                name:
                    filename,

                data:
                    bytes
            }
        );

    }


    resources[filename] = {

        type:
            "image/png"

    };


    return filename;

}

    /*
     * Room 本身不再儲存背景 / 前景
     */

    const room = {

        backgroundUrl: null,

        foregroundUrl: null,

        sceneId:
            scenes.length > 0
                ? scenes[0].id
                : null

    };


    /*
     * 建立所有 Scene
     */

    const sceneEntities = {};
    
    /*
 * =====================================================
 * 全場景共用的畫面元件
 *
 * → entities.items
 * =====================================================
 */

for (const object of sharedObjects) {

    /*
     * 將鏡像 / 透明度直接烘進 PNG
     */
    const prepared =
        await prepareObjectImage(
            object
        );

    const imageFilename =
        await addImage(
            prepared
                ? prepared.dataURL
                : object.imageUrl
        );

    const x =
    (object.x - 960)/24;

const y =
    (object.y - 540)/24;

    const width =
        object.width / 24;

    const height =
        object.height / 24;

    itemEntities[object.id] = {

        x:
            x,

        y:
            y,

        z:
            object.z || 0,

        angle:
            object.angle || 0,

        width:
            width,

        height:
            height,

        deckId:
            null,

        locked:
    object.locked === true,

visible:
    object.visible !== false,

        closed:
            false,

        withoutOwner:
            false,

        freezed:
            false,

        type:
            "object",

        active:
    object.visible !== false,

        memo:
            "",

        imageUrl:
            imageFilename,

        coverImageUrl:
            null,

        clickAction:
            null,

        order:
            0

    };

}


    for (const sceneData of scenes) {

        const scene = {

    name:
        sceneData.name,

    backgroundUrl:
        await addImage(
            sceneData.backgroundData
        ),

    foregroundUrl:
        await addImage(
            sceneData.foregroundData
        ),

    /*
     * 前景尺寸：
     * 編輯器使用「格數」儲存
     * 例如 40 × 30
     */
    fieldWidth:
        Number(sceneData.foregroundWidth) || 40,

    fieldHeight:
        Number(sceneData.foregroundHeight) || 30,

    /*
     * true  = 裁切符合前景尺寸
     * false = 直接拉伸
     *
     * Cocofolia：
     * cover = 裁切
     * fill  = 拉伸
     */
    fieldObjectFit:
        sceneData.foregroundFit === true
            ? "cover"
            : "fill",

    /*
     * 對齊格線
     */
    alignWithGrid: sceneData.alignWithGrid === true,

    displayGrid: false,

    gridSize: 1,

    markers: {},

    text: "",

    locked: false,

    order:
        scenes.indexOf(sceneData)

};


/*
 * =====================================================
 * 匯出這個場景裡的物件
 *
 * Cocofolia：
 *
 * 一般「畫面元件」
 * → entities.items
 *
 * 「場景標誌元件」
 * → scenes[sceneId].markers
 * =====================================================
 */

for (
    const object
    of sceneData.objects
) {

    /*
     * 將鏡像 / 透明度直接烘進 PNG
     */
    const prepared =
        await prepareObjectImage(
            object
        );

    const imageFilename =
        await addImage(
            prepared
                ? prepared.dataURL
                : object.imageUrl
        );


    const x =
    (object.x - 960)/24;

const y =
    (object.y - 540)/24;
    

    const width =
        object.width / 24;


    const height =
        object.height / 24;


    const objectId =
        object.id ||
        crypto.randomUUID()
            .replace(/-/g, "")
            .slice(0, 12);


    /*
     * =============================================
     * ① 場景標誌元件
     *
     * type === "sceneMarker"
     * → 存進目前 Scene 的 markers
     * =============================================
     */

    if (object.type === "sceneMarker") {

        scene.markers[objectId] = {

            x:
                x,

            y:
                y,

            z:
                object.z || 0,

            width:
                width,

            height:
                height,

            locked:
                false,

            freezed:
                false,

            text:
                "",

            imageUrl:
                imageFilename,

            clickAction:
                null

        };

    }


    /*
     * =============================================
     * ② 一般畫面元件
     *
     * 不是 sceneMarker
     * → 存進 entities.items
     * =============================================
     */

    else {

        itemEntities[objectId] = {

            x:
                x,

            y:
                y,

            z:
                object.z || 0,

            angle:
                object.angle || 0,

            width:
                width,

            height:
                height,

            deckId:
                null,

            locked:
                false,

            visible:
                true,

            closed:
                false,

            withoutOwner:
                false,

            freezed:
                false,

            type:
                "object",

            active:
                false,

            memo:
                "",

            imageUrl:
                imageFilename,

            coverImageUrl:
                null,

            clickAction:
                null,

            order:
                0

        };

    }

}


        sceneEntities[sceneData.id] =
            scene;

    }


    /*
     * 最終 Room JSON
     */

    const data = {

        meta: {

            version: "1.1.0"

        },

        entities: {

    room: room,

    items:
        itemEntities,

    decks: {},

    notes: {},

    characters: {},

    effects: {},

    scenes:
        sceneEntities,

    savedatas: {},

    snapshots: {}

},

        resources:
            resources

    };


    return {

        data: data,

        imageFiles: imageFiles

    };

}





/*
  =========================================================
  ZIP 匯出
  =========================================================
*/

document
    .getElementById("exportZIP")
    .addEventListener(
        "click",
        async function(){

            const status =
                document.getElementById(
                    "zipStatus"
                );


            try{

                status.style.color =
                    "#aaa";

                status.textContent =
                    "正在建立 CCFOLIA Room ZIP…";


                /*
                  建立場景資料
                */

                const result =
                    await buildSceneRoom();


                const roomData =
                    result.data;


                const imageFiles =
                    result.imageFiles;


                /*
                  ------------------------------------------------
                  __data.json
                  ------------------------------------------------
                */

                const dataJSON =
                    JSON.stringify(
                        roomData,
                        null,
                        2
                    ) + "\n";


                const dataBytes =
                    new TextEncoder().encode(
                        dataJSON
                    );


                /*
                  ------------------------------------------------
                  data.json SHA-256
                  ------------------------------------------------
                */

                const dataHash =
                    await sha256Hex(
                        dataBytes
                    );


                /*
                  ------------------------------------------------
                  .token
                  ------------------------------------------------
                */

                const tokenText =
                    "0." +
                    dataHash;


                const tokenBytes =
                    new TextEncoder().encode(
                        tokenText
                    );


                /*
                  ------------------------------------------------
                  ZIP Entries
                  ------------------------------------------------
                */

                const zipEntries = [

                    {

                        name:
                            "__data.json",

                        data:
                            dataBytes

                    },

                    {

                        name:
                            ".token",

                        data:
                            tokenBytes

                    }

                ];


                /*
                  ------------------------------------------------
                  加入所有圖片
                  ------------------------------------------------
                */

                for(
                    const image
                    of imageFiles.values()
                ){

                    zipEntries.push({

                        name:
                            image.name,

                        data:
                            image.data

                    });

                }


                /*
                  ------------------------------------------------
                  建立 ZIP
                  ------------------------------------------------
                */

                const zipBytes =
                    createStoredZip(
                        zipEntries
                    );


                const blob =
                    new Blob(
                        [zipBytes],
                        {
                            type:
                                "application/zip"
                        }
                    );


                /*
                  ------------------------------------------------
                  ZIP 檔名
                  ------------------------------------------------
                */

                const downloadName =
                    "cocofolia_scene-room.zip";


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;

                a.download =
                    downloadName;


                document.body.appendChild(
                    a
                );

                a.click();

                a.remove();


                setTimeout(
                    () =>
                        URL.revokeObjectURL(
                            url
                        ),
                    1000
                );


                /*
                  ------------------------------------------------
                  完成訊息
                  ------------------------------------------------
                */

                status.style.color =
                    "#7bd99a";

                status.textContent =
                    "✓ CCFOLIA Room ZIP 已建立。\n" +
                    "包含：__data.json、.token、" +
                    imageFiles.size +
                    " 張圖片。";


            }catch(error){

                console.error(
                    "Room ZIP 建立失敗：",
                    error
                );


                status.style.color =
                    "#ff7b7b";

                status.textContent =
                    "❌ Room ZIP 建立失敗：\n" +
                    error.message;

            }

        }
    );


/* ==========================================
   PNG 輸出
========================================== */

document.getElementById("exportPNG")
.addEventListener("click", async function() {

    const canvas =
        document.createElement("canvas");

    const sceneWidth = 1920;
const sceneHeight = 1080;

    canvas.width = sceneWidth;

    canvas.height = sceneHeight;

    const ctx =
        canvas.getContext("2d");


    /*
        背景
    */

    if (getBackgroundData()) {

        const img =
            await loadImage(getBackgroundData());

        ctx.drawImage(
            img,
            0,
            0,
            sceneWidth,
            sceneHeight
        );

    }


    /*
        物件
    */

    const sorted =
        [...getObjects()].sort(
            (a,b) => a.z - b.z
        );


    for (const object of sorted) {

        const img =
            await loadImage(object.imageUrl);

        ctx.save();

        ctx.globalAlpha =
            object.opacity;

        ctx.translate(
            object.x + object.width / 2,
            object.y + object.height / 2
        );

        ctx.rotate(
            object.angle *
            Math.PI /
            180
        );

        ctx.scale(
            object.flipX ? -1 : 1,
            object.flipY ? -1 : 1
        );

        ctx.drawImage(
            img,
            -object.width / 2,
            -object.height / 2,
            object.width,
            object.height
        );

        ctx.restore();

    }


/*
    前景
*/

if (getForegroundData()) {

    const scene =
        getCurrentScene();

    const img =
        await loadImage(
            getForegroundData()
        );

    const gridSize = 24;

const foregroundWidth =
    (Number(scene.foregroundWidth) || 40)
    * gridSize;

const foregroundHeight =
    (Number(scene.foregroundHeight) || 30)
    * gridSize;

    if (scene.foregroundFit === true) {

        /*
         * 等比例縮放 + 中央裁切
         */

        const scale =
            Math.max(
                foregroundWidth / img.width,
                foregroundHeight / img.height
            );

        const drawWidth =
            img.width * scale;

        const drawHeight =
            img.height * scale;

        const offsetX =
            (foregroundWidth - drawWidth) / 2;

        const offsetY =
            (foregroundHeight - drawHeight) / 2;

        const foregroundX =
    (sceneWidth - foregroundWidth) / 2;

const foregroundY =
    (sceneHeight - foregroundHeight) / 2;

ctx.drawImage(
    img,
    foregroundX,
    foregroundY,
    foregroundWidth,
    foregroundHeight
);

    } else {

        /*
         * 不勾選：
         * 直接拉伸到指定前景尺寸
         */

        ctx.drawImage(
            img,
            0,
            0,
            foregroundWidth,
            foregroundHeight
        );

    }

}

    canvas.toBlob(function(blob) {

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "cocofolia_scene.png";

        a.click();

        URL.revokeObjectURL(url);

    });

});


function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.onload = () =>
            resolve(img);

        img.onerror = reject;

        img.src = src;

    });

}

if (scenes.length === 0) {

    const firstScene =

    currentSceneId =

}

renderSceneList();

/* =========================================================
   VIEWPORT
   只控制「觀看方式」
   不會修改物件座標
========================================================= */

let viewScale = 1;
let viewX = 0;
let viewY = 0;

let viewDragging = false;

let viewDragStartX = 0;
let viewDragStartY = 0;

let viewStartX = 0;
let viewStartY = 0;

const MIN_VIEW_SCALE = 0.1;
const MAX_VIEW_SCALE = 2;


/* ---------------------------------------------------------
   更新畫布顯示
--------------------------------------------------------- */

function updateViewport(){

    const scene =
        document.getElementById("scene");

    const zoomValue =
        document.getElementById("zoomValue");

    if(!scene) return;

    scene.style.transform =
        `translate(${viewX}px, ${viewY}px) scale(${viewScale})`;

    if(zoomValue){

        zoomValue.textContent =
            Math.round(viewScale * 100) + "%";

    }

}


/* ---------------------------------------------------------
   限制畫布不要完全跑出工作區
--------------------------------------------------------- */

function clampViewport(){

    const workspace =
        document.getElementById("workspace");

    if(!workspace) return;

    const vw =
        workspace.clientWidth;

    const vh =
        workspace.clientHeight;

    const canvasWidth =
        1920 * viewScale;

    const canvasHeight =
        1080 * viewScale;

    /*
     * 至少保留一部分畫布在畫面內
     */
    const minVisible = 120;

    const maxX =
        Math.max(
            0,
            (canvasWidth + vw) / 2 - minVisible
        );

    const maxY =
        Math.max(
            0,
            (canvasHeight + vh) / 2 - minVisible
        );

    viewX =
        Math.max(
            -maxX,
            Math.min(maxX, viewX)
        );

    viewY =
        Math.max(
            -maxY,
            Math.min(maxY, viewY)
        );

}


/* ---------------------------------------------------------
   設定縮放
--------------------------------------------------------- */

function setViewport(scale, x = viewX, y = viewY){

    viewScale =
        Math.max(
            MIN_VIEW_SCALE,
            Math.min(MAX_VIEW_SCALE, scale)
        );

    viewX = x;
    viewY = y;

    clampViewport();

    updateViewport();

}


/* ---------------------------------------------------------
   Fit：整張 1920 × 1080 顯示在工作區
--------------------------------------------------------- */

function fitCanvas(){

    const workspace =
        document.getElementById("workspace");

    if(!workspace) return;

    const vw =
        workspace.clientWidth;

    const vh =
        workspace.clientHeight;

    const padding = 40;

    const scaleX =
        (vw - padding) / 1920;

    const scaleY =
        (vh - padding) / 1080;

    viewScale =
        Math.min(scaleX, scaleY);

    viewScale =
        Math.max(
            MIN_VIEW_SCALE,
            Math.min(MAX_VIEW_SCALE, viewScale)
        );

    viewX = 0;
    viewY = 0;

    updateViewport();

}


/* ---------------------------------------------------------
   滾輪縮放
--------------------------------------------------------- */

document
.getElementById("workspace")
.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        const rect =
            this.getBoundingClientRect();

        /*
         * 滑鼠相對於工作區中心
         */
        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;

        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;

        /*
         * 找到滑鼠目前對應到 Scene 的哪個位置
         */
        const canvasX =
            (mouseX - viewX) /
            viewScale;

        const canvasY =
            (mouseY - viewY) /
            viewScale;

        const factor =
            e.deltaY < 0
                ? 1.1
                : 0.9;

        const newScale =
            Math.max(
                MIN_VIEW_SCALE,
                Math.min(
                    MAX_VIEW_SCALE,
                    viewScale * factor
                )
            );

        /*
         * 保持滑鼠指向的位置不動
         */
        viewScale = newScale;

        viewX =
            mouseX -
            canvasX * newScale;

        viewY =
            mouseY -
            canvasY * newScale;

        clampViewport();

        updateViewport();

    },
    { passive:false }
);


/* ---------------------------------------------------------
   放大
--------------------------------------------------------- */

document
.getElementById("zoomIn")
.addEventListener("click", function(){

    setViewport(
        viewScale * 1.1
    );

});


/* ---------------------------------------------------------
   縮小
--------------------------------------------------------- */

document
.getElementById("zoomOut")
.addEventListener("click", function(){

    setViewport(
        viewScale * 0.9
    );

});


/* ---------------------------------------------------------
   Fit
--------------------------------------------------------- */

document
.getElementById("fitCanvas")
.addEventListener("click", function(){

    fitCanvas();

});


/* ---------------------------------------------------------
   100%
--------------------------------------------------------- */

document
.getElementById("resetView")
.addEventListener("click", function(){

    setViewport(
        1,
        0,
        0
    );

});


/* ---------------------------------------------------------
   空白區域拖曳
--------------------------------------------------------- */

sceneCanvas.addEventListener(
    "mousedown",
    function(e){

        /*
         * 只有點到 Scene 空白處
         */
        if(e.target !== sceneCanvas) return;

        if(e.button !== 0) return;

        viewDragging = true;

        viewDragStartX = e.clientX;
        viewDragStartY = e.clientY;

        viewStartX = viewX;
        viewStartY = viewY;

        sceneCanvas.style.cursor =
    "grabbing";

        e.preventDefault();

    }
);


/* ---------------------------------------------------------
   平移
--------------------------------------------------------- */

document.addEventListener(
    "mousemove",
    function(e){

        if(!viewDragging) return;

        viewX =
            viewStartX +
            (e.clientX - viewDragStartX);

        viewY =
            viewStartY +
            (e.clientY - viewDragStartY);

        clampViewport();

        updateViewport();

    }
);


/* ---------------------------------------------------------
   結束平移
--------------------------------------------------------- */

document.addEventListener(
    "mouseup",
    function(){

        if(!viewDragging) return;

        viewDragging = false;

        sceneCanvas.style.cursor = "";

    }
);


/* ---------------------------------------------------------
   視窗大小改變
--------------------------------------------------------- */

window.addEventListener(
    "resize",
    function(){

        clampViewport();

        updateViewport();

    }
);


/* ---------------------------------------------------------
   初始 Fit
--------------------------------------------------------- */

requestAnimationFrame(
    function(){

        fitCanvas();

    }
);

</script>
