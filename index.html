<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocofolia 場景建置器</title>

<style>
*{box-sizing:border-box}
:root{
    --bg:#111722;
    --panel:#182130;
    --panel-2:#202b3b;
    --panel-3:#263347;
    --border:#344258;
    --border-soft:#2a3547;
    --text:#edf3fb;
    --muted:#8e9bae;
    --accent:#4d9cff;
    --accent-soft:rgba(77,156,255,.16);
    --danger:#ff6570;
    --success:#5bd6a0;
    --shadow:0 8px 24px rgba(0,0,0,.24);
}
html,body{width:100%;height:100%;margin:0}
body{
    display:flex;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}
button,input,select{font-family:inherit}
button{color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* =========================================================
   左側控制面板
========================================================= */
#sidebar{
    width:350px;
    flex:0 0 350px;
    background:linear-gradient(180deg,#17202e 0%,#121a26 100%);
    border-right:1px solid #2d3a4d;
    padding:14px;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:thin;
    scrollbar-color:#435269 transparent;
}
#sidebar::-webkit-scrollbar{width:7px}
#sidebar::-webkit-scrollbar-thumb{background:#435269;border-radius:10px}
#sidebar::-webkit-scrollbar-track{background:transparent}
#sidebar{transition:width .2s ease,flex-basis .2s ease}
#sidebar.collapsed{width:58px;flex-basis:58px;padding:10px 7px;overflow:hidden}
#sidebar.collapsed > :not(.sidebar-header){display:none!important}
#sidebar.collapsed .sidebar-header{padding:4px 0 10px;flex-direction:column;gap:8px;border-bottom:0;margin:0}
#sidebar.collapsed .sidebar-title,#sidebar.collapsed #openSettings{display:none!important}
#sidebar.collapsed .app-logo{width:38px;height:38px}
#sidebarToggle{flex:0 0 auto;white-space:nowrap;padding:7px 9px}
#sidebar.collapsed #sidebarToggle{width:40px;padding:7px 0}

.sidebar-header{
    display:flex;
    align-items:center;
    gap:11px;
    padding:4px 4px 14px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:12px;
}
.app-logo{
    width:38px;height:38px;flex:0 0 38px;
    display:flex;align-items:center;justify-content:center;
    border-radius:11px;
    background:linear-gradient(145deg,#3f8eea,#2866b6);
    box-shadow:0 5px 16px rgba(39,115,210,.28);
    font-size:20px;
}
.sidebar-title{min-width:0}
.sidebar-title strong{display:block;font-size:16px;line-height:1.25}
.sidebar-title span{display:block;margin-top:3px;color:var(--muted);font-size:11px}

.panel-section{
    margin:0 0 10px;
    background:rgba(27,37,51,.88);
    border:1px solid var(--border-soft);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.section-title{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;
    font-size:13px;font-weight:700;
    color:#dce6f4;
    background:rgba(255,255,255,.018);
    border-bottom:1px solid var(--border-soft);
}
.section-title small{font-size:10px;font-weight:400;color:var(--muted)}
.section-body{padding:10px}
.section-title .section-icon{margin-right:6px;opacity:.9}

/* 新增元件 */
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.add-button{
    min-height:58px!important;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    gap:4px;padding:9px 10px!important;
    text-align:left;
    background:linear-gradient(180deg,#27364a,#222e40)!important;
    border:1px solid #3a4b62!important;
    border-radius:9px!important;
    transition:.15s ease;
}
.add-button:hover{transform:translateY(-1px);background:linear-gradient(180deg,#30435b,#27374c)!important;border-color:#4d7099!important}
.add-button .add-icon{font-size:17px;line-height:1}
.add-button .add-label{font-size:12px;font-weight:600}
.add-button .add-desc{font-size:9px;color:#8998ab;font-weight:400}

.row{display:flex;gap:7px;margin-bottom:7px}
.row:last-child{margin-bottom:0}
.row>button{flex:1;min-width:0}
button{
    min-height:32px;
    background:#293548;
    border:1px solid #3d4c62;
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
    transition:background .12s,border-color .12s,transform .12s;
}
button:hover{background:#34445b;border-color:#52657f}
button:active{transform:translateY(1px)}
button.primary{background:#2d72c8;border-color:#438de7}
button.primary:hover{background:#3984df}
button.danger{color:#ff9ba2;border-color:#66353d}
button.danger:hover{background:#5a2931;color:#fff}
button.full{width:100%}

/* 元件列表 */
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.list-header strong{font-size:11px;color:#aab8ca;font-weight:600}
.list-count{font-size:10px;color:#738198;background:#202b3a;border:1px solid #344257;border-radius:999px;padding:2px 7px}
.object-list{
    border:1px solid var(--border-soft);
    background:#111923;
    border-radius:8px;
    overflow-y:auto;
    max-height:210px;
}
.object-list:empty{display:none}
.object-item{
    min-height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 8px;
    border-bottom:1px solid #253143;
    cursor:pointer;
    font-size:12px;
    transition:background .12s;
}
.object-item:last-child{border-bottom:0}
.object-item:hover{background:#1c2838}
.object-item.selected{background:linear-gradient(90deg,rgba(77,156,255,.18),rgba(77,156,255,.06));box-shadow:inset 3px 0 0 var(--accent)}
.object-item-thumb,.scene-item-thumb{
    width:42px;height:42px;flex:0 0 42px;
    object-fit:contain;
    border-radius:7px;
    background-color:#0d141e;
    background-image:linear-gradient(45deg,#1d2632 25%,transparent 25%),linear-gradient(-45deg,#1d2632 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1d2632 75%),linear-gradient(-45deg,transparent 75%,#1d2632 75%);
    background-size:12px 12px;
    background-position:0 0,0 6px,6px -6px,-6px 0;
    border:1px solid #344258;
}
.object-item-info{min-width:0;flex:1}
.object-item-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7edf6;font-weight:600}
.object-item-meta{display:flex;gap:5px;margin-top:4px;color:#7f8da1;font-size:10px;white-space:nowrap}
.object-item-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.object-state-button{
    width:26px;height:26px;min-height:26px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid transparent;border-radius:6px;
    font-size:13px;line-height:1;
}
.object-state-button:hover{background:#29364a;border-color:#43546b}
.object-list-delete{color:#ff7f88}
.object-list-delete:hover{background:#5a2931;color:#fff;border-color:#8d434d}
.empty-list{padding:15px 10px;text-align:center;color:#667489;font-size:11px}

/* 選取物件 */
#noSelection{padding:16px 10px;text-align:center;color:#718096;font-size:11px}
.selected-preview{
    display:flex;align-items:center;gap:9px;
    padding:8px;background:#111923;border:1px solid #2b384b;border-radius:8px;margin-bottom:9px;
}
.selected-preview img{
    width:52px;height:52px;flex:0 0 52px;object-fit:contain;border-radius:7px;background:#0c131c;border:1px solid #35435a;
}
.selected-preview-info{min-width:0}
.selected-preview-info strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selected-preview-info span{display:block;color:#718097;font-size:10px;margin-top:3px}
.control{margin-bottom:8px}
.control:last-child{margin-bottom:0}
.control label{display:block;font-size:10px;color:#8290a4;margin-bottom:4px}
.control input,.control select{
    width:100%;height:32px;
    background:#101822;color:#edf3fb;
    border:1px solid #344258;border-radius:7px;padding:6px 8px;
}
.control input:hover,.control select:hover{border-color:#465a74}
.control input[type=range]{height:5px;padding:0;accent-color:var(--accent);border:0;background:#344258}
.control input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--accent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.field-title{display:flex;align-items:center;justify-content:space-between}
.field-value{font-size:10px;color:#8ea0b8}
.angle-control{display:flex;gap:7px;align-items:center}
.angle-control #angleInput{width:74px;flex:0 0 74px}
.angle-control #angleRange{flex:1}
.checkbox-row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;width:100%;min-width:0;padding:7px 8px;background:#111923;border:1px solid #2a3749;border-radius:7px}
.checkbox-row label{margin:0;white-space:nowrap;color:#a9b6c7;font-size:11px}
.checkbox-row input[type=checkbox]{flex:0 0 auto;margin:0 0 0 10px}

/* 場景 */
#sceneList{border:1px solid var(--border-soft);background:#111923;border-radius:8px;overflow-y:auto;max-height:260px;min-height:90px;margin-bottom:8px;overscroll-behavior:contain;scrollbar-gutter:stable;touch-action:pan-y}
.scene-list-item{
    display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 8px;
    position:relative;border-bottom:1px solid #253143;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,opacity .16s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
.scene-list-item:last-child{border-bottom:0}
.scene-list-item:hover{background:#1c2838}
.scene-list-item.selected{background:linear-gradient(90deg,rgba(77,156,255,.2),rgba(77,156,255,.05));box-shadow:inset 3px 0 0 var(--accent)}
.scene-list-item.drag-ready{position:relative;z-index:3;transform:translateY(-2px) scale(1.015);background:#24364d;box-shadow:0 5px 16px rgba(0,0,0,.42),0 0 0 1px var(--accent);border-radius:8px}
.scene-list-item.dragging{position:relative;z-index:4;opacity:.96;transform:scale(1.025);background:#2a3c53;box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 0 2px var(--accent);border-radius:8px;cursor:grabbing}
.scene-list-item.drop-before::before,.scene-list-item.drop-after::after{content:"";position:absolute;left:5px;right:5px;height:4px;background:#55b7ff;border-radius:4px;box-shadow:0 0 0 1px rgba(85,183,255,.35),0 0 12px rgba(85,183,255,.95);z-index:8;pointer-events:none}
.scene-list-item.drop-before::before{top:-2px}
.scene-list-item.drop-after::after{bottom:-2px}
.scene-drag-handle{width:22px;height:34px;flex:0 0 22px;display:grid;grid-template-columns:repeat(2,3px);grid-template-rows:repeat(3,3px);align-content:center;justify-content:center;gap:3px;border-radius:6px;color:#8493a8;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.scene-drag-handle span{width:3px;height:3px;border-radius:50%;background:currentColor}
.scene-drag-handle:hover{background:#263448;color:#dce7f6}
.scene-drag-handle:active{cursor:grabbing}
.scene-number{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#253248;color:#aab9cc;font-size:11px;font-weight:700}
.scene-list-item.selected .scene-number{background:#2d72c8;color:white}
.scene-item-thumb{width:38px;height:38px;flex-basis:38px}
.scene-item-info{min-width:0;flex:1}
.scene-item-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600}
.scene-item-meta{display:block;color:#718097;font-size:9px;margin-top:3px}

#sceneEditor{margin-top:8px}
#opacityValue{font-size:10px;color:#8ea0b8}

/* 輸出 */
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.export-button{height:38px;font-weight:700}
#zipStatus{margin-top:8px!important;padding:8px!important;border:1px solid #2b384b!important;border-radius:8px!important;background:#101822!important;color:#7f8da1!important;font-size:10px!important}

/* =========================================================
   工作區
========================================================= */
#workspace{
    flex:1;min-width:0;position:relative;overflow:hidden;
    touch-action:none;
    background-color:#0d131b;
    background-image:
        linear-gradient(45deg,#131c27 25%,transparent 25%),
        linear-gradient(-45deg,#131c27 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#131c27 75%),
        linear-gradient(-45deg,transparent 75%,#131c27 75%);
    background-size:32px 32px;
    background-position:0 0,0 16px,16px -16px,-16px 0;
}
#workspace::before{content:"工作區";position:absolute;top:14px;left:16px;color:#526176;font-size:10px;letter-spacing:1px;pointer-events:none;z-index:2}\n#workspace{cursor:grab}\n#workspace.is-panning{cursor:grabbing}\n#workspace .scene-object{cursor:move}
#bottomToolbarDock{position:absolute;right:16px;bottom:30px;z-index:1000;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
#viewportControls{
    position:relative;right:auto;bottom:auto;z-index:1000;
    display:flex;align-items:center;gap:5px;padding:6px;
    background:rgba(17,24,34,.94);border:1px solid #344258;border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(8px)
}
#viewportControls button{height:30px;min-width:30px;padding:0 8px;background:#202c3c;border:1px solid #3a4b62;border-radius:6px}
#viewportControls button:hover{background:#2d3d53}
#zoomSlider{min-width:70px;max-width:100px}
#redoButton:disabled{opacity:.42;cursor:not-allowed;background:#1a2432;border-color:#2b3749}
#multiSelectButton.active{background:#2d72c8;border-color:#438de7;box-shadow:0 0 0 2px rgba(67,141,231,.22);color:#fff}
#selectionMarquee{position:absolute;z-index:2000;display:none;pointer-events:none;border:1.5px solid rgba(82,166,255,.95);background:rgba(56,139,255,.20);border-radius:2px;box-shadow:0 0 0 1px rgba(10,40,80,.25) inset}
#workspace.multi-select-active{cursor:crosshair}
#workspace.multi-select-active .scene-object{cursor:crosshair}
#undoButton{min-width:34px;font-size:15px}
#undoButton:disabled{opacity:.42;cursor:not-allowed;background:#1a2432;border-color:#2b3749}
#autosaveStatus{position:absolute;right:18px;bottom:7px;z-index:1001;font-size:10px;color:#718097;min-width:0;text-align:right;pointer-events:none;white-space:nowrap;max-width:calc(100% - 36px)}
#objectQuickToolbar{position:relative!important;left:auto!important;top:auto!important;bottom:auto!important;right:auto!important;transform:none!important;gap:5px;padding:6px;flex:0 0 auto;align-self:center}
#objectQuickToolbar button{width:42px;height:42px;min-height:42px;flex:0 0 42px;font-size:20px}
#objectQuickToolbar .quick-divider{height:30px}
@media(max-width:1100px){#bottomToolbarDock{gap:6px;right:8px;bottom:30px;max-width:calc(100% - 16px)}#objectQuickToolbar{gap:1px;padding:4px}#objectQuickToolbar button{width:34px;height:36px;min-height:36px;flex-basis:34px;font-size:17px}#viewportControls{gap:3px;padding:4px}#viewportControls button{padding:0 6px}#zoomSlider{max-width:65px!important}}
#zoomValue{min-width:50px;text-align:center;font-size:11px;color:#c4cfdd}

#background{
    position:absolute;
    left:-3%;
    top:-3%;
    width:106%;
    height:106%;
    object-fit:cover;
    object-position:center center;
    pointer-events:none;
    z-index:0;
    filter:blur(8px) brightness(1);
    transform:scale(1.04);
    opacity:1;
}
#scene{position:absolute;width:1920px;height:1080px;left:50%;top:50%;margin-left:-960px;margin-top:-540px;background:transparent;overflow:visible;transform-origin:center center;box-shadow:none;z-index:1}
#objects{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.scene-object{position:absolute;transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:none;cursor:move;pointer-events:auto}
.scene-object.selected{outline:2px solid var(--accent);outline-offset:1px;filter:drop-shadow(0 0 5px rgba(77,156,255,.25))}
#foreground{position:absolute;left:480px;top:180px;width:960px;height:720px;object-fit:fill;object-position:center center;pointer-events:none;z-index:0}
#sceneGrid{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:100;background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:24px 24px;background-position:0 12px}
.settings-backdrop{position:fixed;inset:0;z-index:5000;background:rgba(3,8,15,.76);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.settings-panel{width:min(620px,96vw);max-height:min(88vh,850px);overflow:auto;background:#182130;border:1px solid #40516a;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.settings-heading{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid #2a3547}
.settings-heading h2{font-size:19px;margin:0}.settings-heading p{font-size:12px;color:#8e9bae;margin:7px 0 0}
.settings-content{padding:18px 22px}.settings-content h3{font-size:13px;margin:4px 0 12px;color:#dce6f4}.settings-content h3:not(:first-child){margin-top:22px}
.settings-content .control label{font-size:12px}.settings-content .control input[type=number]{height:38px}
.settings-content .checkbox-row{margin-top:9px}.settings-footer{display:flex;justify-content:flex-end;padding:14px 22px;border-top:1px solid #2a3547}


/* 複製／貼上快捷選單（支援手機長按；選項僅顯示文字） */
#copyPasteMenu{position:fixed;z-index:10000;display:none;flex-direction:column;align-items:stretch;gap:2px;padding:5px 8px;background:rgba(17,24,34,.98);border:1px solid #52657f;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#copyPasteMenu button{appearance:none;-webkit-appearance:none;display:block;width:100%;min-width:0;min-height:0;padding:7px 5px;margin:0;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#edf3fb;font-size:14px;line-height:1.4;text-align:left;cursor:pointer}
#copyPasteMenu button:hover,#copyPasteMenu button:focus-visible{background:transparent!important;color:#8fc4ff;outline:none}
#copyPasteMenu #touchDeleteButton{color:#ff8b93}

/* 縮放控制點 */
.resize-handle{position:absolute;width:12px;height:12px;margin-left:-6px;margin-top:-6px;background:#4d9cff;border:2px solid #fff;border-radius:50%;z-index:2000;pointer-events:auto;touch-action:none;box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.resize-handle.nw,.resize-handle.se{cursor:nwse-resize}.resize-handle.ne,.resize-handle.sw{cursor:nesw-resize}.resize-handle.n,.resize-handle.s{cursor:ns-resize}.resize-handle.w,.resize-handle.e{cursor:ew-resize}

/* 浮動快捷工具列 */
#objectQuickToolbar{
    position:absolute;display:flex;align-items:center;gap:3px;padding:5px;
    background:rgba(15,22,32,.96);border:1px solid #405068;border-radius:9px;
    box-shadow:0 8px 22px rgba(0,0,0,.4);z-index:1000;pointer-events:auto;white-space:nowrap;backdrop-filter:blur(8px)
}
#objectQuickToolbar button{width:36px;height:36px;min-height:36px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:#dce6f3;border:1px solid transparent;border-radius:0;font-size:17px;line-height:1;flex:0 0 36px}
#objectQuickToolbar button:hover{background:rgba(92,125,165,.22);border-color:transparent;border-radius:5px}
#objectQuickToolbar button:active{background:rgba(92,125,165,.36)}
#objectQuickToolbar button.quick-delete{color:#ff7f88}
#objectQuickToolbar button.quick-delete:hover{background:rgba(180,55,68,.28);color:white;border-color:transparent;border-radius:5px}
.quick-divider{width:1px;height:27px;background:#3c4b60;margin:0 2px}
#objectQuickToolbar button{position:relative}
#objectQuickToolbar button:hover::after{content:attr(title);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);padding:4px 7px;background:#0c121a;color:#fff;border:1px solid #3d4b5e;border-radius:5px;font-size:10px;white-space:nowrap;pointer-events:none;z-index:2000;box-shadow:0 5px 15px rgba(0,0,0,.3)}
/* 工具列位於底部控制列同一個 flex dock，不能沿用舊版的 absolute 定位。 */
#bottomToolbarDock #objectQuickToolbar{position:relative!important;inset:auto!important;transform:none!important;display:none;order:0;visibility:visible;opacity:1;pointer-events:auto}
#bottomToolbarDock #viewportControls{order:1;flex:0 0 auto}
#autosaveStatus{font-size:11px}
#dropHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#536176;pointer-events:none;text-align:center;font-size:13px}

@media(max-width:900px){
    #sidebar{width:310px;flex-basis:310px}
    .add-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- =========================
     左側控制面板
========================= -->
<div id="sidebar">

    <div class="sidebar-header">
        <div class="app-logo">▧</div>
        <div class="sidebar-title">

<script>

/* ==========================================
   資料
========================================== */

/* ==========================================
   場景資料
========================================== */

const scenes = [];

/*
 * =========================================================
 * 全場景共用的「畫面元件」
 *
 * 切換 Scene 時不會消失
 * =========================================================
 */
const sharedObjects = [];

let currentSceneId = null;

let selectedId = null;
let multiSelectMode = false;
const selectedIds = new Set();
let dragGroup = [];
let dragGroupStarts = [];


/* =========================================================
   復原歷史紀錄 + 自動儲存
   ---------------------------------------------------------
   最多保留最近 30 個資料變更動作。
   拖曳 / 縮放會合併成一次動作，避免一次拖曳吃掉大量歷史。
   ========================================================= */

const MAX_HISTORY = 30;
const AUTOSAVE_INTERVAL = 10000;
const AUTOSAVE_DB_NAME = "cocofolia_scene_builder";
const AUTOSAVE_STORE_NAME = "editor_state";
const AUTOSAVE_KEY = "latest";

const historyStack = [];
const redoStack = [];
let historyLastSnapshot = null;
let historyLastSignature = "";
let historyActionBaseline = null;
let historyActionActive = false;
let historyImageIds = new Map();
let historyNextImageId = 1;
let autosaveBusy = false;

const undoButton = document.getElementById("undoButton");
const redoButton = document.getElementById("redoButton");
const redoButtonUnusedGuard = null;
const autosaveStatus = document.getElementById("autosaveStatus");

function getHistoryImageId(value) {
    if (!value) return 0;
    let id = historyImageIds.get(value);
    if (!id) {
        id = historyNextImageId++;
        historyImageIds.set(value, id);
    }
    return id;
}

function cloneObjectForHistory(object) { return { ...object }; }

function cloneEditorState() {
    return {
        scenes: scenes.map(scene => ({
            ...scene,
            objects: Array.isArray(scene.objects) ? scene.objects.map(cloneObjectForHistory) : []
        })),
        sharedObjects: sharedObjects.map(cloneObjectForHistory),
        currentSceneId
    };
}

function editorStateSignature(state = null) {
    const source = state || { scenes, sharedObjects, currentSceneId };
    const parts = [];

    source.sharedObjects.forEach(object => {
        parts.push(["shared",object.id,object.name,object.x,object.y,object.z,object.width,object.height,object.angle,object.opacity,object.flipX?1:0,object.flipY?1:0,object.visible===false?0:1,object.locked===true?1:0,getHistoryImageId(object.imageUrl)].join("|"));
    });

    source.scenes.forEach(scene => {
        parts.push(["scene",scene.id,scene.name,getHistoryImageId(scene.backgroundData),getHistoryImageId(scene.foregroundData),scene.foregroundWidth,scene.foregroundHeight,scene.foregroundFit?1:0,scene.alignWithGrid?1:0,scene.sceneWidth||1920,scene.sceneHeight||1080,scene.showGrid===false?0:1].join("|"));
        (scene.objects || []).forEach(object => {
            parts.push(["marker",object.id,object.name,object.x,object.y,object.z,object.width,object.height,object.angle,object.opacity,object.flipX?1:0,object.flipY?1:0,object.visible===false?0:1,object.locked===true?1:0,object.type||"",getHistoryImageId(object.imageUrl)].join("|"));
        });
    });
    return parts.join("¦");
}

function updateUndoButton() {
    if (undoButton) {
        undoButton.disabled = historyStack.length === 0;
        undoButton.title = historyStack.length ? `返回上一步（Ctrl+Z）· 尚可返回 ${historyStack.length} 步` : "返回上一步（Ctrl+Z）";
    }
    if (redoButton) {
        redoButton.disabled = redoStack.length === 0;
        redoButton.title = redoStack.length ? `重做下一步（Ctrl+Y）· 尚可前進 ${redoStack.length} 步` : "重做下一步（Ctrl+Y）";
    }
}

function resetHistoryBaseline() {
    historyStack.length = 0;
    redoStack.length = 0;
    historyActionBaseline = null;
    historyActionActive = false;
    historyLastSnapshot = cloneEditorState();
    historyLastSignature = editorStateSignature();
    updateUndoButton();
}

function beginHistoryAction() {
    if (historyActionActive) return;
    historyActionBaseline = cloneEditorState();
    historyActionActive = true;
}

function finishHistoryAction() {
    if (!historyActionActive) return;
    const currentSignature = editorStateSignature();
    if (historyActionBaseline && currentSignature !== editorStateSignature(historyActionBaseline)) {
        historyStack.push(historyActionBaseline);
        redoStack.length = 0;
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
    }
    historyActionBaseline = null;
    historyActionActive = false;
    historyLastSnapshot = cloneEditorState();
    historyLastSignature = currentSignature;
    updateUndoButton();
}

function recordHistoryAfterRender() {
    const currentSignature = editorStateSignature();
    if (historyActionActive) return;
    if (historyLastSnapshot && currentSignature !== historyLastSignature) {
        historyStack.push(historyLastSnapshot);
        redoStack.length = 0;
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
    }
    historyLastSnapshot = cloneEditorState();
    historyLastSignature = currentSignature;
    updateUndoButton();
}

function cloneEditorStateFromSnapshot(state) {
    return {
        scenes: (state.scenes || []).map(scene => ({...scene,objects:Array.isArray(scene.objects)?scene.objects.map(cloneObjectForHistory):[]})),
        sharedObjects: (state.sharedObjects || []).map(cloneObjectForHistory),
        currentSceneId: state.currentSceneId || null
    };
}

function restoreEditorState(state) {
    const restored = cloneEditorStateFromSnapshot(state);
    historyActionActive = true;
    scenes.splice(0, scenes.length, ...restored.scenes);
    sharedObjects.splice(0, sharedObjects.length, ...restored.sharedObjects);
    currentSceneId = restored.currentSceneId;
    selectedId = null;
    selectedIds.clear();
    loadCurrentScene();
    renderSceneList();
    render();
    historyActionActive = false;
}

function undoLastAction() {
    if (!historyStack.length || historyActionActive) return;
    redoStack.push(cloneEditorState());
    const previousState = historyStack.pop();
    restoreEditorState(previousState);
    historyLastSnapshot = cloneEditorState();
    historyLastSignature = editorStateSignature();
    updateUndoButton();
    saveEditorStateToStorage();
}

function redoLastAction() {
    if (!redoStack.length || historyActionActive) return;
    historyStack.push(cloneEditorState());
    if (historyStack.length > MAX_HISTORY) historyStack.shift();
    const nextState = redoStack.pop();
    restoreEditorState(nextState);
    historyLastSnapshot = cloneEditorState();
    historyLastSignature = editorStateSignature();
    updateUndoButton();
    saveEditorStateToStorage();
}

function buildPersistedState() {
    return {version:1,savedAt:Date.now(),scenes:scenes,sharedObjects:sharedObjects,currentSceneId};
}

function applyPersistedState(saved) {
    if (!saved || !Array.isArray(saved.scenes) || !Array.isArray(saved.sharedObjects)) return false;
    scenes.splice(0, scenes.length, ...saved.scenes);
    sharedObjects.splice(0, sharedObjects.length, ...saved.sharedObjects);
    currentSceneId = saved.currentSceneId;
    if (!scenes.length) { const firstScene=createScene("場景 1"); scenes.push(firstScene); currentSceneId=firstScene.id; }
    if (!scenes.some(scene=>scene.id===currentSceneId)) currentSceneId=scenes[0].id;
    scenes.forEach(scene=>{
        if(!Array.isArray(scene.objects)) scene.objects=[];
        if(scene.foregroundWidth==null) scene.foregroundWidth=40;
        if(scene.foregroundHeight==null) scene.foregroundHeight=30;
        if(scene.foregroundFit==null) scene.foregroundFit=true;
        if(scene.alignWithGrid==null) scene.alignWithGrid=true;
        if(scene.sceneWidth==null) scene.sceneWidth=1920;
        if(scene.sceneHeight==null) scene.sceneHeight=1080;
        if(scene.showGrid==null) scene.showGrid=true;
    });
    sharedObjects.forEach(object=>{
        if(typeof object.visible!=="boolean") object.visible=true;
        if(typeof object.locked!=="boolean") object.locked=false;
    });
    return true;
}

function setAutosaveStatus(textValue,isSaved=false){
    if(!autosaveStatus)return;
    const now = new Date();
    const time = now.toLocaleTimeString("zh-TW", {hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit"});
    if (isSaved) {
        autosaveStatus.textContent = "自動儲存，最後儲存時間：" + time;
        autosaveStatus.title = "自動儲存，最後儲存時間：" + now.toLocaleString("zh-TW", {hour12:false});
        autosaveStatus.style.color = "#7bd99a";
    } else {
        autosaveStatus.textContent = textValue.includes("空間不足") ? "儲存失敗" : (textValue.includes("儲存中") ? "儲存中…" : (textValue.includes("待機") ? "尚未儲存" : textValue));
        autosaveStatus.title = textValue;
        autosaveStatus.style.color = "#718097";
    }
}

function openAutosaveDB(){
    return new Promise((resolve,reject)=>{
        if(!("indexedDB" in window)){reject(new Error("瀏覽器不支援 IndexedDB"));return;}
        const request=indexedDB.open(AUTOSAVE_DB_NAME,1);
        request.onupgradeneeded=function(){
            const db=request.result;
            if(!db.objectStoreNames.contains(AUTOSAVE_STORE_NAME))db.createObjectStore(AUTOSAVE_STORE_NAME);
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error("自動儲存資料庫開啟失敗"));
    });
}

async function saveEditorStateToStorage(){
    if(autosaveBusy||!scenes.length)return;
    autosaveBusy=true;
    setAutosaveStatus("自動儲存：儲存中…");
    const payload=buildPersistedState();
    try{
        const db=await openAutosaveDB();
        await new Promise((resolve,reject)=>{
            const transaction=db.transaction(AUTOSAVE_STORE_NAME,"readwrite");
            transaction.objectStore(AUTOSAVE_STORE_NAME).put(payload,AUTOSAVE_KEY);
            transaction.oncomplete=resolve;
            transaction.onerror=()=>reject(transaction.error||new Error("IndexedDB 儲存失敗"));
            transaction.onabort=()=>reject(transaction.error||new Error("IndexedDB 儲存中止"));
        });
        db.close();
        setAutosaveStatus("自動儲存：已儲存",true);
    }catch(error){
        console.warn("IndexedDB 自動儲存失敗，改用 localStorage：",error);
        try{
            localStorage.setItem(AUTOSAVE_DB_NAME+"_"+AUTOSAVE_KEY,JSON.stringify(payload));
            setAutosaveStatus("自動儲存：已儲存",true);
        }catch(fallbackError){
            console.error("自動儲存失敗：",fallbackError);
            setAutosaveStatus("自動儲存：空間不足");
        }
    }finally{autosaveBusy=false;}
}

async function loadEditorStateFromStorage(){
    try{
        const db=await openAutosaveDB();
        const saved=await new Promise((resolve,reject)=>{
            const transaction=db.transaction(AUTOSAVE_STORE_NAME,"readonly");
            const request=transaction.objectStore(AUTOSAVE_STORE_NAME).get(AUTOSAVE_KEY);
            request.onsuccess=()=>resolve(request.result||null);
            request.onerror=()=>reject(request.error||new Error("讀取自動儲存失敗"));
        });
        db.close();
        if(saved&&applyPersistedState(saved))return true;
    }catch(error){console.warn("IndexedDB 讀取失敗：",error);}
    try{
        const raw=localStorage.getItem(AUTOSAVE_DB_NAME+"_"+AUTOSAVE_KEY);
        if(raw)return applyPersistedState(JSON.parse(raw));
    }catch(error){console.warn("localStorage 自動儲存讀取失敗：",error);}
    return false;
}

let copiedObjectTemplate = null;
let lastScenePointer = null;
const copyPasteMenu = document.getElementById("copyPasteMenu");
const touchCopyButton = document.getElementById("touchCopyButton");
const touchPasteButton = document.getElementById("touchPasteButton");
const touchDeleteButton = document.getElementById("touchDeleteButton");
let longPressTimer = null;
let longPressStart = null;
let longPressTriggered = false;
let longPressSelectionIds = [];

function copySelectedObjectToClipboard() {
    const object = getSelectedObject();
    if (!object) return false;
    // 深層複製，保留元件原本的所有資料欄位與數值。
    copiedObjectTemplate = JSON.parse(JSON.stringify(object));
    return true;
}

function pasteCopiedObjectAt(clientX = null, clientY = null) {
    if (!copiedObjectTemplate) return false;
    const scene = getCurrentScene();
    if (!scene) return false;
    const source = copiedObjectTemplate;
    // 貼上時保留原本名稱、位置、尺寸、旋轉等全部數值；只產生新的唯一 ID。
    const copy = JSON.parse(JSON.stringify(source));
    copy.id = createId();
    if (copy.type === "sceneMarker") scene.objects.push(copy);
    else sharedObjects.push(copy);
    selectedIds.clear();
    selectedIds.add(copy.id);
    selectedId = copy.id;
    render();
    selectObject(copy.id);
    recordHistoryAfterRender();
    saveEditorStateToStorage();
    return true;
}

function showCopyPasteMenu(x, y, mode) {
    if (!copyPasteMenu) return;
    copyPasteMenu.style.display = "flex";
    touchCopyButton.style.display = mode === "object" ? "block" : "none";
    touchPasteButton.style.display = copiedObjectTemplate ? "block" : "none";
    touchDeleteButton.style.display = (mode === "object" || mode === "multi") ? "block" : "none";
    if (!copiedObjectTemplate) touchPasteButton.style.display = "none";
    const left = Math.max(8, Math.min(x, window.innerWidth - copyPasteMenu.offsetWidth - 8));
    const top = Math.max(8, Math.min(y, window.innerHeight - copyPasteMenu.offsetHeight - 8));
    copyPasteMenu.style.left = left + "px";
    copyPasteMenu.style.top = top + "px";
}
function hideCopyPasteMenu() { if (copyPasteMenu) copyPasteMenu.style.display = "none"; }

touchCopyButton.addEventListener("click", function(e) {
    e.stopPropagation();
    const ok = copySelectedObjectToClipboard();
    hideCopyPasteMenu();
    if (ok) setAutosaveStatus("已複製元件，可切換場景後貼上");
});
touchPasteButton.addEventListener("click", function(e) {
    e.stopPropagation();
    const ok = pasteCopiedObjectAt();
    hideCopyPasteMenu();
    if (!ok) setAutosaveStatus("請先複製一個元件");
});
touchDeleteButton.addEventListener("click", function(e) {
    e.stopPropagation();
    const ids = longPressSelectionIds.slice();
    hideCopyPasteMenu();
    if (ids.length) deleteObjectsByIds(ids);
    else deleteSelectedObject();
});
document.addEventListener("pointerdown", function(e) {
    if (!copyPasteMenu.contains(e.target)) hideCopyPasteMenu();
}, true);

// 長按圖片顯示「複製／貼上」；長按空白處顯示「貼上」。
function beginTouchLongPress(e, mode) {
    if (e.pointerType === "mouse" || (e.button != null && e.button !== 0)) return;
    const target = e.currentTarget;
    const startX = e.clientX;
    const startY = e.clientY;
    longPressTriggered = false;
    longPressStart = { x: startX, y: startY };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function() {
        longPressTriggered = true;
        if (mode === "blank") viewDragging = false;
        let menuMode = mode;
        if (mode === "object") {
            // 長按只顯示操作選單，不繼續拖曳或留下未完成的歷史動作。
            dragging = false;
            dragObject = null;
            finishHistoryAction();
            const obj = target ? getObjects().find(item => item.id === target.dataset.id) : null;
            if (obj) {
                // 長按已在多選集合中的物件時，保留整組選取，讓刪除能作用於全部。
                if (selectedIds.size > 1 && selectedIds.has(obj.id)) {
                    longPressSelectionIds = Array.from(selectedIds);
                    menuMode = "multi";
                } else {
                    selectedIds.clear();
                    selectedIds.add(obj.id);
                    longPressSelectionIds = [obj.id];
                    selectedId = obj.id;
                    selectObject(obj.id);
                    updateSelectionVisual();
                }
            } else {
                longPressSelectionIds = selectedId ? [selectedId] : [];
            }
        } else {
            longPressSelectionIds = selectedIds.size > 1 ? Array.from(selectedIds) : (selectedId ? [selectedId] : []);
        }
        showCopyPasteMenu(startX, startY, menuMode);
    }, 600);
}
function cancelTouchLongPress(e) {
    if (longPressStart && e && Math.hypot(e.clientX - longPressStart.x, e.clientY - longPressStart.y) > 12) clearTimeout(longPressTimer);
}
document.addEventListener("pointerup", function() { clearTimeout(longPressTimer); }, true);
document.addEventListener("pointercancel", function() { clearTimeout(longPressTimer); }, true);
document.addEventListener("pointermove", cancelTouchLongPress, true);

document.addEventListener("keydown",function(e){
    const key = e.key.toLowerCase();
    const modifier = (e.ctrlKey || e.metaKey) && !e.altKey;
    if (!modifier) return;
    const active = document.activeElement;
    if (active && (active.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))) {
        if (key !== "z" && key !== "y") return;
    }
    if (key === "c" && !e.shiftKey) { if (copySelectedObjectToClipboard()) { e.preventDefault(); } }
    else if (key === "v" && !e.shiftKey) { if (copiedObjectTemplate) { e.preventDefault(); pasteCopiedObjectAt(lastScenePointer ? lastScenePointer.x : null, lastScenePointer ? lastScenePointer.y : null); } }
    else if (key === "z" && !e.shiftKey) { e.preventDefault(); undoLastAction(); }
    else if (key === "y" || (key === "z" && e.shiftKey)) { e.preventDefault(); redoLastAction(); }
});

if(undoButton)undoButton.addEventListener("click",undoLastAction);
if(redoButton)redoButton.addEventListener("click",redoLastAction);

function getCurrentScene() {

    return scenes.find(
        scene => scene.id === currentSceneId
    ) || null;

}


/*
 * =========================================================
 * 取得目前畫面上應該顯示的所有元件
 *
 * ① sharedObjects
 *    → 所有場景共用的畫面元件
 *
 * ② scene.objects
 *    → 目前 Scene 專屬的場景標誌元件
 * =========================================================
 */
function getObjects() {

    const scene =
        getCurrentScene();

    if (!scene) {
        return [];
    }

    return [
        ...sharedObjects,
        ...scene.objects
    ];

}


function getBackgroundData() {

    const scene = getCurrentScene();

    return scene ? scene.backgroundData : null;

}


function getForegroundData() {

    const scene = getCurrentScene();

    return scene ? scene.foregroundData : null;

}

   場景管理
========================================== */

function createScene(name = "新場景") {

    return {

        id: createId(),

        name: name,
        sceneWidth: 1920,
        sceneHeight: 1080,
        showGrid: true,

        backgroundData: null,

        foregroundData: null,

        /* 前景設定 */
        foregroundWidth: 40,

        foregroundHeight: 30,

        /* true = 等比例裁切符合尺寸
           false = 直接拉伸符合尺寸 */
        foregroundFit: true,

/*
 * 格線吸附
 *
 * false = 自由移動
 * true  = 拖曳時自動吸附到格線
 */
alignWithGrid: true,

objects: []

        

    };

}


function addScene() {
    const sourceScene = getCurrentScene();
    let scene;

    if (sourceScene) {
        // 新場景複製目前場景的背景、前景設定與場景標誌；圖片資料沿用，物件 ID 則重新產生。
        scene = {
            ...sourceScene,
            id: createId(),
            name: "新場景",
            objects: Array.isArray(sourceScene.objects)
                ? sourceScene.objects.map(object => ({ ...object, id: createId() }))
                : []
        };
    } else {
        scene = createScene("新場景");
    }

    const currentIndex = scenes.findIndex(item => item.id === currentSceneId);
    if (currentIndex === -1) {
        scenes.push(scene);
    } else {
        scenes.splice(currentIndex + 1, 0, scene);
    }

    currentSceneId = scene.id;
    selectedId = null;
    renderSceneList();
    loadCurrentScene();
    render();
    recordHistoryAfterRender();
    saveEditorStateToStorage();
}

document.getElementById("sceneNameInput")
.addEventListener("input", function() {

    const scene = getCurrentScene();

    if (!scene) return;

    scene.name = this.value;

    renderSceneList();

});



function deleteCurrentScene() {

    if (!currentSceneId) return;

    if (scenes.length <= 1) {

        alert("至少要保留一個場景。");

        return;

    }

    const index =
        scenes.findIndex(
            scene => scene.id === currentSceneId
        );

    if (index === -1) return;

    scenes.splice(index, 1);

    currentSceneId =
        scenes[Math.max(0, index - 1)].id;

    selectedId = null;

    renderSceneList();
    loadCurrentScene();

}


function switchScene(id) {

    if (id === currentSceneId) return;

    currentSceneId = id;

    selectedId = null;

    loadCurrentScene();

    renderSceneList();

}


function loadCurrentScene() {

    const scene = getCurrentScene();

    if (!scene) return;

    selectedId = null;

    /* 場景名稱 */
    document.getElementById("sceneNameInput").value =
        scene.name;
        
    /* 場景尺寸與顯示設定 */
    sceneWidthInput.value = scene.sceneWidth ?? 1920;
    sceneHeightInput.value = scene.sceneHeight ?? 1080;
    showGridInput.checked = scene.showGrid ?? true;
    applySceneDimensions();

    /* 前景設定 */
foregroundWidthInput.value =
    scene.foregroundWidth ?? 40;

foregroundHeightInput.value =
    scene.foregroundHeight ?? 30;

foregroundFitInput.checked =
    scene.foregroundFit ?? true;

alignWithGridInput.checked =
    scene.alignWithGrid ?? true;

updateForegroundStyle();

    /* 背景 */
    if (scene.backgroundData) {
        if (background.getAttribute("src") !== scene.backgroundData) background.src = scene.backgroundData;
    } else if (background.hasAttribute("src")) {
        background.removeAttribute("src");
    }

    /* 前景 */
    if (scene.foregroundData) {
        if (foreground.getAttribute("src") !== scene.foregroundData) foreground.src = scene.foregroundData;
    } else if (foreground.hasAttribute("src")) {
        foreground.removeAttribute("src");
    }

    editor.style.display = "none";

    noSelection.style.display = "block";

    render();

    renderSceneList();

}

/* ==========================================
   前景顯示設定
========================================== */

function applySceneDimensions() {
    const scene = getCurrentScene();
    if (!scene) return;
    const width = Math.max(1, Number(scene.sceneWidth) || 1920);
    const height = Math.max(1, Number(scene.sceneHeight) || 1080);
    scene.sceneWidth = width;
    scene.sceneHeight = height;
    sceneCanvas.style.width = width + "px";
    sceneCanvas.style.height = height + "px";
    sceneCanvas.style.marginLeft = (-width / 2) + "px";
    sceneCanvas.style.marginTop = (-height / 2) + "px";
    objectsContainer.style.width = width + "px";
    objectsContainer.style.height = height + "px";
    sceneGrid.style.width = width + "px";
    sceneGrid.style.height = height + "px";
    sceneGrid.style.display = scene.showGrid === false ? "none" : "block";
    updateForegroundStyle();
}

function updateForegroundStyle() {

    const scene =
        getCurrentScene();

    if (!scene) return;

    /*
     * 前景尺寸是「格數」
     * 每格 = 24 × 24 px
     */
    const gridSize = 24;

    const width =
        (Number(scene.foregroundWidth ?? 40))
        * gridSize;

    const height =
        (Number(scene.foregroundHeight ?? 30))
        * gridSize;

    const fit =
        scene.foregroundFit === true;

    /*
     * 1920 × 1080 畫布中央
     */
    const left =
        ((Number(scene.sceneWidth) || 1920) - width) / 2;

    const top =
        ((Number(scene.sceneHeight) || 1080) - height) / 2;

    foreground.style.width =
        width + "px";

    foreground.style.height =
        height + "px";

    foreground.style.left =
        left + "px";

    foreground.style.top =
        top + "px";

    /*
     * true：
     * 等比例縮放 + 裁切
     *
     * false：
     * 直接拉伸
     */
    foreground.style.objectFit =
        fit
            ? "cover"
            : "fill";

}


function renderSceneList() {

    const list = document.getElementById("sceneList");
    list.innerHTML = "";
    const sceneTotalCount = document.getElementById("sceneTotalCount");
    if (sceneTotalCount) sceneTotalCount.textContent = `總場景數：${scenes.length}`;

    scenes.forEach((scene, index) => {
        const div = document.createElement("div");
        div.className = "scene-list-item";
        div.draggable = false;
        div.dataset.sceneId = scene.id;

        if (scene.id === currentSceneId) {
            div.classList.add("selected");
        }

        const dragHandle = document.createElement("span");
        dragHandle.className = "scene-drag-handle";
        dragHandle.setAttribute("role", "button");
        dragHandle.setAttribute("aria-label", "拖曳調整場景順序");
        dragHandle.title = "按住此處上下拖曳排序";
        for (let dot = 0; dot < 6; dot++) dragHandle.appendChild(document.createElement("span"));

        const number = document.createElement("span");
        number.className = "scene-number";
        number.textContent = index + 1;

        const thumb = document.createElement("img");
        thumb.className = "scene-item-thumb";
        thumb.alt = "";
        const previewImage = scene.foregroundData || scene.backgroundData;
        if (previewImage) {
            thumb.src = previewImage;
            thumb.style.visibility = "visible";
        } else {
            thumb.removeAttribute("src");
            thumb.style.visibility = "hidden";
        }

        const info = document.createElement("div");
        info.className = "scene-item-info";

        const name = document.createElement("span");
        name.className = "scene-item-name";
        name.textContent = scene.name || "未命名場景";

        const meta = document.createElement("span");
        meta.className = "scene-item-meta";
        meta.textContent = `${scene.objects.length} 個場景標誌${scene.foregroundData ? " · 有前景" : scene.backgroundData ? " · 有背景" : ""}`;

        info.appendChild(name);
        info.appendChild(meta);
        div.appendChild(number);
        div.appendChild(thumb);
        div.appendChild(info);
        div.appendChild(dragHandle);

        // 只有按住每列最右側的六點拖曳把手才會排序；其餘列區域維持一般點選／滑動。
        let sceneDragging = false;
        let dragPointerId = null;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let autoScrollTimer = null;
        let suppressSceneClick = false;

        function clearSceneDragState() {
            if (autoScrollTimer !== null) clearInterval(autoScrollTimer);
            autoScrollTimer = null;
            sceneDragging = false;
            dragPointerId = null;
            div.classList.remove("drag-ready", "dragging");
            list.querySelectorAll(".drop-before, .drop-after").forEach(item => item.classList.remove("drop-before", "drop-after"));
        }

        function findDropTarget(x, y) {
            let target = document.elementFromPoint(x, y)?.closest(".scene-list-item");
            if (target && list.contains(target)) return target;
            const rect = list.getBoundingClientRect();
            const items = Array.from(list.querySelectorAll(".scene-list-item"));
            if (y < rect.top) return items[0] || null;
            if (y > rect.bottom) return items[items.length - 1] || null;
            return null;
        }

        function updateSceneDrag() {
            if (!sceneDragging) return;
            const rect = list.getBoundingClientRect();
            const edge = 42;
            if (lastPointerY < rect.top + edge) list.scrollTop -= Math.max(4, Math.ceil((rect.top + edge - lastPointerY) / 4));
            else if (lastPointerY > rect.bottom - edge) list.scrollTop += Math.max(4, Math.ceil((lastPointerY - (rect.bottom - edge)) / 4));
            list.querySelectorAll(".drop-before, .drop-after").forEach(item => item.classList.remove("drop-before", "drop-after"));
            const target = findDropTarget(lastPointerX, lastPointerY);
            if (target && target !== div) {
                const targetRect = target.getBoundingClientRect();
                if (lastPointerY < targetRect.top + targetRect.height / 2) target.classList.add("drop-before");
                else target.classList.add("drop-after");
            }
        }

        dragHandle.addEventListener("pointerdown", function(e) {
            if (e.button !== undefined && e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();
            dragPointerId = e.pointerId;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            sceneDragging = true;
            suppressSceneClick = true;
            div.classList.add("dragging");
            try { dragHandle.setPointerCapture(e.pointerId); } catch (_) {}
            autoScrollTimer = setInterval(updateSceneDrag, 35);
            updateSceneDrag();
        });

        dragHandle.addEventListener("pointermove", function(e) {
            if (!sceneDragging || dragPointerId !== e.pointerId) return;
            e.preventDefault();
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            updateSceneDrag();
        });

        function finishScenePointerDrag(e) {
            if (!sceneDragging || dragPointerId !== e.pointerId) return;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            const target = findDropTarget(lastPointerX, lastPointerY);
            if (target && target !== div) {
                const targetId = target.dataset.sceneId;
                const fromIndex = scenes.findIndex(item => item.id === scene.id);
                const targetIndex = scenes.findIndex(item => item.id === targetId);
                if (fromIndex !== -1 && targetIndex !== -1) {
                    const [movedScene] = scenes.splice(fromIndex, 1);
                    const targetRect = target.getBoundingClientRect();
                    let insertIndex = scenes.findIndex(item => item.id === targetId);
                    if (lastPointerY >= targetRect.top + targetRect.height / 2) insertIndex += 1;
                    scenes.splice(insertIndex, 0, movedScene);
                }
            }
            clearSceneDragState();
            renderSceneList();
            recordHistoryAfterRender();
            saveEditorStateToStorage();
        }

        dragHandle.addEventListener("pointerup", finishScenePointerDrag);
        dragHandle.addEventListener("pointercancel", clearSceneDragState);
        dragHandle.addEventListener("lostpointercapture", function() {
            if (sceneDragging) clearSceneDragState();
        });

        div.onclick = function() {
            if (suppressSceneClick) {
                suppressSceneClick = false;
                return;
            }
            switchScene(scene.id);
        };

        list.appendChild(div);
    });

}

/* =========================================================
   圖片標準化
   ---------------------------------------------------------
   所有輸入圖片最後一律重新編碼成 PNG。

   不論原本是：
   PNG / JPG / JPEG / WEBP / GIF ...

   匯出時都會統一成：
   PNG

   這樣可以避免：
   1. 副檔名是 PNG，但實際仍保留不同來源編碼
   2. 後續鏡像 / 透明度處理時格式不一致
   ========================================================= */

const MAX_IMAGE_BYTES = 4.8 * 1024 * 1024;


/*
 * 圖片匯入時的最大尺寸。
 *
 * 但實際圖片仍然會保持原始比例。
 */
const INITIAL_MAX_DIMENSION = 960;


/* File → Data URL */
function fileToDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () =>
            resolve(reader.result);

        reader.onerror = () =>
            reject(
                new Error("圖片讀取失敗。")
            );

        reader.readAsDataURL(file);

    });

}


/* Data URL → Image */
function dataURLToImage(dataURL) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () =>
            resolve(img);

        img.onerror = () =>
            reject(
                new Error("圖片解析失敗。")
            );

        img.src = dataURL;

    });

}


/* Canvas → PNG Data URL */
function canvasToPNG(canvas) {

    return new Promise((resolve, reject) => {

        canvas.toBlob(
            blob => {

                if (!blob) {

                    reject(
                        new Error(
                            "PNG 圖片產生失敗。"
                        )
                    );

                    return;

                }

                const reader =
                    new FileReader();

                reader.onload =
                    () => resolve(
                        reader.result
                    );

                reader.onerror =
                    () => reject(
                        new Error(
                            "PNG 讀取失敗。"
                        )
                    );

                reader.readAsDataURL(blob);

            },
            "image/png"
        );

    });

}

/* Data URL → Uint8Array */
function dataURLToBytes(dataURL) {

    if (!dataURL) {
        return null;
    }

    const base64 = dataURL.split(",")[1];

    if (!base64) {
        return null;
    }

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}

/* 按比例限制最大尺寸 */
function getScaledSize(
    width,
    height,
    maxDimension
) {

    const largest =
        Math.max(width, height);

    if (largest <= maxDimension) {

        return {
            width,
            height
        };

    }

    const scale =
        maxDimension / largest;

    return {

        width:
            Math.max(
                1,
                Math.round(width * scale)
            ),

        height:
            Math.max(
                1,
                Math.round(height * scale)
            )

    };

}


/* =========================================================
   原始圖片 → 統一 PNG

   注意：
   這裡「一定」重新 Canvas → PNG。

   所以即使原圖本來就是 PNG，
   也不再直接保留原始 PNG bytes。
   ========================================================= */

async function prepareImage(file) {

    const originalDataURL =
        await fileToDataURL(file);

    const img =
        await dataURLToImage(
            originalDataURL
        );


    let size =
        getScaledSize(
            img.naturalWidth,
            img.naturalHeight,
            INITIAL_MAX_DIMENSION
        );


    async function createPNG(
        width,
        height
    ) {

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            width;

        canvas.height =
            height;

        const ctx =
            canvas.getContext("2d");

        if (!ctx) {

            throw new Error(
                "瀏覽器無法建立 Canvas。"
            );

        }


        /*
         * 保留透明背景
         */
        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /*
         * 所有圖片統一重新繪製
         */
        ctx.drawImage(
            img,
            0,
            0,
            width,
            height
        );


        const dataURL =
            await canvasToPNG(canvas);


        return {

            dataURL,

            width,

            height,

            bytes:
                dataURLToBytes(
                    dataURL
                )

        };

    }


    let result =
        await createPNG(
            size.width,
            size.height
        );


    /*
     * PNG 超過 4.8 MB
     * 只縮小尺寸，不改成 JPEG
     */
    while (
        result.bytes.length >
        MAX_IMAGE_BYTES
    ) {

        size = {

            width:
                Math.max(
                    1,
                    Math.floor(
                        size.width * 0.9
                    )
                ),

            height:
                Math.max(
                    1,
                    Math.floor(
                        size.height * 0.9
                    )
                )

        };


        result =
            await createPNG(
                size.width,
                size.height
            );


        if (
            size.width <= 1 &&
            size.height <= 1
        ) {

            break;

        }

    }


    return {

        dataURL:
            result.dataURL,

        width:
            result.width,

        height:
            result.height

    };

}

/* =========================================================
   物件圖片處理
   ---------------------------------------------------------
   將：

   flipX
   flipY
   opacity

   直接烘進 PNG 圖片。

   注意：
   rotation 不在這裡處理。

   因為 Cocofolia 的 object 本身有 angle 欄位，
   所以旋轉仍然由 Room JSON 的 angle 控制。
   ========================================================= */

async function prepareObjectImage(object) {

    if (!object || !object.imageUrl) {
        return null;
    }


    const img =
        await dataURLToImage(
            object.imageUrl
        );


    let size =
        getScaledSize(
            img.naturalWidth,
            img.naturalHeight,
            INITIAL_MAX_DIMENSION
        );


    async function createPNG(
        width,
        height
    ) {

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext("2d");

        if (!ctx) {

            throw new Error(
                "瀏覽器無法建立 Canvas。"
            );

        }


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        /*
         * 透明度直接寫進 PNG Alpha
         */
        ctx.globalAlpha =
            Math.max(
                0,
                Math.min(
                    1,
                    Number(object.opacity ?? 1)
                )
            );


        /*
         * 以圖片中心為基準鏡像
         */
        ctx.translate(
            width / 2,
            height / 2
        );


        ctx.scale(
            object.flipX ? -1 : 1,
            object.flipY ? -1 : 1
        );


        ctx.drawImage(
            img,
            -width / 2,
            -height / 2,
            width,
            height
        );


        ctx.globalAlpha = 1;


        const dataURL =
            await canvasToPNG(
                canvas
            );


        return {

            dataURL,

            bytes:
                dataURLToBytes(
                    dataURL
                )

        };

    }


    let result =
        await createPNG(
            size.width,
            size.height
        );


    /*
     * 超過大小就縮小圖片
     */
    while (
        result.bytes.length >
        MAX_IMAGE_BYTES
    ) {

        size = {

            width:
                Math.max(
                    1,
                    Math.floor(
                        size.width * 0.9
                    )
                ),

            height:
                Math.max(
                    1,
                    Math.floor(
                        size.height * 0.9
                    )
                )

        };


        result =
            await createPNG(
                size.width,
                size.height
            );


        if (
            size.width <= 1 &&
            size.height <= 1
        ) {

            break;

        }

    }


    return {

        dataURL:
            result.dataURL,

        width:
            size.width,

        height:
            size.height

    };

}
